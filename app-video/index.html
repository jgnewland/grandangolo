<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>Montaggio Video</title>
<meta name="theme-color" content="#0b100d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Montaggio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Anton&family=Bebas+Neue&family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;700;800&family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b100d;--p1:#131b17;--p2:#1a2620;--p3:#223129;--line:#26392f;
  --text:#eef4f0;--muted:#8aa89a;--accent:#1fb069;--acc2:#76e3aa;--red:#ef4b3f;--blue:#4f8fd6;--green:#4cb36a;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --tlh:clamp(170px,30vh,270px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input[type=file]{display:none}
textarea,input[type=text]{-webkit-user-select:text;user-select:text}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------- HOME ---------- */
#home{padding:calc(var(--st) + 14px) calc(var(--sr) + 18px) calc(var(--sb) + 18px) calc(var(--sl) + 18px);overflow:auto}
#home header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#0e8f5b);display:grid;place-items:center;color:#03220f}
.logo svg{width:22px;height:22px}
#home h1{font-size:21px;margin:0;font-weight:750;letter-spacing:-.01em}
#home h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.bignew{width:100%;display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#2b2412,#1d1a14);border:1px solid #4a3c1c;text-align:left;margin-bottom:12px}
.bignew .plus{width:52px;height:52px;border-radius:15px;background:var(--accent);color:#03220f;display:grid;place-items:center}
.bignew .plus svg{width:30px;height:30px;stroke-width:2.4}
.bignew b{font-size:17px;display:block}
.bignew span{color:var(--muted);font-size:13px}
.homeRow{display:flex;gap:8px;margin-bottom:22px}
.homeRow button{flex:1;padding:12px;border-radius:13px;background:var(--p2);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px}
#home h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:650}
#plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{background:var(--p1);border-radius:14px;overflow:hidden;text-align:left;position:relative;border:1px solid var(--line)}
.pcard .pth{aspect-ratio:1/1;background:#000 center/contain no-repeat}
.pcard .pin{padding:8px 10px 10px}
.pcard b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard small{color:var(--muted);font-size:12px}
.pcard .more{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.pcard .more svg{width:18px;height:18px}
.pcard .dur{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);border-radius:6px;padding:1px 6px;font-size:11px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:14px}
.foot{margin-top:26px;color:var(--muted);font-size:12px;text-align:center}

/* ---------- EDITOR ---------- */
#eh{display:flex;align-items:center;gap:6px;padding:calc(var(--st) + 6px) calc(var(--sr) + 10px) 6px calc(var(--sl) + 6px);background:var(--bg)}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--text)}
.ib:active{background:var(--p2)}
.ib:disabled{opacity:.3}
#ptitle{flex:1;min-width:0;text-align:center;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
#bExport{background:var(--accent);color:#03220f;font-weight:700;border-radius:11px;padding:9px 15px;font-size:14px}
#viewer{flex:1 1 auto;min-height:160px;position:relative;overflow:hidden;background:#000}
#cv,#ov{position:absolute;left:0;top:0}
#ov{touch-action:none}
#emptyMsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);text-align:center;padding:20px}
#emptyMsg button{background:var(--accent);color:#03220f;font-weight:700;border-radius:13px;padding:12px 20px;display:flex;gap:8px;align-items:center}
#ctrl{display:flex;align-items:center;gap:4px;padding:4px calc(var(--sr) + 8px) 4px calc(var(--sl) + 8px);height:50px;background:var(--bg)}
#tc{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);min-width:96px}
#tc b{color:var(--text);font-weight:600}
#bPlay{width:46px;height:46px;border-radius:50%;background:var(--text);color:#111;display:grid;place-items:center;margin:0 auto}
#bPlay svg{width:22px;height:22px;fill:currentColor;stroke:none}
#recBar{display:none;position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--red);color:#fff;border-radius:20px;padding:7px 14px;font-weight:700;gap:8px;align-items:center;z-index:5}
#recBar.on{display:flex}
#recBar i{width:9px;height:9px;border-radius:50%;background:#fff;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}

#tlwrap{height:var(--tlh);position:relative;background:var(--p1);border-top:1px solid var(--line);flex:none}
#tl{position:absolute;inset:0;overflow:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#tl::-webkit-scrollbar{display:none}
#tlIn{position:relative;min-height:100%}
#ruler{position:sticky;top:0;height:22px;z-index:5;background:var(--p1)}
#ruler canvas{position:sticky;left:0;display:block}
.trow{position:relative;margin:5px 0}
.trow.zone{height:22px;margin:2px 0}
body.dragging .trow.zone::after{content:attr(data-l);position:absolute;top:0;bottom:0;left:var(--zl);width:var(--zw);border:1.5px dashed #555b64;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.trow.zone.hot::after{border-color:var(--accent)!important;color:var(--accent)!important;background:#12291d}
.clip{position:absolute;top:0;bottom:0;border-radius:7px;background:var(--cc);touch-action:pan-x pan-y}
.clip .in{position:absolute;inset:0;border-radius:7px;overflow:hidden}
.clip canvas{position:absolute;left:0;top:0;height:100%;pointer-events:none}
.clip .lb{position:absolute;left:6px;top:3px;right:6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none;display:flex;gap:4px;align-items:center}
.clip .bd{background:rgba(0,0,0,.55);border-radius:4px;padding:0 4px;font-size:10px}
.clip.sel{z-index:3}
.clip.sel .in{box-shadow:inset 0 0 0 2px #fff}
.clip .hd{display:none;position:absolute;top:0;bottom:0;width:18px;background:#fff;touch-action:none;z-index:4}
.clip.sel .hd{display:block}
.clip .hd.l{left:-16px;border-radius:7px 0 0 7px}
.clip .hd.r{right:-16px;border-radius:0 7px 7px 0}
.clip .hd::after{content:"";position:absolute;left:7px;top:30%;bottom:30%;width:3px;border-radius:2px;background:#333}
.clip.lifted{opacity:.85;transform:scale(1.03);box-shadow:0 8px 20px rgba(0,0,0,.6);z-index:6}
.junc{position:absolute;width:24px;height:24px;margin-left:-12px;border-radius:6px;background:#e8e6e1;color:#222;display:grid;place-items:center;z-index:4;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.junc svg{width:15px;height:15px;stroke-width:2.2}
.junc.on{background:var(--accent)}
.tside{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;width:48px;font-size:9.5px;color:var(--muted);gap:1px}
.tside svg{width:20px;height:20px}
#phLine{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;z-index:8;pointer-events:none;box-shadow:0 0 4px rgba(0,0,0,.8)}
#phLine::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top:8px solid #fff}
#addMain{position:absolute;right:calc(var(--sr) + 10px);z-index:9;width:40px;height:40px;border-radius:11px;background:#fff;color:#111;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.6)}
#addMain svg{stroke-width:2.6}
#snapDot{position:absolute;top:22px;bottom:0;width:1px;background:var(--accent);z-index:7;display:none;pointer-events:none}

#tools{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:6px calc(var(--sr) + 6px) calc(var(--sb) + 6px) calc(var(--sl) + 6px);background:var(--bg);border-top:1px solid var(--line);min-height:calc(74px + var(--sb));align-items:flex-start;flex:none}
#tools::-webkit-scrollbar{display:none}
.tool{min-width:64px;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;color:#d8d6d0;border-radius:12px;flex:none;padding:0 4px}
.tool:active{background:var(--p2)}
.tool.back{min-width:46px;border-right:1px solid var(--line);border-radius:0;margin-right:4px}
.tool.danger{color:#ff8a80}
.tool.hl svg{color:var(--accent)}

/* ---------- SHEET ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none}
#scrim.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--p1);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .22s ease;max-height:62vh;display:flex;flex-direction:column;padding-bottom:var(--sb)}
#sheet.on{transform:none}
#sheet.tall{max-height:86vh}
#shH{display:flex;align-items:center;gap:8px;padding:10px 12px 6px 18px;flex:none}
#shH::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;border-radius:2px;background:#444a52;margin-left:-18px}
#shT{flex:1;font-weight:700;font-size:16px;padding-top:6px}
#shOk{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#03220f;display:grid;place-items:center;margin-top:4px}
#shOk svg{stroke-width:2.6}
#shB{overflow:auto;padding:4px 18px 18px;-webkit-overflow-scrolling:touch}
.seg{display:flex;background:var(--p2);border-radius:11px;padding:3px;gap:2px;margin:4px 0 12px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--p3);color:var(--text);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;margin:0 -18px;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:20px;background:var(--p2);font-size:13px;border:1.5px solid transparent;white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--acc2);background:#12291d}
.sl{margin:6px 0 14px}
.sl .slh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.sl .slh b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),#3a3f47 var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 1px 5px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#3a3f47}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-bottom:12px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;text-align:center;color:#ddd}
.card .th{width:100%;aspect-ratio:1/1;border-radius:12px;background:var(--p2) center/cover;border:2px solid transparent;display:grid;place-items:center;overflow:hidden}
.card .th canvas{width:100%;height:100%;object-fit:cover}
.card.on .th{border-color:var(--accent)}
.card .th svg{width:30px;height:30px;color:var(--muted)}
.big{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:14px;background:var(--p2);text-align:left;margin-bottom:10px}
.big .bi{width:44px;height:44px;border-radius:12px;background:var(--p3);display:grid;place-items:center;flex:none}
.big b{display:block;font-size:15px}
.big small{color:var(--muted);font-size:12.5px}
.sw{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:2px 18px 12px;margin:0 -18px}
.sw button{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.sw button.on{outline:2.5px solid var(--accent);outline-offset:2px}
.sw label{flex:none;width:34px;height:34px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);display:block;position:relative}
.sw label input{opacity:0;position:absolute;inset:0;width:100%;height:100%}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px}
textarea.tx{width:100%;min-height:86px;border-radius:12px;background:var(--p2);border:1px solid var(--line);padding:12px;font-size:16px;resize:none}
.tog{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.tog input{width:44px;height:26px;-webkit-appearance:none;appearance:none;background:#3a3f47;border-radius:13px;position:relative;transition:.15s}
.tog input::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tog input:checked{background:var(--accent)}
.tog input:checked::after{left:21px}
.trk{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.trk .tn{flex:1;min-width:0}
.trk .tn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .tn small{color:var(--muted);font-size:12px}
.trk .ib{width:38px;height:38px;background:var(--p2)}
.trk .ib.on{background:var(--accent);color:#03220f}
.trk .ib svg{width:20px;height:20px}
.btnrow{display:flex;gap:8px;margin:8px 0}
.btn{flex:1;padding:13px;border-radius:13px;background:var(--p2);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:#03220f}
.btn.red{background:#3a1d1b;color:#ff9a90}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0 10px}

/* ---------- overlay export / dialoghi ---------- */
#busy{position:fixed;inset:0;z-index:60;background:rgba(10,11,13,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center}
#busy.on{display:flex}
#ring{width:150px;height:150px;position:relative}
#ring svg{width:150px;height:150px;transform:rotate(-90deg)}
#ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}
#busyT{font-size:17px;font-weight:700}
#busyS{color:var(--muted);font-size:13px;min-height:18px}
#busy video{max-width:80vw;max-height:46vh;border-radius:12px;background:#000}
#busy .btnrow{width:min(360px,90vw)}
dialog{background:var(--p1);color:var(--text);border:0;border-radius:18px;padding:20px;width:min(380px,90vw);box-shadow:0 20px 60px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 8px;font-size:18px}
dialog .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
dialog .btns button{padding:13px;border-radius:12px;background:var(--p2);font-weight:600}
dialog .btns button.primary{background:var(--accent);color:#03220f}
dialog input[type=text]{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--p2);font-size:16px}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translateX(-50%);background:rgba(40,43,49,.97);padding:10px 16px;border-radius:12px;z-index:80;display:none;max-width:90vw;text-align:center;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none}
#vids{position:fixed;left:-9999px;top:0;width:2px;height:2px;overflow:hidden}
#ghost{display:none}

@media (min-width:900px){
  #editor{max-width:520px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  #sheet{max-width:520px;margin:0 auto}
  #home{max-width:760px;margin:0 auto}
}

.fld{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.fld span{font-size:12.5px;color:var(--muted)}
.fld input,.fld select{font-size:16px;background:#0f1813;border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--text);width:100%}
.clip.msel{z-index:3}
.clip.msel .in{box-shadow:inset 0 0 0 3px #76e3aa;filter:brightness(1.12)}
.clip.msel::after{content:"✓";position:absolute;right:4px;top:3px;width:18px;height:18px;border-radius:50%;background:#76e3aa;color:#03220f;font:700 12px/18px system-ui;text-align:center;z-index:4}
body.selmode .junc{display:none}
svg.autoTL{position:absolute;left:0;top:0;pointer-events:none;z-index:4;overflow:visible}
svg.autoTL polyline{fill:none;stroke:#ffd34d;stroke-width:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
svg.autoTL circle{fill:#ffd34d;stroke:#1a1200;stroke-width:1.5}
.card.brandc{border-color:#1fb069}
.tool.hl svg{color:#76e3aa}
</style>
</head>
<body>
<!-- HOME -->
<section id="home" class="screen on">
  <header><div class="logo" data-i="film"></div><h1>Montaggio Video<small>Grandangolo</small></h1></header>
  <button class="bignew" id="bNew"><div class="plus" data-i="plus"></div><div><b>Nuovo progetto</b><span>Scegli il formato e i video dal telefono</span></div></button>
  <div class="homeRow">
    <button id="bOpenFile"><span data-i="folder"></span>Apri un progetto salvato</button>
    <button id="bInstall" style="display:none"><span data-i="download"></span>Installa l'app</button>
  </div>
  <h2>I tuoi progetti</h2>
  <div id="plist"></div>
  <div class="foot">I progetti restano salvati su questo telefono. Per spostarli su un altro dispositivo usa «Salva come file».</div>
</section>

<!-- EDITOR -->
<section id="editor" class="screen">
  <div id="eh">
    <button class="ib" id="bBack" aria-label="Torna ai progetti" data-i="back"></button>
    <button class="ib" id="bUndo" aria-label="Annulla" data-i="undo"></button>
    <button class="ib" id="bRedo" aria-label="Ripristina" data-i="redo"></button>
    <div id="ptitle">Nuovo video</div>
    <button id="bExport">Esporta</button>
  </div>
  <div id="viewer">
    <canvas id="cv"></canvas><canvas id="ov"></canvas>
    <div id="emptyMsg"><div>Il progetto è vuoto</div><button id="bEmptyAdd"><span data-i="plus"></span>Aggiungi video o foto</button></div>
    <div id="recBar"><i></i><span id="recT">0:00</span> REC · tocca per fermare</div>
  </div>

/* --- formato della tela, con adattamento dei contenuti --- */
function setFormat(f, mode) {
  if (!FORMATS[f]) return; const [w, hh] = FORMATS[f];
  proj.format = f; proj.w = w; proj.h = hh;
  const media = proj.clips.filter(c => c.type === 'video' || c.type === 'image');
  if (mode === 'cover') { proj.bgMode = 'color'; for (const c of media) if (c.scale >= .9) { c.fit = 'cover'; c.scale = 1; c.x = c.y = .5; } }
  else if (mode === 'blur') { proj.bgMode = 'blur'; for (const c of media) if (c.scale >= .9) { c.fit = 'contain'; c.scale = 1; c.x = c.y = .5; } }
  else if (mode === 'contain') { proj.bgMode = 'color'; for (const c of media) if (c.scale >= .9) { c.fit = 'contain'; c.scale = 1; c.x = c.y = .5; } }
  for (const c of proj.clips) if (c.type === 'text' && isSubTrack(trackOf(c.track))) c.y = hh > w ? .74 : .87;
  textCache.clear(); layoutPreview(); commit(); renderAll(); requestDraw();
}
function formatSheet() {
  let mode = proj.clips.some(c => c.type === 'video' || c.type === 'image') ? 'blur' : null;
  openSheet('Formato', b => {
    b.append(h('div', { class: 'grid', style: 'grid-template-columns:repeat(2,1fr)' }, FMT_INFO.map(([f, n, d]) => fmtCard(f, n, d, proj.format === f, () => { if (f !== proj.format) { setFormat(f, mode); toast('Tela ' + f); } refreshSheet(); }))));
    if (mode) b.append(h('div', { class: 'lbl' }, 'Quando cambi formato, i video e le foto…'), chips([['blur', 'Sfondo sfocato'], ['cover', 'Riempiono la tela'], ['contain', 'Bande nere'], ['keep', 'Restano così']], () => mode, v => { mode = v; refreshSheet(); }));
  });
}

/* --- testi: lower third Grandangolo in cima --- */
function textPresetSheet() {
  openSheet('Aggiungi testo', b => {
    const grid = h('div', { class: 'grid', style: 'grid-template-columns:repeat(2,1fr)' });
    grid.append(h('button', { class: 'card brandc', onclick: () => { closeSheet(); const c = addGL3(null, S.playhead, 6, {}); select(c.id); commit(); renderAll(); seekPreview(); setTimeout(() => { S.playhead = c.start + 1.2; syncScroll(); seekPreview(); gl3Sheet(c.id); }, 60); } },
      h('div', { class: 'th', style: 'aspect-ratio:16/9;background:#10241a;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:6px;gap:2px' },
        h('span', { style: 'font:600 7px Archivo,sans-serif;letter-spacing:.1em;color:#76e3aa;background:#07110c;border-left:2px solid #1fb069;padding:1px 4px' }, 'SERVIZIO DI'),
        h('span', { style: 'font:700 10px Archivo,sans-serif;color:#fff;background:#07110c;border-left:3px solid #1fb069;padding:2px 6px' }, 'Lower third')), 'Lower third Grandangolo'));
    for (const p of TEXTS) {
      const s2 = Object.assign(TX0(), p.set), bgc = s2.bg === 'none' ? '#2a2e34' : hexA(s2.bgColor, Math.max(.5, s2.bgOpacity));
      grid.append(h('button', { class: 'card', onclick: () => { closeSheet(); const c = addTextPreset(p.id); textEditSheet(c.id, 'testo', true); } },
        h('div', { class: 'th', style: `aspect-ratio:16/9;background:#2a2e34;display:grid;place-items:center;padding:6px` },
          h('span', { style: `font-family:"${s2.font}";font-weight:${s2.weight};font-style:${s2.italic ? 'italic' : 'normal'};color:${s2.color};background:${s2.bg !== 'none' ? bgc : 'transparent'};padding:2px 6px;border-radius:4px;font-size:15px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;${s2.shadow ? 'text-shadow:0 1px 3px #000' : ''}` }, p.name)), p.d));
    }
    b.append(grid);
  }, { tall: true });
}
function gl3Sheet(id) {
  const c = sc(id), tx = c.text;
  const f = (lbl, key, ph) => h('label', { class: 'fld' }, h('span', {}, lbl), h('input', { type: 'text', value: tx[key] || '', placeholder: ph, enterkeyhint: 'done', oninput: e => { tx[key] = e.target.value; requestDraw(); }, onchange: () => { commit(); renderTL(); } }));
  if (S.playhead < c.start + .7 || S.playhead >= c.start + c.dur - .6) { S.playhead = c.start + Math.min(1.2, c.dur / 2); syncScroll(); seekPreview(); }
  openSheet('Lower third Grandangolo', b => b.append(
    f('Voce sopra il titolo', 'kicker', 'Servizio di… / luogo'), f('Riga 1 — titolo o nome', 'content', 'Titolo'), f('Riga 2 — sottotitolo', 'sub', 'Sottotitolo'),
    slider('Dimensione', () => tx.size, v => tx.size = v, 60, 160, 5, v => Math.round(v) + '%', { def: 100 }),
    slider('Resta a schermo', () => c.dur, v => c.dur = Math.max(1.5, v), 1.5, 30, .5, fmtS, { tl: true }),
    h('p', { class: 'hint' }, 'Entra da sinistra ed esce da solo, come nel player del sito. Nell\'anteprima puoi trascinarlo per spostarlo.')), { clip: id, tall: true });
}

/* --- generatore Grandangolo --- */
function genSheet() {
  const vids0 = [...sources.values()].filter(s => s.type === 'video' && !s.brand);
  if (GEN.main !== 'timeline' && !sources.get(GEN.main)) GEN.main = 'timeline';
  if (GEN.pre && !sources.get(GEN.pre)) GEN.pre = '';
  if (GEN.outro && GEN.outro !== 'brand' && !sources.get(GEN.outro)) GEN.outro = 'brand';
  const sel = (opts, v, on) => h('select', { onchange: e => on(e.target.value) }, opts.map(([a, n]) => h('option', { value: a, selected: a === v }, n)));
  const f = (lbl, key, ph) => h('label', { class: 'fld' }, h('span', {}, lbl), h('input', { type: 'text', value: GEN[key] || '', placeholder: ph, enterkeyhint: 'done', oninput: e => GEN[key] = e.target.value }));
  openSheet('Confezione Grandangolo', b => b.append(
    h('p', { class: 'hint' }, 'Pre-roll → il tuo video con logo e lower third → outro Grandangolo. Come il player del sito.'),
    h('label', { class: 'fld' }, h('span', {}, 'Pre-roll (pubblicità iniziale)'), sel([['', 'Nessun pre-roll'], ...vids0.map(s => [s.id, s.name]), ['__file', '＋ Scegli un video…']], GEN.pre, async v => { if (v === '__file') { const fl = await pickFile('video/*'); if (fl) { busyMsg('Carico il pre-roll…'); const s = await addSourceFromBlob(fl, fl.name); busyMsg(); GEN.pre = s.id; } refreshSheet(); } else GEN.pre = v; })),
    h('label', { class: 'fld' }, h('span', {}, 'Outro (chiusura)'), sel([['brand', 'Outro Grandangolo'], ['', 'Nessun outro'], ...vids0.map(s => [s.id, s.name])], GEN.outro, v => GEN.outro = v)),
    f('Voce sopra il titolo', 'kicker', 'Servizio di… / luogo'), f('Riga 1 — titolo o nome', 'title', 'es. Mario Rossi'), f('Riga 2 — sottotitolo', 'sub', 'es. Sindaco di Agrigento'),
    slider('Lower third: entra dopo', () => GEN.delay, v => GEN.delay = v, 0, 30, .5, fmtS, {}),
    slider('Lower third: resta (0 = sempre)', () => GEN.stay, v => GEN.stay = v, 0, 60, 1, v => v ? fmtS(v) : 'sempre', {}),
    toggleRow('Logo in alto a destra', () => GEN.logo, v => GEN.logo = v),
    toggleRow('Etichetta «Annuncio» sul pre-roll', () => GEN.adTag, v => GEN.adTag = v),
    toggleRow('Passaggi morbidi tra le parti', () => GEN.fades, v => GEN.fades = v),
    h('div', { class: 'btnrow' }, h('button', { class: 'btn pri', onclick: async () => { saveGen(); closeSheet(); GEN.main = 'timeline'; await generateBrand(); } }, svgI('star'), 'Genera'),
      h('button', { class: 'btn', onclick: async () => { const fl = await pickFile('image/*'); if (fl) await brandSetFile('logo', fl); } }, 'Cambia logo'),
      h('button', { class: 'btn', onclick: async () => { const fl = await pickFile('video/*'); if (fl) await brandSetFile('outro', fl); } }, 'Cambia outro'))), { tall: true, onClose: saveGen });
}

/* --- sottotitoli automatici --- */
function subsSheet() {
  if (P.playing) pause();
  const audTr = proj.tracks.filter(t => proj.clips.some(c => c.track === t.id && hasAudio(c)));
  const o = { src: (audTr.find(t => /voce|voice/i.test(t.name)) ? 't:' + audTr.find(t => /voce|voice/i.test(t.name)).id : 'all'), noMus: true, lang: 'italian', model: 'onnx-community/whisper-base', style: 'social', replace: true };
  openSheet('Sottotitoli automatici', b => b.append(
    h('p', { class: 'hint' }, 'La voce viene riconosciuta sul telefono, senza inviare nulla. La prima volta scarica il modello (circa 80 MB «Veloce», 250 MB «Preciso»): meglio col Wi-Fi. Ricontrolla sempre nomi e cognomi.'),
    h('div', { class: 'lbl' }, 'Quale audio'), chips([['all', 'Tutto'], ...audTr.map(t => ['t:' + t.id, t.name])], () => o.src, v => { o.src = v; refreshSheet(); }),
    toggleRow('Ignora la musica', () => o.noMus, v => o.noMus = v),
    h('div', { class: 'lbl' }, 'Precisione'), chips([['onnx-community/whisper-base', 'Veloce'], ['onnx-community/whisper-small', 'Preciso']], () => o.model, v => o.model = v),
    h('div', { class: 'lbl' }, 'Stile'), chips(Object.entries(SUB_STYLES).map(([k, v]) => [k, v.name.replace(/ \(.*/, '')]), () => o.style, v => o.style = v),
    h('div', { class: 'btnrow' }, h('button', { class: 'btn pri', onclick: async () => { closeSheet(); try { await autoSubs(o); } catch (e) { console.error(e); busyClose(); await ask('Sottotitoli non riusciti', 'Non sono riuscito a completare la trascrizione: ' + (e && e.message || e) + '. Serve internet la prima volta, per scaricare il modello.'); } } }, svgI('cc'), 'Crea i sottotitoli'),
      h('button', { class: 'btn', onclick: () => { closeSheet(); exportSRT(); } }, 'Scarica .SRT'))), { tall: true });
}

/* ruota di 90° in senso orario (anche le altre parti dello stesso video, se erano girate uguali) */
function rotate90(c) {
  const before = c.r90 || 0; let n = 0;
  for (const x of proj.clips) if (x === c || (x.src === c.src && (x.r90 || 0) === before && (x.type === 'video' || x.type === 'image'))) { x.r90 = (before + 90) % 360; x.rot = 0; n++; }
  commit(); renderTL(); requestDraw(); seekPreview();
  toast('Ruotato di ' + ((before + 90) % 360 || 360) + '°' + (n > 1 ? ' (' + n + ' parti dello stesso video)' : '') + ' · tocca ancora per continuare');
}
