<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandangolo · Generatore Post Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --panel-dark:#052e17;
    --green:#009048;
    --green-deep:#00602f;
    --lime:#c3d600;
    --lime-soft:#a8c700;
    --ink:#0a1f14;
    --bg:#071a10;
    --card:#0e2418;
    --card-2:#12301f;
    --line:rgba(255,255,255,.10);
    --txt:#eaf3ec;
    --txt-dim:#9fbfa9;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(0,144,72,.25), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(195,214,0,.10), transparent 55%),
      var(--bg);
    color:var(--txt);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:18px 26px;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:5;
    background:rgba(7,26,16,.72);
    backdrop-filter:blur(10px);
  }
  .topbar img{height:34px;display:block}
  .topbar .t{display:flex;flex-direction:column;line-height:1.1}
  .topbar .t b{font-family:'Oswald';font-weight:600;letter-spacing:.5px;font-size:16px}
  .topbar .t span{font-size:12px;color:var(--txt-dim)}
  .topbar .tag{
    margin-left:auto;font-family:'Oswald';font-weight:600;font-size:11px;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--panel-dark);background:var(--lime);
    padding:5px 11px;border-radius:999px;
  }

  .wrap{
    display:grid;grid-template-columns:minmax(340px,420px) 1fr;gap:0;
    max-width:1240px;margin:0 auto;min-height:calc(100vh - 72px);
  }
  .controls{padding:26px 26px 60px;border-right:1px solid var(--line)}
  .stage{
    padding:34px 26px;display:flex;flex-direction:column;align-items:center;gap:18px;
    position:sticky;top:72px;align-self:start;height:calc(100vh - 72px);
    overflow:auto;
  }

  .group{margin-bottom:22px}
  .group>label{
    display:block;font-family:'Oswald';font-weight:600;text-transform:uppercase;
    letter-spacing:1.2px;font-size:12px;color:var(--lime-soft);margin-bottom:9px;
  }
  .hint{font-size:11.5px;color:var(--txt-dim);margin-top:7px;line-height:1.5}

  input[type=text],textarea{
    width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:11px 13px;font:inherit;font-size:14px;resize:vertical;
    transition:border-color .15s, box-shadow .15s;
  }
  textarea{min-height:64px;line-height:1.45}
  input[type=text]:focus,textarea:focus{
    outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(0,144,72,.22);
  }
  .counter{float:right;font-size:11px;color:var(--txt-dim);font-weight:500}

  /* segmented */
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
  .seg button{
    flex:1;border:0;background:transparent;color:var(--txt-dim);font:inherit;font-size:12.5px;font-weight:600;
    padding:9px 4px;border-radius:7px;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .seg button.on{background:var(--green);color:#fff}

  /* presets */
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chips button{
    border:1px solid var(--line);background:var(--card);color:var(--txt);
    font-family:'Oswald';font-weight:500;letter-spacing:.6px;font-size:12px;text-transform:uppercase;
    padding:7px 12px;border-radius:999px;cursor:pointer;transition:.15s;
  }
  .chips button:hover{border-color:var(--green)}
  .chips button.on{background:var(--lime);border-color:var(--lime);color:var(--panel-dark)}

  /* dropzone */
  .drop{
    border:1.5px dashed rgba(255,255,255,.22);border-radius:12px;background:var(--card);
    padding:20px;text-align:center;cursor:pointer;transition:.15s;color:var(--txt-dim);
  }
  .drop:hover,.drop.hot{border-color:var(--lime);background:var(--card-2);color:var(--txt)}
  .drop b{color:var(--txt);font-weight:600}
  .drop .ico{font-size:26px;display:block;margin-bottom:6px}
  .photo-tools{margin-top:12px;display:none}
  .photo-tools.show{display:block}
  .slider-row{display:flex;align-items:center;gap:12px;margin-top:10px}
  .slider-row span{font-size:12px;color:var(--txt-dim);width:64px;flex:none}
  input[type=range]{flex:1;accent-color:var(--green)}
  .linkbtn{background:none;border:0;color:var(--lime-soft);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;padding:0;margin-top:10px}

  .switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .switch input{display:none}
  .switch .track{width:42px;height:24px;background:var(--card);border:1px solid var(--line);border-radius:999px;position:relative;transition:.15s}
  .switch .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--txt-dim);transition:.15s}
  .switch input:checked + .track{background:var(--green);border-color:var(--green)}
  .switch input:checked + .track::after{left:20px;background:#fff}
  .switch label{font-size:13.5px}

  .dl{
    width:100%;margin-top:6px;border:0;cursor:pointer;color:#04240f;
    background:linear-gradient(90deg,var(--lime),#d9e63a);
    font-family:'Oswald';font-weight:600;letter-spacing:.8px;text-transform:uppercase;font-size:15px;
    padding:15px;border-radius:12px;transition:.15s;box-shadow:0 8px 26px -10px rgba(195,214,0,.6);
  }
  .dl:hover{filter:brightness(1.05)}
  .dl:active{transform:translateY(1px)}

  /* preview canvas */
  .frame{
    box-shadow:0 30px 70px -24px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
    border-radius:8px;overflow:hidden;background:#000;line-height:0;
  }
  #cv{display:block;width:auto;max-height:calc(100vh - 190px);max-width:100%}
  .stage-meta{font-size:12px;color:var(--txt-dim);text-align:center}
  .stage-meta b{color:var(--txt)}

  @media (max-width:900px){
    .wrap{grid-template-columns:1fr}
    .controls{border-right:0;order:2}
    .stage{position:static;height:auto;order:1;border-bottom:1px solid var(--line)}
    #cv{max-height:62vh}
  }
</style>
</head>

    <div class="tag">Editor</div>

  <div class="wrap">
    <!-- PREVIEW -->
    <section class="stage">
      <div class="frame"><canvas id="cv" width="1080" height="1350"></canvas></div>
      <div class="stage-meta">Anteprima in tempo reale · <b id="dim">1080 × 1350 px</b></div>
    </section>

    <!-- CONTROLS -->
    <section class="controls">
      <div class="group">
        <label>Formato</label>
        <div class="seg" id="fmt">
          <button data-f="portrait" class="on">Verticale 4:5</button>
          <button data-f="square">Quadrato 1:1</button>
          <button data-f="story">Storia 9:16</button>
        </div>
      </div>

      <div class="group">
        <label>Foto in evidenza</label>
        <div class="drop" id="drop">
          <span class="ico">◎</span>
          <div><b>Trascina qui</b> la foto o clicca per caricarla</div>
        </div>
        <input type="file" id="file" accept="image/*" hidden>
        <div class="photo-tools" id="ptools">
          <div class="slider-row"><span>Zoom</span><input type="range" id="zoom" min="100" max="260" value="100"></div>
          <div class="slider-row"><span>Posizione</span><input type="range" id="posy" min="0" max="100" value="50"></div>
          <button class="linkbtn" id="rmphoto">Rimuovi foto</button>
        </div>
      </div>

      <div class="group">
        <label>Categoria</label>
        <input type="text" id="kicker" maxlength="26" placeholder="Es. Cronaca">
        <div class="chips" id="presets" style="margin-top:10px">
          <button>Ultim'ora</button><button>Cronaca</button><button>Politica</button>
          <button>Attualità</button><button>Sport</button><button>Eventi</button>
          <button>Cultura</button><button>Territorio</button>
        </div>
      </div>

      <div class="group">
        <label>Titolo <span class="counter" id="cT">0/90</span></label>
        <textarea id="title" maxlength="90" placeholder="Scrivi il titolo della notizia…"></textarea>
      </div>

      <div class="group">
        <label>Sommario <span class="counter" id="cS">0/180</span></label>
        <textarea id="summary" maxlength="180" placeholder="Un breve riassunto della notizia in 1-2 frasi…"></textarea>
      </div>

      <div class="group">
        <label>Sito da mostrare</label>
        <div class="seg" id="site">
          <button data-s="grandangoloagrigento.it" class="on">Agrigento</button>
          <button data-s="grandangolosettimanale.it">Settimanale</button>
          <button data-s="grandangoloregionale.it">Regionale</button>
        </div>
      </div>

      <div class="group">
        <label>Opzioni</label>
        <label class="switch" style="margin-bottom:12px">
          <input type="checkbox" id="showDate" checked><span class="track"></span>
          <label>Mostra la data di oggi</label>
        </label>
        <label class="switch">
          <input type="checkbox" id="showHandle" checked><span class="track"></span>
          <label>Mostra il sito nel post</label>
        </label>
      </div>

      <button class="dl" id="download">⤓ Scarica il post PNG</button>
      <p class="hint">Il file esce in alta risoluzione (1080 px), pronto per essere pubblicato come post su Instagram.</p>
    </section>
  </div>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

const state = {
  format:'portrait',
  photo:null, zoom:1, posy:0.5,
  kicker:'Ultim\u2019ora',
  title:'',
  summary:'',
  showDate:true,
  showHandle:true,
  site:'grandangoloagrigento.it',
};

// brand palette
const C = {
  panelTop:'#0a7d3e', panelBot:'#04250f',
  green:'#009048', lime:'#c3d600', limeSoft:'#a8c700',
  red:'#e01f1f',
  white:'#ffffff'
};

const logoImg = new Image();
let logoReady=false;
logoImg.onload=()=>{logoReady=true;render()};
logoImg.src=LOGO_SRC;

const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function todayStr(){const d=new Date();return d.getDate()+' '+MESI[d.getMonth()]+' '+d.getFullYear();}

/* ---------- helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function wrap(text,maxW){
  const words=text.replace(/\s+/g,' ').trim().split(' ');
  if(!words[0])return [];
  const lines=[];let cur=words[0];
  for(let i=1;i<words.length;i++){
    const t=cur+' '+words[i];
    if(ctx.measureText(t).width<=maxW)cur=t;else{lines.push(cur);cur=words[i];}
  }
  lines.push(cur);return lines;
}

function drawCover(img,x,y,w,h,zoom,posy){
  const s=Math.max(w/img.width,h/img.height)*zoom;
  const dw=img.width*s, dh=img.height*s;
  const dx=x+(w-dw)/2;
  const dy=y+(h-dh)*posy;
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.drawImage(img,dx,dy,dw,dh);ctx.restore();
}

/* ---------- main render ---------- */
function render(){
  const W=1080;
  const FMT={
    portrait:{H:1350, ratio:0.55, tSize:92, tMax:4, sMax:3, safe:0},
    square:  {H:1080, ratio:0.52, tSize:80, tMax:3, sMax:2, safe:0},
    story:   {H:1920, ratio:0.58, tSize:100, tMax:5, sMax:3, safe:150},
  };
  const F=FMT[state.format]||FMT.portrait;
  const H=F.H;
  cv.height=H; cv.width=W;
  const pad=84;

  // panel proportion
  const photoH = Math.round(H*F.ratio);
  const panelTop=photoH;

  // base panel gradient (fills whole, photo drawn on top of upper part)
  let pg=ctx.createLinearGradient(0,panelTop,0,H);
  pg.addColorStop(0,C.panelTop);pg.addColorStop(1,C.panelBot);
  ctx.fillStyle=C.panelBot;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=pg;ctx.fillRect(0,panelTop,W,H-panelTop);

  // aperture-ring watermark (signature, echoes the logo lens)
  ctx.save();
  ctx.beginPath();ctx.rect(0,panelTop,W,H-panelTop);ctx.clip();
  ctx.globalAlpha=0.10;ctx.lineWidth=26;
  ctx.strokeStyle=C.lime;
  const cx=W-70, cy=H-70, rad=230;
  for(let k=0;k<6;k++){
    ctx.beginPath();
    const a0=k*(Math.PI/3)+0.12, a1=a0+(Math.PI/3)-0.30;
    ctx.arc(cx,cy,rad,a0,a1);ctx.stroke();
  }
  ctx.restore();

  // photo area
  if(state.photo){
    drawCover(state.photo,0,0,W,photoH,state.zoom,state.posy);
    // subtle bottom vignette so the divider pops
    let vg=ctx.createLinearGradient(0,photoH-150,0,photoH);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.32)');
    ctx.fillStyle=vg;ctx.fillRect(0,photoH-150,W,150);
    // top gradient for date legibility
    let tg=ctx.createLinearGradient(0,0,0,190);
    tg.addColorStop(0,'rgba(0,0,0,.35)');tg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=tg;ctx.fillRect(0,0,W,190);
  } else {
    // empty state
    let eg=ctx.createLinearGradient(0,0,0,photoH);
    eg.addColorStop(0,'#0c8a45');eg.addColorStop(1,'#046a34');
    ctx.fillStyle=eg;ctx.fillRect(0,0,W,photoH);
    ctx.globalAlpha=.18;ctx.strokeStyle='#fff';ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(W/2,photoH/2-10,90,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(W/2,photoH/2-10,54,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(255,255,255,.82)';ctx.textAlign='center';
    ctx.font="600 34px Oswald, sans-serif";
    ctx.fillText('FOTO IN EVIDENZA',W/2,photoH/2+120);
    ctx.font="400 22px Inter, sans-serif";
    ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.fillText('Carica un\u2019immagine dal pannello a lato',W/2,photoH/2+158);
    ctx.textAlign='left';
  }

  // lime lower-third divider bar
  ctx.fillStyle=C.lime;ctx.fillRect(0,panelTop-8,W,8);

  // date pill (top-right over photo)
  if(state.showDate){
    ctx.font="600 26px Oswald, sans-serif";
    const dt=todayStr().toUpperCase();
    const dw=ctx.measureText(dt).width;
    const pw=dw+38, ph=48, px=W-pad-pw, py=44;
    ctx.fillStyle='rgba(4,37,15,.72)';rr(px,py,pw,ph,ph/2);ctx.fill();
    ctx.fillStyle=C.lime;ctx.textBaseline='middle';
    ctx.fillText(dt,px+19,py+ph/2+1);
    ctx.textBaseline='alphabetic';
  }

  /* ----- panel content ----- */
  let y = panelTop + 48;

  // kicker pill
  const kick=(state.kicker||'').trim().toUpperCase();
  if(kick){
    const isBreaking = kick.replace(/['\u2019\s]/g,'').toLowerCase()==='ultimora';
    ctx.font="600 30px Oswald, sans-serif";
    const kw=ctx.measureText(kick).width;
    const kpw=kw+44, kph=56;
    ctx.fillStyle=isBreaking?C.red:C.lime;rr(pad,y,kpw,kph,10);ctx.fill();
    ctx.fillStyle=isBreaking?'#ffffff':'#052e17';ctx.textBaseline='middle';
    ctx.fillText(kick,pad+22,y+kph/2+2);
    ctx.textBaseline='alphabetic';
    y+=kph+30;
  } else { y+=14; }

  // footer reserve
  const footerH = 96;
  const footerY = H - footerH - F.safe;

  // summary lines (fixed size)
  const sMaxW=W-2*pad;
  ctx.font="400 32px Inter, sans-serif";
  let sLines = state.summary.trim()? wrap(state.summary,sMaxW):[];
  const sLH=44;
  const sMaxLines = F.sMax;
  if(sLines.length>sMaxLines){sLines=sLines.slice(0,sMaxLines);
    let last=sLines[sMaxLines-1];
    while(ctx.measureText(last+'\u2026').width>sMaxW && last.length>1)last=last.slice(0,-1);
    sLines[sMaxLines-1]=last.replace(/[\s,;:]+$/,'')+'\u2026';
  }
  const summaryBlockH = sLines.length? sLines.length*sLH+30 : 0;

  // title auto-fit
  const availForTitle = footerY - 34 - y - summaryBlockH;
  let tSize = F.tSize;
  let tLines=[];
  const tMaxLines = F.tMax;
  const titleText = state.title.trim()|| (state.photo||kick||state.summary?'':'Il tuo titolo qui');
  const isPlaceholder = !state.title.trim();
  while(tSize>=44){
    ctx.font="700 "+tSize+"px Oswald, sans-serif";
    tLines=wrap(titleText,W-2*pad);
    const th=tLines.length*(tSize*1.02);
    if(tLines.length<=tMaxLines && th<=availForTitle) break;
    tSize-=2;
  }
  const tLH=tSize*1.02;

  // draw title
  ctx.fillStyle=isPlaceholder?'rgba(255,255,255,.30)':C.white;
  ctx.font="700 "+tSize+"px Oswald, sans-serif";
  let ty=y+tSize*0.86;
  for(const ln of tLines){ctx.fillText(ln,pad,ty);ty+=tLH;}

  // draw summary
  if(sLines.length){
    let sy=ty+6;
    ctx.font="400 32px Inter, sans-serif";
    ctx.fillStyle='rgba(255,255,255,.86)';
    for(const ln of sLines){ctx.fillText(ln,pad,sy+22);sy+=sLH;}
  }

  // footer rule
  ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad,footerY);ctx.lineTo(W-pad,footerY);ctx.stroke();

  // footer: logo left + handle right
  if(logoReady){
    const lh=60, lw=logoImg.width*(lh/logoImg.height);
    ctx.drawImage(logoImg,pad,footerY+(footerH-lh)/2-1,lw,lh);
  }
  if(state.showHandle){
    ctx.font="600 27px Oswald, sans-serif";
    ctx.fillStyle=C.lime;ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(state.site,W-pad,footerY+footerH/2);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
  }

  document.getElementById('dim').textContent = W+' × '+H+' px';
}

/* ---------- wiring ---------- */
const $=id=>document.getElementById(id);

// format
$('fmt').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  state.format=b.dataset.f;
  [...$('fmt').children].forEach(x=>x.classList.toggle('on',x===b));
  render();
});

// site selector
$('site').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  state.site=b.dataset.s;
  [...$('site').children].forEach(x=>x.classList.toggle('on',x===b));
  render();
});

// photo
const drop=$('drop'), file=$('file');
drop.addEventListener('click',()=>file.click());
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hot')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hot')}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)loadPhoto(f)});
file.addEventListener('change',e=>{const f=e.target.files[0];if(f)loadPhoto(f)});
function loadPhoto(f){
  const img=new Image();
  img.onload=()=>{state.photo=img;$('ptools').classList.add('show');
    drop.querySelector('div').innerHTML='<b>Foto caricata</b> · clicca per sostituirla';render();};
  img.src=URL.createObjectURL(f);
}
$('zoom').addEventListener('input',e=>{state.zoom=e.target.value/100;render()});
$('posy').addEventListener('input',e=>{state.posy=e.target.value/100;render()});
$('rmphoto').addEventListener('click',()=>{
  state.photo=null;$('ptools').classList.remove('show');
  $('zoom').value=100;$('posy').value=50;state.zoom=1;state.posy=.5;
  drop.querySelector('div').innerHTML='<b>Trascina qui</b> la foto o clicca per caricarla';render();
});

// kicker + presets
$('kicker').value=state.kicker;
$('kicker').addEventListener('input',e=>{
  state.kicker=e.target.value;
  [...$('presets').children].forEach(b=>b.classList.toggle('on',b.textContent.toUpperCase()===e.target.value.trim().toUpperCase()));
  render();
});
$('presets').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  state.kicker=b.textContent;$('kicker').value=b.textContent;
  [...$('presets').children].forEach(x=>x.classList.toggle('on',x===b));
  render();
});
[...$('presets').children].forEach(b=>b.classList.toggle('on',b.textContent.toUpperCase()===state.kicker.toUpperCase()));

// text
$('title').addEventListener('input',e=>{state.title=e.target.value;$('cT').textContent=e.target.value.length+'/90';render()});
$('summary').addEventListener('input',e=>{state.summary=e.target.value;$('cS').textContent=e.target.value.length+'/180';render()});

// switches
$('showDate').addEventListener('change',e=>{state.showDate=e.target.checked;render()});
$('showHandle').addEventListener('change',e=>{state.showHandle=e.target.checked;render()});

// download
$('download').addEventListener('click',()=>{
  render();
  const slug=(state.title||'grandangolo').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'post';
  const d=new Date();const ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  cv.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='grandangolo-'+slug+'-'+ds+'.png';
    a.click();URL.revokeObjectURL(a.href);
  },'image/png');
});

// fonts then first render
function boot(){render();}
if(document.fonts && document.fonts.ready){
  Promise.all([
    document.fonts.load("700 100px Oswald"),
    document.fonts.load("600 40px Oswald"),
    document.fonts.load("500 40px Oswald"),
    document.fonts.load("400 40px Inter"),
    document.fonts.load("600 40px Inter"),
  ]).then(boot).catch(boot);
  document.fonts.ready.then(render);
}else{boot();}
</script>
