<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Montaggio Video — Grandangolo</title>
<meta name="theme-color" content="#111215">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;700;800&family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111215;--panel:#1a1c20;--panel2:#24272c;--panel3:#2c3036;--line:#30343b;
  --text:#ece9e3;--muted:#a3a5aa;--accent:#e3a63c;--red:#e5493e;--ok:#5cb870;--blue:#4f8fd6;
  --hw:168px;--th:74px;--rh:26px;--tlh:40vh
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;min-height:32px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:hover{border-color:#50555e;background:var(--panel3)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--accent);border-color:var(--accent);color:#1d1400}
button.primary{background:var(--accent);border-color:var(--accent);color:#1d1400;font-weight:600}
button.rec{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--panel3)}
button svg{width:16px;height:16px;flex:none}
select,input[type=number],input[type=text],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-height:30px}
textarea{width:100%;resize:vertical;min-height:70px}
input[type=range]{accent-color:var(--accent);width:100%;min-width:0}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
input[type=color]{width:38px;height:30px;padding:0 2px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.muted{color:var(--muted)}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* toolbar */
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#brand{font-weight:700;letter-spacing:.02em;margin-right:4px;display:flex;align-items:center;gap:7px}
#brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
#pname{width:170px}
.sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.grow{flex:1}

/* work area */
#work{flex:1;min-height:0;display:flex}
#side{width:272px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side.hide{display:none}
.stabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line)}
.stabs button{flex:1;border-radius:7px 7px 0 0;border-bottom:none;min-height:30px;padding:4px 4px;font-size:12px}
.stabs button.on{background:var(--panel3);color:var(--text);border-color:var(--line)}
.spane{flex:1;overflow:auto;padding:8px;display:none}
.spane.on{display:block}
.spane h4{margin:12px 2px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.spane h4:first-child{margin-top:2px}
.libitem{display:flex;align-items:center;gap:7px;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:6px;touch-action:pan-y}
.libitem .lthumb{width:64px;height:38px;flex:none;border-radius:4px;background:#000 center/cover no-repeat;position:relative;overflow:hidden}
.libitem .lthumb canvas{width:100%;height:100%;display:block}
.libitem .linfo{flex:1;min-width:0}
.libitem .lname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.libitem .lmeta{font-size:11px;color:var(--muted)}
.libitem button{min-height:28px;padding:2px 8px}
.grip{cursor:grab;touch-action:none;color:var(--muted);padding:4px 2px;user-select:none;font-size:15px;line-height:1}
.fxitem{display:flex;align-items:center;gap:6px;padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:5px;cursor:pointer;user-select:none}
.fxitem:hover{border-color:#50555e}
.fxitem .fxn{flex:1;min-width:0}
.fxitem .fxn small{display:block;color:var(--muted);font-size:11px}
.fxitem button{min-height:26px;padding:2px 7px;font-size:12px}
.drop-hint{border:1px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--muted);font-size:12px}

#stage{flex:1;min-width:0;display:flex;flex-direction:column;background:#0b0c0e}
#viewer{flex:1;min-height:0;position:relative;overflow:hidden}
#cv,#ov{position:absolute;left:0;top:0}
#cv{background:#000;box-shadow:0 0 0 1px #2a2d33}
#ov{touch-action:none}
#emptyMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);pointer-events:none;padding:20px}
#emptyMsg b{color:var(--text)}
#transport{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
#tc{font-variant-numeric:tabular-nums;font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:0 6px}
#bPlay{min-width:46px}

#insp{width:310px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 12px}
#insp h3{margin:2px 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
#insp details{border-top:1px solid var(--line);padding:6px 0}
#insp summary{cursor:pointer;font-weight:600;padding:4px 0;list-style:none;display:flex;align-items:center;gap:6px}
#insp summary::before{content:"▸";color:var(--muted);transition:transform .15s}
#insp details[open] summary::before{transform:rotate(90deg)}
.row{display:grid;grid-template-columns:88px 1fr 58px;align-items:center;gap:7px;margin:5px 0}
.row label{color:var(--muted);font-size:12px}
.row input[type=number]{width:58px;padding:3px 4px;min-height:26px}
.row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row2 label{color:var(--muted);font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{min-height:28px;padding:3px 8px;font-size:12px}
.hint{font-size:12px;color:var(--muted);margin:4px 0}
#sheetHead{display:none}

/* timeline */
#split{height:7px;cursor:row-resize;background:var(--panel);border-top:1px solid var(--line);touch-action:none;display:flex;align-items:center;justify-content:center}
#split::after{content:"";width:40px;height:3px;border-radius:2px;background:var(--line)}
#tl{height:var(--tlh);flex:none;display:flex;flex-direction:column;background:var(--bg);min-height:120px}
#tlbar{display:flex;align-items:center;gap:5px;padding:5px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tlbar button{min-height:29px;padding:3px 8px}
#zoom{width:110px}
#scroller{flex:1;overflow:auto;position:relative;overscroll-behavior:contain}
#content{position:relative;min-height:100%}
#rulerRow{position:sticky;top:0;z-index:6;display:flex;height:var(--rh);background:var(--panel)}
#corner{position:sticky;left:0;z-index:7;width:var(--hw);flex:none;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 8px;color:var(--muted);font-size:11px}
#ruler{position:sticky;left:var(--hw);display:block;cursor:pointer;touch-action:none;border-bottom:1px solid var(--line)}
.trow{display:flex;height:var(--th);border-bottom:1px solid #22252a}
.trow.selT .thead{background:var(--panel3)}
.trow.dropTarget .lane{background:#1f2a1f}
.thead{position:sticky;left:0;z-index:4;width:var(--hw);flex:none;background:var(--panel);border-right:1px solid var(--line);border-left:4px solid var(--c);padding:3px 6px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.thead .tl1{display:flex;align-items:center;gap:4px}
.tname{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:5px;padding:1px 4px;min-height:22px;height:22px;font-weight:600;font-size:12px}
.tname:hover,.tname:focus{border-color:var(--line);background:var(--panel2)}
.thead .tb{min-height:22px;height:22px;padding:0 6px;font-size:11px;border-radius:5px}
.thead .tb.on{background:var(--accent);border-color:var(--accent);color:#1d1400}
.thead .tb.warn{background:var(--red);border-color:var(--red);color:#fff}
.thead .tl2{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.thead .tl2 input{height:16px}
.tkind{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lane{position:relative;flex:none;background:repeating-linear-gradient(90deg,transparent 0 99px,#1c1e22 99px 100px)}
.clip{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--cc);border:1px solid rgba(255,255,255,.14);overflow:hidden;cursor:grab;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.clip.sel{outline:2px solid #fff;outline-offset:0;z-index:2;touch-action:none}
.clip.locked{opacity:.75;cursor:default}
.clip canvas{position:absolute;left:0;top:0;height:100%;pointer-events:none}
.clip .cl{position:absolute;left:5px;top:2px;right:5px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none;display:flex;gap:4px;align-items:center}
.clip .badge{background:rgba(0,0,0,.55);border-radius:3px;padding:0 4px;font-size:10px}
.clip .trim{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:2}
.clip .trim.l{left:0}.clip .trim.r{right:0}
.clip.sel .trim{background:rgba(255,255,255,.28)}
.clip .trim::after{content:"";position:absolute;top:35%;bottom:35%;left:4px;width:2px;background:rgba(255,255,255,.7);border-radius:1px}
.clip .tri{position:absolute;top:0;width:0;height:0;pointer-events:none}
.clip .fadeS{position:absolute;top:0;bottom:0;pointer-events:none}
.clip .trmark{position:absolute;bottom:2px;font-size:10px;background:rgba(0,0,0,.6);border-radius:3px;padding:0 3px;pointer-events:none}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:8;pointer-events:none}
#ph::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid var(--red)}
.newlane{display:flex;height:50px;text-align:center;padding:0 10px;font-size:12px;align-items:center;justify-content:center;border:2px dashed #3d4550;margin:4px 6px;border-radius:8px;color:var(--muted);position:sticky;left:6px;width:calc(min(100vw,100%) - 12px)}
body.dragging .newlane{border-color:#6b7380;color:var(--text);background:#1b1e23;bottom:4px;z-index:9;box-shadow:0 -6px 18px rgba(0,0,0,.5)}
.newlane.hot{border-color:var(--accent)!important;color:var(--accent)!important;background:#2a2412!important}
#trackDrop{position:absolute;left:0;right:0;height:3px;background:var(--accent);z-index:9;display:none;pointer-events:none}
#ghost{position:fixed;z-index:100;pointer-events:none;background:var(--panel3);border:1px solid var(--accent);border-radius:7px;padding:5px 9px;font-size:12px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#snapLine{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);z-index:7;display:none;pointer-events:none}

/* dialogs, toast */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:18px 20px;width:min(480px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 10px;font-size:17px}
dialog .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
#prog{height:10px;background:var(--panel3);border-radius:5px;overflow:hidden;margin:12px 0 6px}
#prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2d3138;border:1px solid var(--line);padding:9px 15px;border-radius:9px;z-index:200;display:none;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
[data-m]{display:none}
#fileIn,#projIn{display:none}
#vids{position:fixed;left:-9999px;top:0;width:2px;height:2px;overflow:hidden}
.lbl{display:inline}

@media (min-width:761px) and (max-width:1250px){
  #insp{width:270px}
  #side{width:240px}
  .tb-l{display:none}
}
@media (max-width:760px){
  :root{--hw:104px;--th:68px}
  #work{flex:none}
  #viewer{flex:none;height:var(--pvh,32vh)}
  #tl{flex:1 1 auto;height:auto;min-height:150px}
  #bStart,#bEnd,#bGuides,#bFull,#bDetach,#zoom{display:none}
  #tc{font-size:11px;padding:0 2px}
  #tlbar{flex-wrap:nowrap;overflow-x:auto}
  #toolbar{padding:6px;gap:4px}
  #toolbar button{padding:4px 7px}
  #pname{width:110px}
  .tb-l,#brand span{display:none}
  [data-m]{display:inline}
  .sep{display:none}
  #work{flex-direction:column}
  #stage{min-height:0}
  #side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);z-index:50;box-shadow:8px 0 30px rgba(0,0,0,.6)}
  #insp{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:62vh;z-index:50;border-left:none;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.6);display:none;padding-top:0}
  #insp.open{display:block}
  #sheetHead{display:flex;position:sticky;top:0;background:var(--panel);z-index:2;padding:8px 0;justify-content:space-between;align-items:center}
  .thead .tl2{display:none}
  .thead .tkind{display:none}
  .row{grid-template-columns:80px 1fr 56px}
  #transport{padding:5px 6px;gap:4px}
  #transport button{padding:4px 8px}
}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div id="brand"><i></i><span>Montaggio Video</span></div>
    <button id="bSide" title="Libreria, testi, transizioni, effetti">☰ <span class="tb-l">Libreria</span></button>
    <input id="pname" type="text" value="Nuovo video" aria-label="Nome del progetto">
    <span class="sep"></span>
    <button id="bImport" class="primary" title="Importa video, foto, audio">＋ <span class="tb-l">Importa</span></button>
    <button id="bText" title="Aggiungi un testo">T <span class="tb-l">Testo</span></button>
    <button id="bRec" title="Registra la voce mentre guardi il video">● <span class="tb-l">Registra</span></button>
    <span class="sep"></span>
    <button id="bUndo" title="Annulla (Ctrl+Z)">↶</button>
    <button id="bRedo" title="Ripristina (Ctrl+Y)">↷</button>
    <span class="sep"></span>
    <select id="selFormat" title="Formato del video" aria-label="Formato">
      <option value="16:9">16:9 orizzontale</option>
      <option value="9:16">9:16 verticale</option>
      <option value="1:1">1:1 quadrato</option>
      <option value="4:5">4:5 post</option>
    </select>
    <span class="grow"></span>
    <button id="bMenu" title="Progetto: nuovo, apri, salva">Progetto ▾</button>
    <button id="bExport" class="primary" title="Esporta il video">⤓ Esporta</button>
  </div>

  <div id="work">
    <aside id="side">
      <div class="stabs">
        <button data-tab="lib" class="on">File</button>
        <button data-tab="txt">Testi</button>
        <button data-tab="tr">Transizioni</button>
        <button data-tab="fx">Effetti</button>
      </div>
      <div class="spane on" id="pane-lib">
        <div class="row2"><button id="libAdd" class="primary" style="flex:1">＋ Importa file</button></div>
        <label class="row2"><input type="checkbox" id="libAuto" checked> <span>Mettili subito sulla timeline</span></label>
        <div id="libList"></div>
      </div>
      <div class="spane" id="pane-txt"></div>
      <div class="spane" id="pane-tr"></div>
      <div class="spane" id="pane-fx"></div>
    </aside>

    <section id="stage">
      <div id="viewer">
        <canvas id="cv"></canvas>
        <canvas id="ov"></canvas>
        <div id="emptyMsg"><div><b>Trascina qui video, foto e audio</b><br>oppure premi «Importa».<br><span style="font-size:12px">Funziona anche dal telefono.</span></div></div>
      </div>
      <div id="transport">
        <button id="bStart" class="ghost" title="Inizio (Home)">⏮</button>
        <button id="bPrevF" class="ghost" title="Fotogramma precedente (←)">◀︎|</button>
        <button id="bPlay" class="primary" title="Play/Pausa (Spazio)">▶</button>
        <button id="bNextF" class="ghost" title="Fotogramma successivo (→)">|▶︎</button>
        <button id="bEnd" class="ghost" title="Fine (End)">⏭</button>
        <span id="tc">00:00:00 / 00:00:00</span>
        <span class="grow"></span>
        <button id="bGuides" class="ghost" title="Mostra guide e area sicura">⊞</button>
        <button id="bEdit" title="Modifica la clip selezionata">✎ Modifica</button>
        <button id="bFull" class="ghost" title="Anteprima a schermo intero">⛶</button>
      </div>
    </section>

    <aside id="insp"></aside>
  </div>

  <div id="split" title="Trascina per ridimensionare la timeline"></div>
  <div id="tl">
    <div id="tlbar">
      <button id="bSplit" title="Taglia la clip al cursore (S)">✂ <span class="tb-l">Taglia</span></button>
      <button id="bDup" title="Duplica (D)">⧉ <span class="tb-l">Duplica</span></button>
      <button id="bDel" title="Elimina (Canc)">🗑 <span class="tb-l">Elimina</span></button>
      <button id="bDetach" title="Separa l'audio del video su una traccia audio">♪ <span class="tb-l">Separa audio</span></button>
      <span class="sep"></span>
      <button id="bSnap" class="on" title="Calamita: aggancia ai bordi delle clip e al cursore">🧲</button>
      <button id="bZoomOut" title="Riduci zoom">−</button>
      <input id="zoom" type="range" min="0" max="100" value="40" aria-label="Zoom timeline">
      <button id="bZoomIn" title="Aumenta zoom">+</button>
      <button id="bFit" title="Adatta tutto">↔</button>
      <span class="grow"></span>
      <button id="bAddV" title="Nuova traccia video/testo">＋ <span class="tb-l">Traccia video</span><span class="lbl" data-m>V</span></button>
      <button id="bAddA" title="Nuova traccia audio">＋ <span class="tb-l">Traccia audio</span><span class="lbl" data-m>A</span></button>
    </div>
    <div id="scroller">
      <div id="content">
        <div id="rulerRow"><div id="corner">Tracce</div><canvas id="ruler"></canvas></div>
        <div id="tracks"></div>
        <div class="newlane" id="newBot">＋ Trascina qui file, clip o elementi della libreria per creare una nuova traccia</div>
        <div id="ph"></div>
        <div id="snapLine"></div>
        <div id="trackDrop"></div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileIn" multiple accept="video/*,image/*,audio/*,.mp4,.mov,.m4v,.webm,.mkv,.mp3,.wav,.m4a,.aac,.ogg,.flac,.jpg,.jpeg,.png,.webp,.gif">
<input type="file" id="projIn" accept=".mvideo,.zip">
<div id="ghost"></div>
<div id="toast"></div>
<div id="vids"></div>

<dialog id="dlg"><h2 id="dlgT"></h2><div id="dlgB"></div><div class="btns" id="dlgBtns"></div></dialog>

function applyTransition(c, type, where = 'in', dur) {

    const prev = proj.clips.filter(x => x.track === c.track && x.id !== c.id && x.start + x.dur <= c.start + .05 && x.start < c.start).sort((a, b) => b.start - a.start)[0];
    if (!prev) { toast('Non c\'è una clip prima di questa sulla stessa traccia: uso la dissolvenza semplice'); type = 'fade'; }
    else {

      for (const x of proj.clips) if (x.track === c.track && x.start >= c.start - 1e-3) x.start = Math.max(0, x.start - shift);
      c.tin = { type: 'fade', dur: d };

    }

  toast(type === 'none' ? 'Transizione tolta' : 'Transizione applicata ' + (where === 'in' ? 'all\'inizio' : where === 'out' ? 'alla fine' : 'all\'inizio e alla fine'));
}

const DB = { db: null };
function dbOpen() {
  if (DB.p) return DB.p;
  DB.p = new Promise(res => {
    try {
      const r = indexedDB.open('montaggio-video', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('media'); d.createObjectStore('kv'); };
      r.onsuccess = () => { DB.db = r.result; res(DB.db); }; r.onerror = () => res(null);
    } catch { res(null); }
  });
  return DB.p;
}

}

const dbDelMedia = id => dbDo('media', 'readwrite', st => st.delete(id));

$('#bAddA').onclick = () => { const t = addTrack('audio'); S.selTrack = t.id; commit(); renderAll(); };

/* trascina file dal computer */
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); document.body.style.outline = '3px dashed var(--accent)'; document.body.classList.add('dragging'); $('#newBot').classList.toggle('hot', newZoneAt(e.target)); } }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { if (ev === 'dragleave' && e.relatedTarget) return; document.body.style.outline = ''; document.body.classList.remove('dragging'); resetNewLbl(); }));
document.addEventListener('drop', e => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault(); document.body.style.outline = '';
  const files = [...e.dataTransfer.files];
  const proj1 = files.find(f => /\.mvideo$/i.test(f.name)); if (proj1) { openProjectFile(proj1); return; }
  document.body.classList.remove('dragging'); resetNewLbl();
  const lane = e.target.closest && e.target.closest('.lane');
  if (newZoneAt(e.target)) importToNewTracks(files, zoneTime(e.clientX));
  else if (lane) { const t = Math.max(0, (e.clientX - lane.getBoundingClientRect().left) / S.pps); importFiles(files, { place: true, track: lane.dataset.lane, time: t }); }
  else importFiles(files);
});

/* divisore anteprima / timeline */
let SPL = null;
$('#split').addEventListener('pointerdown', e => { $('#split').setPointerCapture(e.pointerId); SPL = { y: e.clientY, h: $('#tl').offsetHeight, v: $('#viewer').offsetHeight }; });
$('#split').addEventListener('pointermove', e => {
  if (!SPL) return;
  if (isMobile()) { S.pvhUser = true; document.documentElement.style.setProperty('--pvh', clamp(SPL.v + (e.clientY - SPL.y), 120, window.innerHeight - 260) + 'px'); }
  else document.documentElement.style.setProperty('--tlh', clamp(SPL.h - (e.clientY - SPL.y), 120, window.innerHeight - 220) + 'px');
  layoutPreview(); drawRuler();
});
$('#split').addEventListener('pointerup', () => { SPL = null; });

/* tastiera */
document.addEventListener('keydown', e => {
  const tg = e.target; if (tg.closest && tg.closest('input[type=text],input[type=number],textarea,select')) { if (e.key === 'Escape') tg.blur(); return; }
  if ($('#dlg').open) return;
  const k = e.key, mod = e.ctrlKey || e.metaKey;
  if (mod && (k === 'z' || k === 'Z')) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && (k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
  if (mod && (k === 's' || k === 'S')) { e.preventDefault(); saveProject(); return; }
  if (mod && (k === 'c' || k === 'C')) { doCopy(); return; }
  if (mod && (k === 'v' || k === 'V')) { doPaste(); return; }
  if (mod) return;
  if (k === ' ') { e.preventDefault(); if (tg.blur) tg.blur(); togglePlay(); }
  else if (k === 's' || k === 'S') doSplit();
  else if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); doDelete(e.shiftKey); }
  else if (k === 'd' || k === 'D') doDuplicate();
  else if (k === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? setPlayhead(S.playhead - 1) : stepFrame(-1); }
  else if (k === 'ArrowRight') { e.preventDefault(); e.shiftKey ? setPlayhead(S.playhead + 1) : stepFrame(1); }
  else if (k === 'Home') setPlayhead(0);
  else if (k === 'End') setPlayhead(projDur());
  else if (k === '+' || k === '=') setZoom(S.pps * 1.4);
  else if (k === '-') setZoom(S.pps / 1.4);
  else if (k === 'Escape') { S.sel = null; markSel(); renderInspector(); requestDraw(); updButtons(); }
});
window.addEventListener('beforeunload', e => { if (REC.on) { e.preventDefault(); e.returnValue = ''; } });

/* avvio */
new ResizeObserver(() => { layoutPreview(); }).observe($('#viewer'));
window.addEventListener('resize', () => { fitMobilePreview(); drawRuler(); updButtons(); if (!isMobile()) closeInspector(); });
renderTexts(); renderTrans(); renderFx(); renderLib();
if (isMobile()) toggleSide(false); else toggleSide(true);
$('#zoom').value = z2v(S.pps);
commit();
afterProjectChange();
restoreAutosave();
window.__mv = { get proj() { return proj; }, sources, exportRealtime, setFormat, S, P, importFiles, exportMP4, renderMix, setPlayhead, drawFrame, addTextPreset, applyTransition, applyEffect, select, doSplit, undo, redo, saveProject, openProjectFile, readZip };

</script>
