<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grandangolo · prova app</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e0d0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="https://www.grandangoloregionale.it/wp-content/uploads/2026/10/G-scaled.png">
<link rel="icon" href="https://www.grandangoloregionale.it/wp-content/uploads/2026/10/G-scaled.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Grandangolo">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- lo stesso foglio di stile del sito: il feed è identico a quello del telefono -->
<link rel="stylesheet" href="https://www.grandangoloregionale.it/wp-content/themes/grandangolo/style.css">
<link rel="stylesheet" href="barra.css?v=3">
<style>
.mfeed--rep .mfeed__top{padding-top:calc(10px + env(safe-area-inset-top))}
.mfeed--rep .mfeed__logo{filter:brightness(0) invert(1)!important}
.prova-nastro{position:fixed;top:calc(8px + env(safe-area-inset-top));right:-34px;z-index:2147483002;background:#FFD23F;color:#161513;font:700 10px 'IBM Plex Mono',monospace;letter-spacing:.14em;padding:4px 40px;transform:rotate(35deg);pointer-events:none}
.mfeed .rcard{cursor:pointer}
.mfeed__vuoto{padding:40px 22px;text-align:center;font:17px/1.45 'Newsreader',Georgia,serif;color:#6b665c}
@media (min-width:769px){ body{background:#0e0d0c} .mfeed{display:block!important;position:fixed;inset:0;overflow-y:auto;max-width:480px;margin:0 auto;background:#fff} }
</style>
<script>
window.GRDAPP={ sempre:true, home:'./', app:'app.html', attiva:'home',
  med:'https://www.grandangoloregionale.it/wp-content/uploads/2026/10/G-scaled.png',
  logo:'https://www.grandangoloregionale.it/wp-content/uploads/2026/06/cropped-GRANDANGOLO-REGIONALE-LOGO-300-x-50-px.png' };
</script>
<script src="barra.js?v=3"></script>
</head>
<body class="home grd-mfeed-attivo">
<div class="prova-nastro">PROVA</div>
<div class="mfeed mfeed--rep" id="grd-mfeed" aria-label="Ultime notizie">
  <header class="mfeed__top">
    <span class="mfeed__brand"><img class="mfeed__logo" src="https://www.grandangoloregionale.it/wp-content/uploads/2026/06/cropped-GRANDANGOLO-REGIONALE-LOGO-300-x-50-px.png" alt="Grandangolo"></span>
  </header>
  <div class="mfeed__cards" id="grd-mfeed-cards"><h2 class="rsez__tit rsez__tit--top"><span>Primo piano</span></h2></div>
  <div class="mfeed__stato" id="grd-mfeed-stato">Carico le notizie…</div>
</div>
<script>
/* Ricostruisce il feed mobile del sito (stile quotidiano) con le notizie vere */
(function(){
  var SITO='https://www.grandangoloregionale.it', EDICOLA='https://edicola.grandangoloregionale.it/';
  var SB='https://xfmiikymagamnexsbrdt.supabase.co', SBK='sb_publishable_Jvo-HpzTxLDp4wJlKhcuDw_nLdGlJXn';
  var feed=document.getElementById('grd-mfeed'), cont=document.getElementById('grd-mfeed-cards'), stato=document.getElementById('grd-mfeed-stato');
  var tmp=document.createElement('textarea');
  function dec(h){ tmp.innerHTML=h||''; return tmp.value; }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function testo(h){ var d=document.createElement('div'); d.innerHTML=h||''; return (d.textContent||'').trim(); }
  function voce(p){
    var e=p._embedded||{}, m=(e['wp:featuredmedia']||[])[0], a=(e.author||[])[0];
    var big='', small='';
    if(m && m.source_url){ var s=m.media_details&&m.media_details.sizes||{}; big=(s.large||s.full||m).source_url||m.source_url; small=(s.medium_large||s.medium||s.large||m).source_url||m.source_url; }
    var d=new Date(p.date);
    return { t:dec(p.title&&p.title.rendered), u:p.link, big:big, small:small, firma:a&&a.name?'di '+a.name:d.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'}), somm:testo(p.excerpt&&p.excerpt.rendered) };
  }
  function lead(v,primo){
    var somm=''; if(primo && v.somm){ var w=v.somm.split(/\s+/); somm='<p class="rcard__somm">'+esc(w.length>45?w.slice(0,45).join(' ')+'…':v.somm)+'</p>'; }
    return '<article class="mcard rcard rcard--lead'+(primo?' rcard--primo':'')+(v.big?'':' rcard--senzafoto')+'" data-href="'+esc(v.u)+'">'+
      (v.big?'<a class="rcard__media" href="'+esc(v.u)+'"><img src="'+esc(v.big)+'" alt="" loading="'+(primo?'eager':'lazy')+'"></a>':'')+
      '<div class="rcard__testo"><h2 class="rcard__tit"><a href="'+esc(v.u)+'">'+esc(v.t)+'</a></h2>'+somm+'<p class="rcard__firma">'+esc(v.firma)+'</p></div></article>';
  }
  function riga(v){
    return '<article class="mcard rcard rcard--riga" data-href="'+esc(v.u)+'"><div class="rcard__testo"><h3 class="rcard__tit"><a href="'+esc(v.u)+'">'+esc(v.t)+'</a></h3><p class="rcard__firma">'+esc(v.firma)+'</p></div>'+
      (v.small?'<a class="rcard__thumb" href="'+esc(v.u)+'"><img src="'+esc(v.small)+'" alt="" loading="lazy"></a>':'')+'</article>';
  }
  var numero=null;
  function edicola(){
    if(!numero) return '';
    return '<section class="mcard rsez rsez--edicola" data-href="'+esc(EDICOLA+'?numero='+numero.id)+'"><div class="rbox">'+(numero.cover_url?'<img src="'+esc(numero.cover_url)+'" alt="" loading="lazy">':'')+
      '<span class="rbox__kick">In edicola</span><h3 class="rbox__tit">Grandangolo Settimanale</h3><p class="rbox__somm">Sfoglia il numero della settimana in edicola digitale.</p>'+
      '<a class="rbox__cta" href="'+esc(EDICOLA+'?numero='+numero.id)+'">Vai in edicola →</a></div></section>';
  }
  var SEP='<div class="rsep" aria-hidden="true"></div>';
  function confine(k){ var sp=(k%2===0)?edicola():''; return sp?SEP+sp+SEP:SEP; }
  var pag=1, idx=0, carica=false, fine=false;
  function prendi(){
    return fetch(SITO+'/wp-json/wp/v2/posts?_embed=wp:featuredmedia,author&per_page=12&page='+pag).then(function(r){ if(!r.ok){ fine=true; return []; } return r.json(); }).then(function(a){ return (a||[]).map(voce); });
  }
  function aggiungi(lista){
    var h='';
    lista.forEach(function(v){
      if(idx===0){ h+=lead(v,true); }
      else if(idx<=3){ h+=lead(v,false); if(idx===3) h+=confine(1); }
      else { var j=idx-4+2; h+=(j%3===0)?lead(v):riga(v); if((j+1)%3===0) h+=confine((j+1)/3); }
      idx++;
    });
    cont.insertAdjacentHTML('beforeend',h);
  }
  function altre(){
    if(carica||fine) return; carica=true; stato.textContent='Carico altre notizie…';
    prendi().then(function(l){ if(l.length<12) fine=true; aggiungi(l); pag++; stato.textContent=fine?'':''; })
      .catch(function(){ stato.textContent=''; if(!idx) cont.insertAdjacentHTML('beforeend','<div class="mfeed__vuoto">Non riesco a leggere le notizie da grandangoloregionale.it. Controlla la connessione e riapri.</div>'); fine=true; })
      .then(function(){ carica=false; });
  }
  fetch(SB+"/rest/v1/issues?select=id,title,cover_url,is_latest&status=eq.published&order=sort_order.desc&limit=6",{headers:{apikey:SBK,Authorization:'Bearer '+SBK}})
    .then(function(r){ return r.ok?r.json():[]; }).then(function(a){ numero=(a||[]).filter(function(x){ return x.is_latest; })[0]||(a||[])[0]||null; })
    .catch(function(){}).then(altre);
  feed.addEventListener('scroll',function(){ if(feed.scrollTop+feed.clientHeight>feed.scrollHeight-900) altre(); },{passive:true});
  /* tutta la scheda è cliccabile, come sul sito */
  cont.addEventListener('click',function(e){ if(e.target.closest('a,button')) return; var c=e.target.closest('[data-href]'); if(c) location.href=c.getAttribute('data-href'); });
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
