name: Aggiorna notizie

# Quando gira:
#  - ogni 15 minuti (circa: GitHub può ritardare gli orari programmati)
#  - a comando, dal tab "Actions" con il pulsante "Run workflow"
#  - a ogni modifica dello script
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "build_news.py"
      - ".github/workflows/update-news.yml"

# Permette al workflow di scrivere nel repository (commit di news.json e foto)
permissions:
  contents: write

concurrency:
  group: aggiorna-notizie
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera news.json e scarica le foto
        env:
          FEED_URL: "https://www.grandangoloagrigento.it/feed"
          MAX_ITEMS: "20"
        run: python build_news.py

      - name: Salva le modifiche nel repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json feed-images
          if git diff --cached --quiet; then
            echo "Nessuna novità: niente da salvare."
          else
            git commit -m "Aggiorna notizie [skip ci]"
            git push
          fi
