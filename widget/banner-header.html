<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner Grandangolo</title>
<style>
  html, body { margin:0; padding:0; background:transparent; }
  /* i banner stanno uno sopra l'altro e si alternano con una dissolvenza */
  .giro { display:grid; }
  .giro a { grid-area:1/1; display:block; text-decoration:none; opacity:0; visibility:hidden; transition:opacity .8s ease, visibility 0s linear .8s; }
  .giro a.on { opacity:1; visibility:visible; transition:opacity .8s ease, visibility 0s; }
  img { display:block; width:100%; height:auto; border-radius:8px; }
  /* banner «In edicola» costruito in pagina (stesse proporzioni del banner dell'app) */
  .ed{position:relative;aspect-ratio:2046/297;border-radius:8px;overflow:hidden;container-type:inline-size;color:#fff;font-family:Georgia,'Times New Roman',serif;
      background:radial-gradient(60% 140% at 85% 50%,rgba(200,16,46,.55),transparent 70%),linear-gradient(100deg,#0e1a13 0%,#14261b 55%,#1b0b10 100%)}
  .ed::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px)}
  .ed-logo{position:absolute;left:3.2cqw;top:50%;transform:translateY(-50%);width:17cqw;height:auto;border-radius:0;filter:drop-shadow(0 .3cqw .8cqw rgba(0,0,0,.5))}
  .ed-sep{position:absolute;left:23cqw;top:16%;bottom:16%;width:.12cqw;background:rgba(255,255,255,.25)}
  .ed-txt{position:absolute;left:25.5cqw;top:50%;transform:translateY(-50%);width:41cqw}
  .ed-k{font:800 1.05cqw/1 system-ui,sans-serif;letter-spacing:.25em;color:#2bd67b;text-transform:uppercase;margin-bottom:1cqw}
  .ed-h{font-size:3.1cqw;line-height:1.05;font-weight:700}
  .ed-h i{color:#ffd23f;font-weight:400}
  .ed-t{font:italic 1.35cqw/1.3 Georgia,serif;color:rgba(255,255,255,.75);margin-top:.9cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ed-cov{position:absolute;right:21cqw;top:7%;height:86%;width:auto;border-radius:.3cqw;transform:rotate(-6deg);box-shadow:0 1cqw 2.5cqw rgba(0,0,0,.6)}
  .ed-cov2{right:25cqw;transform:rotate(-14deg);opacity:.5;filter:blur(.08cqw) brightness(.7)}
  .ed-btn{position:absolute;right:3cqw;top:50%;transform:translateY(-50%);background:#ffd23f;color:#141310;font:800 1.55cqw/1 system-ui,sans-serif;padding:1.5cqw 2.2cqw;border-radius:99cqw;white-space:nowrap;box-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.35)}
  .ed-btn small{display:block;font:600 .95cqw/1 system-ui,sans-serif;letter-spacing:.06em;margin-top:.5cqw;opacity:.75;text-align:center}
  /* banner «La Mafia, la Stidda» — stessa grafica della copertina ufficiale */
  .st{position:relative;aspect-ratio:2046/297;border-radius:8px;overflow:hidden;container-type:inline-size;font-family:Anton,Impact,sans-serif;color:#fff;
      background:radial-gradient(70% 160% at 55% 40%,#2a2a28 0%,#121211 60%,#0a0a09 100%)}
  .st::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 5px)}
  .st-rit{position:absolute;left:0;top:0;height:100%;width:auto;border-radius:0;-webkit-mask-image:linear-gradient(90deg,#000 72%,transparent);mask-image:linear-gradient(90deg,#000 72%,transparent)}
  .st-tit{position:absolute;left:15.5cqw;top:13%;display:flex;align-items:flex-start;gap:.3cqw}
  .st-y{background:#FFE11E;color:#111;font-size:3.7cqw;line-height:1;padding:.5cqw 1cqw .35cqw;text-transform:uppercase;white-space:nowrap}
  .st-y--2{margin-top:-.6cqw}
  .st-v{font-size:4.2cqw;line-height:.6;color:#FFE11E;margin:0 -.2cqw;align-self:flex-end}
  .st-sub{position:absolute;left:15.5cqw;top:55%;font-size:1.35cqw;line-height:1.15;text-transform:uppercase;letter-spacing:.03em;font-style:italic;color:#fff;transform:skewX(-6deg)}
  .st-di{position:absolute;left:15.5cqw;top:79%;font-size:1.5cqw;line-height:1;text-transform:uppercase;letter-spacing:.04em;color:#111;background:#FFE11E;padding:.35cqw .7cqw}
  .st-pol{position:absolute;left:53.5cqw;top:11%;height:72%;width:auto;aspect-ratio:249/205;background:#f2f0ea;padding:.55cqw .55cqw 1.6cqw;border-radius:.2cqw;transform:rotate(2.5deg);box-shadow:0 .8cqw 2cqw rgba(0,0,0,.7);box-sizing:content-box;object-fit:cover}
  .st-dx{position:absolute;right:2.6cqw;top:0;bottom:0;width:24cqw;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:.75cqw;text-align:right}
  .st-logo{width:8.5cqw;height:auto;border-radius:0}
  .st-d{font-size:3cqw;line-height:1;text-transform:uppercase;color:#fff}
  .st-p{font:600 1.05cqw/1.25 Inter,system-ui,sans-serif;color:#cfcac0;letter-spacing:.02em}
  .st-btn[hidden]{display:none}
  .st-btn{background:#FFE11E;color:#111;font:800 1.35cqw/1 Inter,system-ui,sans-serif;letter-spacing:.04em;padding:1.05cqw 2cqw;border-radius:99cqw;white-space:nowrap}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&display=swap">
</head>
<body>
  <!-- target="_top" apre il sito nella finestra intera, non dentro l'iframe -->
  <div class="giro" id="giro">
    <!-- 1) il podcast «La Mafia, la Stidda» di Franco Castaldo -->
    <a class="on" id="st-a" data-href="https://www.grandangoloregionale.it/podcast/#la-mafia-la-stidda" target="_top" rel="noopener" style="cursor:default" aria-label="La Mafia, la Stidda: un podcast di Franco Castaldo">
      <div class="st">
        <img class="st-rit" src="podcast/stidda-ritratto.jpg" alt="">
        <div class="st-tit"><span class="st-y">La Mafia</span><span class="st-v">,</span><span class="st-y st-y--2">La Stidda</span></div>
        <div class="st-sub">I delitti, i rapporti con la politica,<br>l'imprenditoria e l'informazione</div>
        <div class="st-di">Un podcast di Franco Castaldo</div>
        <img class="st-pol" src="podcast/stidda-scena.jpg" alt="">
        <div class="st-dx">
          <img class="st-logo" src="podcast/grandangolo-podcasts.png" alt="Grandangolo Podcasts">
          <div class="st-d" id="st-d">Dall'11 dicembre</div>
          <div class="st-p">Gratis su Spotify, Apple, YouTube Music,<br>Amazon Music e tutte le piattaforme</div>
          <span class="st-btn" id="st-b" hidden>ASCOLTALO ORA →</span>
        </div>
      </div>
    </a>
    <!-- 2) la nuova app: porta all'invito per installarla -->
    <a href="https://www.grandangoloregionale.it/scarica-app/" target="_top" rel="noopener">
      <img src="banner-app.jpg" alt="Scarica la nuova app Grandangolo">
    </a>
    <!-- 3) Grandangolo Regionale -->
    <a href="https://www.grandangoloregionale.it/" target="_top" rel="noopener">
      <img src="https://www.grandangoloagrigento.it/wp-content/uploads/sites/3/2026/09/ChatGPT-Image-7-set-2026-16_38_39-e1788792867827.png" alt="Grandangolo Regionale">
    </a>
  </div>

  <script>
        /* fino all'uscita il banner del podcast non è cliccabile e non ha il tasto */
    if (Date.now() >= Date.parse("2026-12-11T00:00:00+01:00")) {
      var stA = document.getElementById("st-a");
      stA.href = stA.getAttribute("data-href"); stA.style.cursor = "";
      document.getElementById("st-d").textContent = "Ora disponibile";
      document.getElementById("st-b").hidden = false;
    }
    /* banner «In edicola» con l'ultimo numero: su tutti i siti in coda alla rotazione;
       con ?sito=regionale prende il posto del banner che porterebbe al regionale stesso */
    var Q = new URLSearchParams(location.search);
    {
      var giro = document.getElementById("giro"), vecchio = giro.querySelector('a[href="https://www.grandangoloregionale.it/"]');
      if (Q.get("sito") === "regionale" && vecchio) vecchio.remove();
      var K = "sb_publishable_Jvo-HpzTxLDp4wJlKhcuDw_nLdGlJXn";
      /* prima la copia statica issues.json (non pesa sul database), poi il database come riserva */
      var ora = new Date().toISOString();
      fetch("/issues.json?v=" + Math.floor(Date.now() / 300000), { cache: "no-cache" })
        .then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (js) {
          var l = ((js && js.issues) || []).filter(function (r) { return r.is_latest && (r.status === "published" || (r.status === "scheduled" && r.scheduled_at && r.scheduled_at <= ora)); });
          if (!l.length) throw 0; return l.slice(0, 1);
        })
        .catch(function () {
          return fetch("https://xfmiikymagamnexsbrdt.supabase.co/rest/v1/issues?select=id,title,subtitle,cover_url,pages&is_latest=eq.true&or=(status.eq.published,and(status.eq.scheduled,scheduled_at.lte."+ora+"))&order=sort_order.desc.nullslast,created_at.desc&limit=1", { headers: { apikey: K, Authorization: "Bearer " + K } }).then(function (r) { return r.json(); });
        })
        .then(function (d) {
          var x = d && d[0]; if (!x) return;
          var cov = x.cover_url || (x.pages && x.pages[0]); if (!cov) return;
          var cov2 = x.pages && x.pages[1] ? x.pages[1] : "";
          var esc = function (t) { return String(t || "").replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
          var a = document.createElement("a");
          a.href = "https://edicola.grandangoloregionale.it/?numero=" + encodeURIComponent(x.id);
          a.target = "_top"; a.rel = "noopener";
          a.innerHTML = '<div class="ed">' +
            '<img class="ed-logo" src="../logo-settimanale.png" alt="Grandangolo Settimanale">' +
            '<span class="ed-sep"></span>' +
            '<div class="ed-txt"><div class="ed-k">In edicola · Grandangolo Settimanale</div>' +
            '<div class="ed-h">Il nuovo numero <i>è uscito</i></div>' +
            '<div class="ed-t">' + esc(x.title) + (x.subtitle ? " · " + esc(x.subtitle) : "") + '</div></div>' +
            '<img class="ed-cov" src="' + esc(cov) + '" alt="Copertina">' +
            '<span class="ed-btn">SFOGLIALO ORA →<small>edicola digitale</small></span>' +
            '</div>';
          giro.appendChild(a);
          voci = document.querySelectorAll("#giro a");
          sendHeight();
        }).catch(function () {});
    }

    function sendHeight() {
      var h = document.body.scrollHeight;
      parent.postMessage({ ggBannerHeight: h }, "*");
    }
    window.addEventListener("load", sendHeight);
    window.addEventListener("resize", sendHeight);
    document.querySelectorAll("#giro img").forEach(function (im) { im.addEventListener("load", sendHeight); });

    /* ogni 7 secondi passa al banner successivo */
    var voci = document.querySelectorAll("#giro a"), i = 0;
    {
      setInterval(function () {
        if (voci.length < 2) return;
        voci[i].classList.remove("on");
        i = (i + 1) % voci.length;
        voci[i].classList.add("on");
      }, 7000);
    }
  </script>
</body>
</html>
