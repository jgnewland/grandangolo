<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner Grandangolo</title>
<style>
  html, body { margin:0; padding:0; background:transparent; }
  /* i banner stanno uno sopra l'altro e si alternano con una dissolvenza */
  .giro { display:grid; }
  .giro a { grid-area:1/1; display:block; text-decoration:none; opacity:0; visibility:hidden; transition:opacity .8s ease, visibility 0s linear .8s; }
  .giro a.on { opacity:1; visibility:visible; transition:opacity .8s ease, visibility 0s; }
  img { display:block; width:100%; height:auto; border-radius:8px; }
  /* banner «In edicola» costruito in pagina (stesse proporzioni del banner dell'app) */
  .ed{position:relative;aspect-ratio:2046/297;border-radius:8px;overflow:hidden;container-type:inline-size;color:#fff;font-family:Georgia,'Times New Roman',serif;
      background:radial-gradient(60% 140% at 85% 50%,rgba(200,16,46,.55),transparent 70%),linear-gradient(100deg,#0e1a13 0%,#14261b 55%,#1b0b10 100%)}
  .ed::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px)}
  .ed-logo{position:absolute;left:3.2cqw;top:50%;transform:translateY(-50%);width:17cqw;height:auto;border-radius:0;filter:drop-shadow(0 .3cqw .8cqw rgba(0,0,0,.5))}
  .ed-sep{position:absolute;left:23cqw;top:16%;bottom:16%;width:.12cqw;background:rgba(255,255,255,.25)}
  .ed-txt{position:absolute;left:25.5cqw;top:50%;transform:translateY(-50%);width:41cqw}
  .ed-k{font:800 1.05cqw/1 system-ui,sans-serif;letter-spacing:.25em;color:#2bd67b;text-transform:uppercase;margin-bottom:1cqw}
  .ed-h{font-size:3.1cqw;line-height:1.05;font-weight:700}
  .ed-h i{color:#ffd23f;font-weight:400}
  .ed-t{font:italic 1.35cqw/1.3 Georgia,serif;color:rgba(255,255,255,.75);margin-top:.9cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ed-cov{position:absolute;right:21cqw;top:7%;height:86%;width:auto;border-radius:.3cqw;transform:rotate(-6deg);box-shadow:0 1cqw 2.5cqw rgba(0,0,0,.6)}
  .ed-cov2{right:25cqw;transform:rotate(-14deg);opacity:.5;filter:blur(.08cqw) brightness(.7)}
  .ed-btn{position:absolute;right:3cqw;top:50%;transform:translateY(-50%);background:#ffd23f;color:#141310;font:800 1.55cqw/1 system-ui,sans-serif;padding:1.5cqw 2.2cqw;border-radius:99cqw;white-space:nowrap;box-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.35)}
  .ed-btn small{display:block;font:600 .95cqw/1 system-ui,sans-serif;letter-spacing:.06em;margin-top:.5cqw;opacity:.75;text-align:center}
</style>
</head>
<body>
  <!-- target="_top" apre il sito nella finestra intera, non dentro l'iframe -->
  <div class="giro" id="giro">
    <!-- 1) la nuova app: porta all'invito per installarla -->
    <a class="on" href="https://www.grandangoloregionale.it/scarica-app/" target="_top" rel="noopener">
      <img src="banner-app.jpg" alt="Scarica la nuova app Grandangolo">
    </a>
    <!-- 2) Grandangolo Regionale -->
    <a href="https://www.grandangoloregionale.it/" target="_top" rel="noopener">
      <img src="https://www.grandangoloagrigento.it/wp-content/uploads/sites/3/2026/09/ChatGPT-Image-7-set-2026-16_38_39-e1788792867827.png" alt="Grandangolo Regionale">
    </a>
  </div>

  <script>
    /* banner «In edicola» con l'ultimo numero: su tutti i siti in coda alla rotazione;
       con ?sito=regionale prende il posto del banner che porterebbe al regionale stesso */
    var Q = new URLSearchParams(location.search);
    {
      var giro = document.getElementById("giro"), vecchio = giro.children[1];
      if (Q.get("sito") === "regionale" && vecchio) vecchio.remove();
      var K = "sb_publishable_Jvo-HpzTxLDp4wJlKhcuDw_nLdGlJXn";
      fetch("https://xfmiikymagamnexsbrdt.supabase.co/rest/v1/issues?select=id,title,subtitle,cover_url,pages&is_latest=eq.true&status=eq.published&order=sort_order.desc.nullslast,created_at.desc&limit=1", { headers: { apikey: K, Authorization: "Bearer " + K } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var x = d && d[0]; if (!x) return;
          var cov = x.cover_url || (x.pages && x.pages[0]); if (!cov) return;
          var cov2 = x.pages && x.pages[1] ? x.pages[1] : "";
          var esc = function (t) { return String(t || "").replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
          var a = document.createElement("a");
          a.href = "https://edicola.grandangoloregionale.it/?numero=" + encodeURIComponent(x.id);
          a.target = "_top"; a.rel = "noopener";
          a.innerHTML = '<div class="ed">' +
            '<img class="ed-logo" src="../logo-settimanale.png" alt="Grandangolo Settimanale">' +
            '<span class="ed-sep"></span>' +
            '<div class="ed-txt"><div class="ed-k">In edicola · Grandangolo Settimanale</div>' +
            '<div class="ed-h">Il nuovo numero <i>è uscito</i></div>' +
            '<div class="ed-t">' + esc(x.title) + (x.subtitle ? " · " + esc(x.subtitle) : "") + '</div></div>' +
            '<img class="ed-cov" src="' + esc(cov) + '" alt="Copertina">' +
            '<span class="ed-btn">SFOGLIALO ORA →<small>edicola digitale</small></span>' +
            '</div>';
          giro.appendChild(a);
          voci = document.querySelectorAll("#giro a");
          sendHeight();
        }).catch(function () {});
    }

    function sendHeight() {
      var h = document.body.scrollHeight;
      parent.postMessage({ ggBannerHeight: h }, "*");
    }
    window.addEventListener("load", sendHeight);
    window.addEventListener("resize", sendHeight);
    document.querySelectorAll("#giro img").forEach(function (im) { im.addEventListener("load", sendHeight); });

    /* ogni 7 secondi passa al banner successivo */
    var voci = document.querySelectorAll("#giro a"), i = 0;
    {
      setInterval(function () {
        if (voci.length < 2) return;
        voci[i].classList.remove("on");
        i = (i + 1) % voci.length;
        voci[i].classList.add("on");
      }, 7000);
    }
  </script>
</body>
</html>
