<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segnala a Grandangolo</title>
<meta name="robots" content="noindex">
<base target="_blank">
<style>
  html,body{margin:0;background:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  *{box-sizing:border-box}
  a.sg{display:block;text-decoration:none;color:#fff;border-radius:12px;padding:16px 15px 15px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#b3121a 0%,#e01f1f 55%,#ff5a2a 100%);border:3px solid #FFD23F;box-shadow:0 6px 18px rgba(224,31,31,.25)}
  a.sg:after{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.09)}
  .k{display:inline-block;background:#FFD23F;color:#161513;font-weight:800;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;padding:4px 8px;border-radius:4px}
  .r{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
  .i{font-size:34px;line-height:1}
  h3{margin:0;font-size:20px;line-height:1.15;font-weight:800}
  p{margin:8px 0 0;font-size:14px;line-height:1.4;opacity:.96}
  ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
  li{font-size:11.5px;background:rgba(0,0,0,.22);padding:3px 8px;border-radius:999px}
  .b{position:relative;z-index:1;display:block;margin-top:13px;background:#fff;color:#b3121a;text-align:center;font-weight:800;font-size:15px;letter-spacing:.4px;text-transform:uppercase;padding:12px;border-radius:9px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
  a.sg:hover .b{background:#FFD23F;color:#161513}
</style>
</head>
<body>
<a class="sg" id="sg" href="https://www.grandangoloregionale.it/segnala/?da=agrigento" rel="noopener">
  <span class="k">Segnala a Grandangolo</span>
  <div class="r"><span class="i" aria-hidden="true">📣</span><h3>Hai visto qualcosa? Raccontacelo.</h3></div>
  <p>Disservizi, abusi, incidenti, storie che nessuno racconta. Mandaci foto, video o documenti.</p>
  <ul><li>🕶 Anche anonima</li><li>📷 Foto e video</li><li>🧾 Numero di pratica</li></ul>
  <span class="b">Fai una segnalazione →</span>
</a>
<script>
(function(){
  function invia(){var w=document.getElementById('sg');var h=Math.ceil(w.getBoundingClientRect().bottom+window.scrollY+14);try{parent.postMessage({gaWidget:'segnala',h:h},'*');}catch(e){}}
  window.addEventListener('load',invia);window.addEventListener('resize',invia);setTimeout(invia,300);setTimeout(invia,1500);
})();
</script>
</body>
</html>
