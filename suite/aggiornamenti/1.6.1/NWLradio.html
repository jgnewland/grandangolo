<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NWLradio — Newland Studio</title>
<meta name="theme-color" content="#040922">
<link rel="icon" href="icone/nwlradio.png">

<style>
:root{--bg:#040922;--p1:#0a1233;--p2:#0f1a46;--p3:#162258;--ln:rgba(255,255,255,.09);--ln2:rgba(255,255,255,.16);--tx:#eef1ff;--mu:#8f9bc8;--ac:#ff9f1c;--ac2:#ffc266;--red:#ff3b4e;--grn:#2ee07c;--yel:#ffd23f;--blu:#40d6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(1100px 600px at 90% -15%,rgba(255,159,28,.07),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(64,120,255,.12),transparent 55%),var(--bg);color:var(--tx);font:13.5px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln2);background:var(--p2);border-radius:9px;padding:6px 11px;transition:background .12s,border-color .12s,transform .05s}
button:hover{background:var(--p3)}button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--ac);border-color:var(--ac);color:#1a0d00;font-weight:700}
button.pri:hover{background:var(--ac2)}
button.ghost{background:transparent}
input,select,textarea{background:#060c2a;border:1px solid var(--ln2);border-radius:8px;padding:6px 8px;outline:none;user-select:text}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input[type=range]{accent-color:var(--ac)}
input[type=checkbox]{accent-color:var(--ac);width:16px;height:16px;vertical-align:-3px}
.mu{color:var(--mu)}.hint{color:var(--mu);font-size:12.5px;margin:4px 0}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
/* barra in alto */
#top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--ln);background:rgba(4,9,34,.6);backdrop-filter:blur(8px)}
#brand{display:flex;align-items:center;gap:10px}
#brand img{width:38px;height:38px;border-radius:10px}
#brand b{display:block;font-size:17px;letter-spacing:-.01em}#brand small{display:block;color:var(--mu);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
#clock{font:700 34px/1 "JetBrains Mono",ui-monospace,Consolas,monospace;letter-spacing:.02em;padding:0 6px}
#clock small{font-size:18px;color:var(--mu)}
#onair{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 14px;border-radius:14px;background:var(--p1);border:1px solid var(--ln)}
#lamp{font-weight:800;letter-spacing:.14em;font-size:13px;padding:7px 12px;border-radius:8px;background:#1a1f3f;color:#5d6895;border:1px solid var(--ln)}
#onair.live #lamp{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 0 22px rgba(255,59,78,.6);animation:lamp 2s ease-in-out infinite}
#onair.wait #lamp{background:#5a3a08;color:var(--ac2);border-color:var(--ac)}
@keyframes lamp{50%{box-shadow:0 0 8px rgba(255,59,78,.3)}}
#airT{font:700 20px/1 ui-monospace,Consolas,monospace;min-width:92px}
#airS{font-size:11.5px;color:var(--mu);max-width:220px}
#bAir{padding:10px 16px;font-weight:800;letter-spacing:.04em}
#onair.live #bAir{background:#2a0b12;border-color:var(--red);color:#ff9aa5}
#bRec{font-weight:700}#bRec.on{background:var(--red);border-color:var(--red);color:#fff}
#top .sp{flex:1}
#top button,#brand small,#brand b,#airT,#lamp{white-space:nowrap}
@media (max-width:1580px){#dockSlot .ndk b{display:none}#dockSlot .ndk{padding:4px}}
@media (max-width:1360px){#airS{display:none}#brand>div{display:none}}
#dockSlot{display:flex}
#dockSlot .ndock{margin:0}
/* corpo */
#main{display:grid;grid-template-columns:minmax(400px,1.15fr) minmax(330px,.95fr) minmax(300px,.8fr);grid-template-rows:minmax(0,1fr) auto;gap:12px;padding:12px 16px;min-height:0}
.pan{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));border:1px solid var(--ln);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pan>h3{margin:0;padding:10px 14px 8px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#cfd6f5;display:flex;align-items:center;gap:8px}
.pan>h3 .sp{flex:1}
.pan>h3 button{padding:3px 9px;font-size:12px;letter-spacing:0;text-transform:none}
/* lettori */
#decks{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 10px}
.deck{border-radius:13px;background:#060c2a;border:1px solid var(--ln);padding:10px;display:flex;flex-direction:column;gap:7px;position:relative}
.deck.air{border-color:var(--red);box-shadow:inset 0 0 0 1px rgba(255,59,78,.35)}
.deck .dh{display:flex;align-items:center;gap:8px}
.deck .dl{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--p3);color:var(--ac)}
.deck .dt{flex:1;min-width:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .dtag{font-size:10.5px;font-weight:800;letter-spacing:.1em;padding:2px 6px;border-radius:5px;background:var(--red);color:#fff;display:none}
.deck.air .dtag{display:block}
.deck canvas{width:100%;height:46px;border-radius:7px;background:#030720;cursor:pointer;display:block}
.deck .dtime{display:flex;justify-content:space-between;align-items:baseline;font-family:ui-monospace,Consolas,monospace}
.deck .rem{font-size:24px;font-weight:700}
.deck .rem.warn{color:var(--yel)}.deck .rem.end{color:var(--red);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.deck .el{color:var(--mu);font-size:12px}
.deck .db{display:flex;gap:6px}
.deck .db button{flex:1;padding:7px 0;font-size:15px}
.deck .db .play.on{background:var(--grn);border-color:var(--grn);color:#002a10}
#plist{flex:1;min-height:0;overflow:auto;padding:0 8px 8px}
.pi{display:grid;grid-template-columns:24px 1fr auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:grab}
.pi:hover{background:rgba(255,255,255,.05)}
.pi.sel{background:rgba(255,159,28,.12)}
.pi.done{opacity:.4}
.pi.onA,.pi.onB{background:rgba(46,224,124,.1)}
.pi .n{color:var(--mu);font-size:11.5px;text-align:right}
.pi .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .d{font-family:ui-monospace,Consolas,monospace;color:var(--mu);font-size:12px}
.pi .x{opacity:0;padding:1px 6px;border:0;background:none}
.pi:hover .x{opacity:.7}
.pi.drop{box-shadow:inset 0 2px 0 var(--ac)}
#plBar{display:flex;gap:6px;align-items:center;padding:6px 12px 10px;border-top:1px solid var(--ln);flex-wrap:wrap}
#plBar .sp{flex:1}
#bAuto.on{background:var(--ac);border-color:var(--ac);color:#1a0d00;font-weight:700}
.plEmpty{margin:18px 10px;padding:20px;border:1px dashed var(--ln2);border-radius:12px;text-align:center;color:var(--mu)}
/* jingle */
#carts{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:8px;padding:0 12px 10px;flex:1;min-height:0}
.cart{position:relative;border-radius:12px;border:1px solid var(--ln2);background:#0b1440;padding:8px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden;min-height:58px}
.cart .k{font-size:10.5px;color:var(--mu);font-weight:700}
.cart .nm{font-weight:650;font-size:12.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;position:relative}
.cart .du{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--mu);position:relative}
.cart.empty{border-style:dashed;background:transparent;color:var(--mu)}
.cart .pg{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.14)}
.cart.play{box-shadow:0 0 0 2px var(--c,var(--ac)),0 0 18px -4px var(--c,var(--ac))}
.cart .lp{position:absolute;right:7px;top:6px;font-size:11px}
#cartBar{display:flex;gap:6px;padding:0 12px 10px;align-items:center;flex-wrap:wrap}
#bPips.on{background:var(--blu);border-color:var(--blu);color:#00222e;font-weight:700}
/* destra: orologio, scaletta, ospiti */
#side{gap:0}
#tabs{display:flex;gap:4px;padding:8px 10px 0}
#tabs button{flex:1;padding:6px 0;border-radius:8px 8px 0 0;border-bottom:0;background:transparent;font-size:12.5px;color:var(--mu)}
#tabs button.on{background:var(--p2);color:var(--tx);font-weight:650}
#tabBody{flex:1;min-height:0;overflow:auto;padding:10px 12px;border-top:1px solid var(--ln)}
.cd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.cd div{background:#060c2a;border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.cd small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.cd b{font:700 20px/1.2 ui-monospace,Consolas,monospace}
.seg{display:grid;grid-template-columns:20px 1fr 56px 22px;gap:6px;align-items:center;margin-bottom:5px}
.seg input[type=text]{width:100%}.seg input[type=number]{width:56px;text-align:right}
.seg.cur input[type=text]{border-color:var(--ac)}
.seg.done input[type=text]{text-decoration:line-through;opacity:.5}
textarea#notes{width:100%;min-height:120px;resize:vertical}
.guest{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:#060c2a;border:1px solid var(--ln);margin-bottom:6px}
.guest b{flex:1}.guest .lv{width:60px;height:6px;border-radius:3px;background:#1a2150;overflow:hidden}.guest .lv i{display:block;height:100%;background:var(--grn);width:0}
.linkbox{display:flex;gap:6px;margin:6px 0}.linkbox input{flex:1;font-size:12px}
/* mixer */
#mixer{grid-column:1/-1;display:flex;gap:8px;padding:10px 12px 12px;overflow-x:auto}
.strip{flex:0 0 108px;border-radius:13px;background:#060c2a;border:1px solid var(--ln);padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.strip.on{border-color:color-mix(in srgb,var(--red) 70%,transparent)}
.strip .sn{font-weight:700;font-size:12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .sb{display:flex;gap:4px}
.strip .sb button{flex:1;padding:4px 0;font-size:11px;font-weight:700}
.strip .fz{display:flex;gap:6px;justify-content:center;height:128px}
.strip .vu{width:10px;border-radius:4px;background:#030720;position:relative;overflow:hidden}
.strip .vu i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--grn) 0,var(--grn) 65%,var(--yel) 82%,var(--red) 95%);background-size:100% 128px;background-position:bottom}
.strip .vu b{position:absolute;left:0;right:0;height:2px;background:#fff;bottom:0;opacity:.85}
.strip input[type=range].fd{writing-mode:vertical-lr;direction:rtl;width:28px;height:128px;accent-color:var(--ac);margin:0}
.strip .dbv{text-align:center;font:600 11px ui-monospace,Consolas,monospace;color:var(--mu)}
.strip .air{padding:9px 0;font-weight:800;letter-spacing:.08em;font-size:12px}
.strip .air.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 14px -2px rgba(255,59,78,.7)}
.strip .pfl.on{background:var(--yel);border-color:var(--yel);color:#2a2000}
.strip .opt.on{background:var(--p3);border-color:var(--ac);color:var(--ac2)}
.strip select{font-size:11px;padding:3px 4px;width:100%}
.strip.mst{flex:0 0 240px;background:linear-gradient(180deg,rgba(255,159,28,.08),#060c2a)}
.mst .fz{justify-content:space-around}
.mst .row{display:flex;gap:6px;align-items:center}
.mst .row label{font-size:11px;color:var(--mu);flex:none;width:64px}
.mst .row select{flex:1}
.lufs{display:flex;justify-content:space-between;font:600 12px ui-monospace,Consolas,monospace}
.lufs b{font-size:16px}
.gr{height:6px;border-radius:3px;background:#030720;overflow:hidden}.gr i{display:block;height:100%;width:0;background:var(--ac);margin-left:auto}
.mixsep{width:1px;background:var(--ln);flex:none;margin:0 2px}
/* barra in basso */
#bot{display:flex;align-items:center;gap:10px;padding:7px 16px;border-top:1px solid var(--ln);font-size:12.5px;background:rgba(4,9,34,.6)}
#bot input{flex:1;max-width:520px}
#bot .sp{flex:1}
#silence{display:none;padding:4px 10px;border-radius:7px;background:var(--red);color:#fff;font-weight:800;animation:blink .8s steps(2) infinite}
#silence.on{display:block}
/* dialoghi e avvisi */
dialog{background:var(--p1);color:var(--tx);border:1px solid var(--ln2);border-radius:16px;padding:0;max-width:min(620px,94vw);width:100%;box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(2,4,16,.66);backdrop-filter:blur(3px)}
dialog h2{margin:0;padding:16px 18px 6px;font-size:18px}
dialog .db{padding:6px 18px 10px;max-height:70vh;overflow:auto;user-select:text}
dialog .dbt{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--ln);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;align-items:center;margin:8px 0}
.fg label{color:var(--mu);font-size:12.5px}
.fg input,.fg select{width:100%}
.box{background:#060c2a;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:10px 0}
.box.warn{border-color:rgba(255,159,28,.5);background:rgba(255,159,28,.07)}
#toast{position:fixed;left:50%;bottom:54px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#111a4a;border:1px solid var(--ln2);padding:10px 16px;border-radius:12px;transition:.2s;z-index:99;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.drag-over{outline:2px dashed var(--ac);outline-offset:-4px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#1e2b63;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
@media (max-width:1280px){#main{grid-template-columns:1.1fr .9fr}#side{display:none}#clock{font-size:26px}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand"><img src="icone/nwlradio.png" alt=""><div><small>Newland Studio</small><b>NWLradio</b></div></div>
    <div id="clock">00:00<small>:00</small></div>
    <div id="onair"><div id="lamp">ON AIR</div><div><div id="airT">--:--:--</div><div id="airS">Non in onda</div></div><button id="bAir" class="pri">● VAI IN ONDA</button></div>
    <button id="bRec" title="Registra la puntata">⏺ REG</button>
    <span class="sp"></span>
    <div id="dockSlot"></div>
    <button id="bSrv" title="Server di trasmissione">⚙ Server</button>
    <button id="bHelp" class="ghost" title="Guida rapida">?</button>
  </header>
  <main id="main">
    <section class="pan" id="pDecks">
      <h3>Lettori e playlist <span class="sp"></span></h3>
      <div id="decks"></div>
      <div id="plist"></div>
      <div id="plBar">
        <button id="bAdd">＋ Aggiungi brani</button>
        <button id="bAuto" title="Al termine di un brano parte il successivo sull'altro lettore, in dissolvenza">AUTO</button>
        <label class="mu">dissolvenza <select id="xf"><option value="0">nessuna</option><option value="2">2 s</option><option value="4">4 s</option><option value="6">6 s</option><option value="8">8 s</option></select></label>
        <span class="sp"></span>
        <span class="mu" id="plTot"></span>
        <button id="bClr" class="ghost" title="Svuota la playlist">Svuota</button>
      </div>
    </section>
    <section class="pan" id="pCarts">
      <h3>Jingle e stacchi <span class="sp"></span><button id="bStopCarts" title="Ferma tutti i jingle">■ Ferma tutti</button></h3>
      <div id="carts"></div>
      <div id="cartBar">
        <button id="bPipsNow" title="Manda subito il segnale orario (5 brevi + 1 lungo)">🕐 Segnale orario</button>
        <button id="bPips" title="Manda in onda da solo il segnale orario allo scoccare di ogni ora">AUTO ogni ora</button>
        <span class="mu" id="pipsIn"></span>
      </div>
    </section>
    <section class="pan" id="side">
      <div id="tabs"><button data-t="show" class="on">Programma</button><button data-t="guests">Ospiti</button><button data-t="recs">Registrazioni</button></div>
      <div id="tabBody"></div>
    </section>
    <section class="pan" id="pMix" style="grid-column:1/-1">
      <div id="mixer"></div>
    </section>
  </main>
  <footer id="bot">
    <span class="mu">In onda ora:</span>
    <input id="nowT" placeholder="Il titolo arriva da solo dai brani; quando parli resta il nome del programma">
    <span id="silence">SILENZIO IN ONDA</span>
    <span class="sp"></span>
    <span class="mu" id="stat">Pronto</span>
  </footer>
</div>
<div id="toast"></div>
<dialog id="dlg"><h2 id="dlgT"></h2><div class="db" id="dlgB"></div><div class="dbt" id="dlgA"></div></dialog>
<input type="file" id="fAdd" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.opus,.flac,.wma,.aiff" multiple hidden>
<input type="file" id="fCart" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.opus,.flac,.wma,.aiff" hidden>

    $('#dlgT').textContent = title; const B = $('#dlgB'); B.innerHTML = '';

}

/* ---------- playlist ---------- */
async function addFiles(files, at) {

    let file = f;
    const dur = await probeDur(file);
    if (dur < 0) {
      if (NATIVE_CONV) { try { file = await NATIVE_CONV(f); } catch (e) { toast('Formato non supportato: ' + f.name); continue; } }
      else { toast('Formato non supportato: ' + f.name); continue; }
    }
    const key = await storeMedia(file), it = { id: uid('p'), key, name: file.name, dur: dur > 0 ? dur : await probeDur(file), done: false };
    out.push(it); n++;

  if (at == null) S.playlist.push(...out); else S.playlist.splice(at, 0, ...out);

}

}
async function cartFire(i) {

  let buf; try { buf = await cartBuffer(c); } catch (e) { toast('Jingle non disponibile: ' + e.message); return; }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = c.mode === 'loop';
  const g = AC.createGain(); g.gain.value = dbToGain(c.db || 0); src.connect(g); g.connect(cartStrip.in);
  src.onended = () => { if (CP.get(i) && CP.get(i).src === src) { CP.delete(i); renderCarts(); updateNow(); } };
  src.start(); CP.set(i, { src, g, t0: AC.currentTime, dur: buf.duration });

}
function cartStop(i, fade) {

/* ---------- segnale orario: cinque impulsi brevi e uno lungo, che cade esattamente sull'ora ---------- */
function pipsAt(tFull) {
  // tFull = istante (AudioContext) dell'inizio dell'impulso lungo
  for (let k = 5; k >= 0; k--) {
    const t = tFull - k, len = k === 0 ? .5 : .1;
    if (t < AC.currentTime) continue;
    const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 1000; o.type = 'sine';
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5, t + .004); g.gain.setValueAtTime(.5, t + len - .004); g.gain.linearRampToValueAtTime(0, t + len);
    o.connect(g); g.connect(cartStrip.in); o.start(t); o.stop(t + len + .02);
  }
}
function pipsNow() { resume(); pipsAt(AC.currentTime + 5.05); toast('Segnale orario: tra 5 secondi'); }
let pipsArmed = null;
function pipsTick() {
  const now = new Date(), toHour = 3600 - (now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000);
  $('#pipsIn').textContent = S.pipsAuto ? 'prossimo tra ' + fmtT(toHour) : '';
  if (!S.pipsAuto) { pipsArmed = null; return; }
  const hourKey = now.getHours();
  if (toHour < 8 && pipsArmed !== hourKey) { pipsArmed = hourKey; pipsAt(AC.currentTime + toHour); }
}

/* ================= Microfoni ================= */
const MIC = {};
let DEVS = { in: [], out: [] };
async function listDevices() {
  try { const d = await navigator.mediaDevices.enumerateDevices(); DEVS.in = d.filter(x => x.kind === 'audioinput'); DEVS.out = d.filter(x => x.kind === 'audiooutput'); }
  catch (_) { }
}
async function openMic(m) {
  const st = AU.strips[m.id], cur = MIC[m.id];
  if (cur && cur.stream) { cur.stream.getTracks().forEach(t => t.stop()); try { cur.src.disconnect(); } catch (_) { } }
  MIC[m.id] = { stream: null, src: null, err: null };
  if (m.dev === 'none') { refreshStrip(st); return; }
  try {
    // niente elaborazioni automatiche del browser: il suono della voce lo decide la regia
    const a = { echoCancellation: false, autoGainControl: false, noiseSuppression: !!m.nr, channelCount: 1, sampleRate: 48000 };

    const tr = s.getAudioTracks()[0]; if (tr) tr.onended = () => { MIC[m.id].err = 'scollegato'; refreshStrip(st); toast(m.name + ': microfono scollegato'); };
    await listDevices();
  } catch (e) {
    MIC[m.id].err = e.name === 'NotAllowedError' ? 'permesso negato' : e.name === 'NotFoundError' || e.name === 'OverconstrainedError' ? 'non trovato' : e.message;
  }

  refreshStrip(st);
}

/* ================= Messa in onda: invio al server, registrazione, titolo, silenzio ================= */
const AIR = { on: false, state: 'off', t0: 0, kbps: 0, msg: '', lastMeta: '', metaT: 0, silentSince: 0, manualNow: false };

function listenUrl() {

  const m = s.mount.startsWith('/') ? s.mount : '/' + s.mount;
  return (s.tls ? 'https://' : 'http://') + s.host + ([80, 443].includes(+s.port) ? '' : ':' + s.port) + m;
}
async function goAir() {
  resume();

    const r = await ask('Chiudere la trasmissione?', 'Le radio collegate smettono di ricevere il segnale.' + (REC.on ? ' Anche la registrazione si ferma.' : ''), [['Annulla', 0], ['Chiudi la trasmissione', 1, 'pri']]);
    if (r === 1) stopAir(); return;
  }
  if (!NATIVE) {
    ask('Serve il programma per Windows', h('div', {},
      h('p', {}, 'Da qui puoi preparare e provare tutta la regia: microfoni, musica, jingle, cuffia e registrazione funzionano anche nel browser.'),
      h('p', {}, 'Per mandare il segnale al server e quindi alle radio serve il programma per Windows di Newland Studio Suite: il browser non può collegarsi direttamente a un server Icecast.'),
      h('p', {}, h('a', { href: 'https://edicola.grandangoloregionale.it/suite/#pacchetto', target: '_blank', style: 'color:var(--ac)' }, 'Scarica Newland Studio Suite per Windows →'))),
      [['Ho capito', 0, 'pri']]);
    return;
  }
  if (!srvOk()) { const ok = await serverDialog(true); if (!ok) return; }
  await AU.tapReady;
  setAir('connecting', 'Collegamento al server…');
  let r = await NATIVE.start(Object.assign({}, S.server));
  if (r && r.need === 'download') {
    const ok = await installEncoder(); if (!ok) { setAir('off'); return; }
    r = await NATIVE.start(Object.assign({}, S.server));
  }
  if (!r || !r.ok) { setAir('off'); ask('Non riesco a partire', (r && r.error) || 'Errore sconosciuto', [['OK', 0, 'pri']]); return; }
  AIR.on = true; AIR.t0 = Date.now(); AIR.silentSince = 0;

}
function stopAir() {
  AU.tapOn && AU.tapOn(false); AU.onPcm = null;

}

        h('a', { href: 'https://wa.me/?text=' + encodeURIComponent('Collegati alla diretta di ' + (S.server.name || 'radio') + ': ' + link), target: '_blank' }, h('button', {}, 'WhatsApp')),
        h('button', { class: 'ghost', onclick: async () => { if (await ask('Nuovo link?', 'Il link vecchio smette di funzionare.', [['Annulla', 0], ['Crea nuovo link', 1, 'pri']]) === 1) { S.room = roomCode(); save(); guestsStart(); renderTab(); } } }, 'Nuovo link')),
      h('p', { class: 'hint' }, '● ' + st));
    if (!GT.list.size) B.append(h('div', { class: 'plEmpty' }, 'Nessun ospite collegato.'));
    for (const g of GT.list.values()) {
      const lv = h('div', { class: 'lv' }, h('i')); g.lvEl = lv.firstChild;
      B.append(h('div', { class: 'guest' }, h('span', {}, g.stream ? '🟢' : '⚪'), h('b', {}, g.name), lv,
        h('input', { type: 'range', min: -24, max: 12, step: 1, value: g.db, style: 'width:70px', title: 'Volume di ' + g.name, oninput: e => { g.db = +e.target.value; g.g.gain.setTargetAtTime(g.mute ? 0 : dbToGain(g.db), AC.currentTime, .02); } }),
        h('button', { title: g.mute ? 'Riattiva' : 'Togli dall\'onda solo questo ospite', onclick: () => { g.mute = !g.mute; g.g.gain.setTargetAtTime(g.mute ? 0 : dbToGain(g.db), AC.currentTime, .02); sendTally(); renderTab(); } }, g.mute ? '🔇' : '🔊'),
        h('button', { title: 'Scrivi un messaggio', onclick: async () => { const t = prompt('Messaggio per ' + g.name); if (t) guestMsg(g, t); } }, '💬'),
        h('button', { title: 'Chiudi il collegamento', onclick: () => guestDrop(g) }, '✕')));
    }
  } else if (TAB === 'recs') {
    B.append(h('label', { style: 'display:block;margin-bottom:10px' }, h('input', { type: 'checkbox', checked: S.recAuto !== false, onchange: e => { S.recAuto = e.target.checked; save(); } }), ' Registra da solo ogni volta che vai in onda'));
    DB.all('recs').then(list => {
      list.sort((a, b) => b.date - a.date);
      if (!list.length) B.append(h('div', { class: 'plEmpty' }, 'Le puntate registrate compaiono qui. Usa ⏺ REG in alto.'));
      for (const r of list) {
        const ext = (r.blob.type.includes('ogg') ? 'ogg' : 'webm'), fn = r.name.replace(/[\\/:*?"<>|]+/g, '-');
        B.append(h('div', { class: 'guest', style: 'flex-wrap:wrap' }, h('b', { style: 'flex:1 1 100%' }, r.name), h('span', { class: 'mu', style: 'flex:1' }, fmtT(r.dur) + ' · ' + (r.blob.size / 1e6).toFixed(1) + ' MB'),
          h('button', { title: 'Ascolta', onclick: e => { const a = new Audio(URL.createObjectURL(r.blob)); a.controls = true; a.style.width = '100%'; e.target.closest('.guest').append(a); a.play(); e.target.disabled = true; } }, '▶'),
          h('button', { title: 'Scarica il file', onclick: () => { const a = h('a', { href: URL.createObjectURL(r.blob), download: fn + '.' + ext }); a.click(); } }, '⤓'),
          window.nwlNative && window.nwlNative.convert ? h('button', { title: 'Salva in MP3', onclick: () => saveMp3(r, fn) }, 'MP3') : null,
          typeof nwlSend === 'function' ? h('button', { title: 'Apri in NWLtono per montarla', onclick: async () => { await nwlSend(r.blob, fn + '.' + ext, 'NWLradio'); toast('La trovi in NWLtono, tra i file ricevuti'); } }, '→ NWLtono') : null,
          h('button', { title: 'Elimina', onclick: async () => { if (await ask('Eliminare la registrazione?', r.name, [['Annulla', 0], ['Elimina', 1, 'pri']]) === 1) { await DB.del('recs', r.id); renderTab(); } } }, '🗑')));
      }
    });
  }
}
async function saveMp3(r, fn) {
  toast('Converto in MP3…', 60000);
  const f = new File([r.blob], fn + '.webm', { type: r.blob.type });
  const x = await window.nwlNative.convert(f, ['-y', '-i', 'IN', '-vn', '-c:a', 'libmp3lame', '-b:a', '192k'], 'mp3', () => { });
  if (!x || !x.ok) { toast('Conversione non riuscita'); return; }
  h('a', { href: URL.createObjectURL(new Blob([x.data], { type: 'audio/mpeg' })), download: fn + '.mp3' }).click(); toast('MP3 pronto');
}
/* ---------- misure e orologio (60 volte al secondo) ---------- */
const KBUF = new Float32Array(2048), MB = new Float32Array(2048), KHIST = [];
function meterLoop() {
  const t = performance.now();
  for (const s of Object.values(AU.strips)) {
    if (!s.ui) continue;
    const db = peakDb(s.an, s.buf), v = clamp((db + 60) / 60, 0, 1);
    s.peak = Math.max(v, s.peak * .9);
    if (v >= s.hold || t - s.holdT > 1500) { s.hold = v; s.holdT = t; }
    s.ui.vu.style.height = (s.peak * 100) + '%'; s.ui.hold.style.bottom = (s.hold * 100) + '%';
  }
  if (AU.mUI) {
    const dl = peakDb(AU.anL, MB), dr = peakDb(AU.anR, MB), pk = Math.max(dl, dr);
    for (const [el, d] of [[AU.mUI.L, dl], [AU.mUI.R, dr]]) { const v = clamp((d + 60) / 60, 0, 1); el._p = Math.max(v, (el._p || 0) * .9); el.firstChild.style.height = (el._p * 100) + '%'; }
    AU.anK.getFloatTimeDomainData(KBUF); let ms = 0; for (let i = 0; i < KBUF.length; i++) ms += KBUF[i] * KBUF[i]; ms /= KBUF.length;
    KHIST.push(ms); if (KHIST.length > 180) KHIST.shift();
    const avg = KHIST.reduce((a, b) => a + b, 0) / KHIST.length, L = avg > 1e-10 ? -0.691 + 10 * Math.log10(avg) : -70;
    if ((meterLoop.n = (meterLoop.n || 0) + 1) % 6 === 0) {
      $('#lufsV').textContent = L < -60 ? '—' : L.toFixed(1); $('#lufsV').style.color = L > -12 ? 'var(--red)' : L > -20 ? 'var(--grn)' : '';
      $('#pkV').textContent = pk < -60 ? '—' : pk.toFixed(1);
      const gr = Math.min(20, -(AU.proc.comp.reduction || 0) - (AU.proc.agc.reduction || 0) - (AU.proc.lim.reduction || 0));
      $('#grV').style.width = clamp(gr / 20 * 100, 0, 100) + '%';
    }
    silenceTick(pk);
  }
  for (const g of GT.list.values()) if (g.lvEl) { const d = peakDb(g.an, g.buf); g.lvEl.style.width = clamp((d + 60) / 60 * 100, 0, 100) + '%'; }
  deckTick(); for (const d of [DK.A, DK.B]) deckTimes(d);
  cartTick();
  requestAnimationFrame(meterLoop);
}
function clockTick() {
  const n = new Date();
  $('#clock').innerHTML = pad2(n.getHours()) + ':' + pad2(n.getMinutes()) + '<small>:' + pad2(n.getSeconds()) + '</small>';
  $('#airT').textContent = AIR.on ? fmtHMS((Date.now() - AIR.t0) / 1000) : '--:--:--';
  if (REC.on) $('#bRec').textContent = '⏺ ' + fmtHMS((Date.now() - REC.t0) / 1000);
  const ca = $('#cdAir'); if (ca) ca.textContent = AIR.on ? fmtHMS((Date.now() - AIR.t0) / 1000) : '—';
  const ce = $('#cdEnd');
  if (ce) { if (S.showEnd) { const [hh, mm] = S.showEnd.split(':').map(Number), e = new Date(n); e.setHours(hh, mm, 0, 0); const left = (e - n) / 1000; ce.textContent = left > 0 ? '−' + fmtHMS(left) : 'finito'; ce.style.color = left < 120 && left > 0 ? 'var(--red)' : left < 600 && left > 0 ? 'var(--yel)' : ''; } else ce.textContent = '—'; }
  pipsTick();
  $('#stat').textContent = (AC.state === 'running' ? 'Audio attivo' : 'Audio in pausa: clicca un punto qualsiasi') + ' · ' + Math.round(AC.baseLatency * 1000 + (AC.outputLatency || 0) * 1000) + ' ms' + (NATIVE ? ' · programma per Windows' : ' · versione nel browser');
}
/* ---------- guida rapida ---------- */
function helpDialog() {
  ask('Come si usa NWLradio', h('div', {},
    h('p', {}, h('b', {}, '1. Server. '), 'In ⚙ Server inserisci i dati del tuo server Icecast. Il «link per le radio» è l\'indirizzo https da dare alle emittenti FM.'),
    h('p', {}, h('b', {}, '2. Microfoni. '), 'Con ⚙ sul canale scegli il microfono. VOCE accende l\'equalizzatore e il compressore da radio. ON AIR apre il microfono (Ctrl+1, Ctrl+2): la musica si abbassa da sola.'),
    h('p', {}, h('b', {}, '3. Musica. '), 'Trascina i brani nella playlist. ▶ sul lettore manda in onda; AUTO fa partire il brano successivo in dissolvenza sull\'altro lettore.'),
    h('p', {}, h('b', {}, '4. Jingle. '), 'Clic su un tasto vuoto per scegliere il file, tasto destro per nome, colore e modalità. F1–F12 dalla tastiera. Il segnale orario può partire da solo a ogni ora.'),
    h('p', {}, h('b', {}, '5. Ospiti. '), 'Nella scheda Ospiti copi il link da mandare: l\'ospite si collega dal telefono e va in onda quando accendi il canale OSPITI.'),
    h('p', {}, h('b', {}, '6. In onda. '), '«VAI IN ONDA» manda il segnale al server; la puntata si registra da sola. Il processore tiene il livello costante e non fa mai distorcere: la sonorità giusta per le radio è tra −16 e −14 LUFS.'),
    h('p', { class: 'hint' }, 'Usa sempre la cuffia quando apri il microfono. Versione ' + APP_VER + '.')), [['Ho capito', 0, 'pri']]);
}

/* ================= Avvio ================= */
(async function main() {
  await loadSettings();
  for (const m of S.mics) { const s = makeStrip(m.id, { name: m.name, kind: 'mic', on: false }); s.trim.gain.value = dbToGain(m.trim || 0); s.onToggle = () => { hpMuteCheck(); updateNow(); }; voiceChain(s, m.voice); }
  gstStrip = makeStrip('gst', { name: 'Ospiti', kind: 'guest', on: false }); gstStrip.onToggle = () => sendTally();
  makeDeck('A'); makeDeck('B');
  DK.A.st.onToggle = DK.B.st.onToggle = () => updateNow();
  cartStrip = makeStrip('crt', { name: 'Jingle', kind: 'cart', on: true });
  AU.master.gain.value = dbToGain(S.master); AU.hpVol.gain.value = S.hp.vol ?? 1;
  applyProc(); updateDuck();
  if (S.hp.dev) setHpDevice(S.hp.dev);
  buildDecks(); renderPlaylist(); renderCarts(); renderMixer(); openTab('show');
  $('#xf').value = S.xfade; $('#bPips').classList.toggle('on', S.pipsAuto);
  if (typeof nwlDock === 'function') { nwlHomeCSS(); const w = h('div', { class: 'nwlh ninl', style: '--ha:#ff9f1c' }, nwlDock('radio')); $('#dockSlot').append(w); }
  // carica i primi brani nei lettori
  for (const d of [DK.A, DK.B]) { const nx = nextItem(); if (nx) await deckLoad(d, nx); }
  setAir('off'); updateNow();
  requestAnimationFrame(meterLoop); setInterval(clockTick, 250); clockTick();
  for (const m of S.mics) openMic(m);
  guestsStart();
  if (localStorage.getItem('nwlradio.visto') !== APP_VER) { localStorage.setItem('nwlradio.visto', APP_VER); setTimeout(helpDialog, 600); }
})();
/* ---------- comandi ---------- */
$('#bAdd').onclick = () => $('#fAdd').click();
$('#fAdd').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
$('#bAuto').onclick = () => { S.auto = !S.auto; save(); renderPlaylist(); toast(S.auto ? 'AUTO: i brani partono uno dopo l\'altro' : 'AUTO spento: i brani li fai partire tu'); };
$('#xf').onchange = e => { S.xfade = +e.target.value; save(); };
$('#bClr').onclick = async () => { if (await ask('Svuotare la playlist?', 'I brani caricati nei lettori restano.', [['Annulla', 0], ['Svuota', 1, 'pri']]) !== 1) return; S.playlist = S.playlist.filter(p => p === DK.A.item || p === DK.B.item); save(); renderPlaylist(); cleanupMedia(); };
$('#bStopCarts').onclick = cartStopAll;
$('#fCart').onchange = e => { const f = e.target.files[0]; if (f && cartSel >= 0) cartSetFile(cartSel, f); e.target.value = ''; };
$('#bPipsNow').onclick = pipsNow;
$('#bPips').onclick = () => { S.pipsAuto = !S.pipsAuto; save(); $('#bPips').classList.toggle('on', S.pipsAuto); toast(S.pipsAuto ? 'Il segnale orario parte da solo allo scoccare di ogni ora' : 'Segnale orario automatico spento'); };
$$('#tabs button').forEach(b => b.onclick = () => openTab(b.dataset.t));
$('#bAir').onclick = goAir;
$('#bRec').onclick = () => REC.on ? recStop() : recStart();
$('#bSrv').onclick = () => serverDialog(false);
$('#bHelp').onclick = helpDialog;
$('#nowT').addEventListener('input', e => { AIR.manualNow = !!e.target.value.trim(); updateNow(); });
$('#nowT').addEventListener('change', e => { if (!e.target.value.trim()) { AIR.manualNow = false; updateNow(); } });
const pd = $('#pDecks');
pd.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); pd.classList.add('drag-over'); } });
pd.addEventListener('dragleave', e => { if (!pd.contains(e.relatedTarget)) pd.classList.remove('drag-over'); });
pd.addEventListener('drop', e => { pd.classList.remove('drag-over'); if (e.defaultPrevented) return; e.preventDefault(); if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); });
addEventListener('dragover', e => e.preventDefault()); addEventListener('drop', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select') && !/^F\d+$/.test(e.key)) return;
  const f = /^F(\d+)$/.exec(e.key);
  if (f && +f[1] <= 12) { e.preventDefault(); cartFire(+f[1] - 1); return; }
  if (e.ctrlKey && (e.key === '1' || e.key === '2')) { e.preventDefault(); const s = AU.strips['m' + e.key]; setOn(s, !s.on); return; }
  if (e.key === 'Escape' && CP.size) cartStopAll();
});
addEventListener('beforeunload', e => { if (AIR.on || REC.on) { e.preventDefault(); e.returnValue = ''; } });

</script>
