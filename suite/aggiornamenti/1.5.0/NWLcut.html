<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NWLcut — Newland Studio</title>
<meta name="theme-color" content="#0f1512">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Anton&family=Bebas+Neue&family=Lora:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;700;800&family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c110e;--panel:#131b17;--panel2:#1a2620;--panel3:#223129;--line:#26392f;
  --text:#eef4f0;--muted:#8aa89a;--accent:#1fb069;--ink:#03220f;--mint:#76e3aa;--red:#ff5a52;--ok:#1fb069;--blue:#4f8fd6;
  --r:10px;--shadow:0 10px 30px rgba(0,0,0,.35);
  --hw:168px;--th:74px;--rh:26px;--tlh:40vh
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(1100px 600px at 85% -15%,rgba(118,227,170,.07),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(31,176,105,.08),transparent 55%),var(--bg);color:var(--text);font:13px/1.4 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 11px;min-height:32px;font-family:"Archivo","Inter",sans-serif;font-weight:500;letter-spacing:.01em;transition:background .15s,border-color .15s,color .15s,transform .1s;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:hover{border-color:#3a5546;background:var(--panel3)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.on{background:rgba(31,176,105,.18);border-color:var(--accent);color:var(--mint)}
button.primary{background:linear-gradient(180deg,#26c477,#1a9c5c);border-color:#1fb069;color:var(--ink);font-weight:700;box-shadow:0 4px 14px rgba(31,176,105,.25)}
button.primary:hover{background:linear-gradient(180deg,#2fd383,#1fb069);border-color:#2fd383}
button.rec{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--panel3)}
button svg{width:16px;height:16px;flex:none}
select,input[type=number],input[type=text],input[type=url],textarea{background:#0f1813;border:1px solid var(--line);border-radius:8px;padding:4px 8px;min-height:30px}
select:focus,input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(31,176,105,.15)}
textarea{width:100%;resize:vertical;min-height:70px}
input[type=range]{accent-color:var(--accent);width:100%;min-width:0}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
input[type=color]{width:38px;height:30px;padding:0 2px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.muted{color:var(--muted)}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* toolbar */
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;background:linear-gradient(180deg,rgba(19,27,23,.96),rgba(15,22,18,.96));border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(118,227,170,.04)}
#brand{display:flex;align-items:center;gap:9px;margin-right:6px;line-height:1}
#brand svg{width:26px;height:26px;flex:none}
#brand b{display:block;font-family:"Archivo",sans-serif;font-weight:700;font-size:15px;letter-spacing:-.01em}
#brand small{display:block;font-family:"Archivo",sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mint);margin-bottom:3px}
#pname{width:170px}
.sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.grow{flex:1}

/* work area */
#work{flex:1;min-height:0;display:flex}
#side{width:272px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side.hide{display:none}
.stabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line)}
.stabs button{flex:1;border-radius:7px 7px 0 0;border-bottom:none;min-height:30px;padding:4px 4px;font-size:12px}
.stabs button.on{background:var(--panel3);color:var(--mint);border-color:var(--line);box-shadow:inset 0 2px 0 var(--accent)}
.spane{flex:1;overflow:auto;padding:8px;display:none}
.spane.on{display:block}
.spane h4{margin:14px 2px 7px;font-family:"Archivo",sans-serif;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--mint)}
.spane h4:first-child{margin-top:2px}
.libitem{display:flex;align-items:center;gap:7px;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:6px;touch-action:pan-y}
.libitem .lthumb{width:64px;height:38px;flex:none;border-radius:4px;background:#000 center/cover no-repeat;position:relative;overflow:hidden}
.libitem .lthumb canvas{width:100%;height:100%;display:block}
.libitem .linfo{flex:1;min-width:0}
.libitem .lname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.libitem .lmeta{font-size:11px;color:var(--muted)}
.libitem button{min-height:28px;padding:2px 8px}
.grip{cursor:grab;touch-action:none;color:var(--muted);padding:4px 2px;user-select:none;font-size:15px;line-height:1}
.fxitem{display:flex;align-items:center;gap:6px;padding:6px 7px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:5px;cursor:pointer;user-select:none}
.fxitem:hover{border-color:#50555e}
.fxitem .fxn{flex:1;min-width:0}
.fxitem .fxn small{display:block;color:var(--muted);font-size:11px}
.fxitem button{min-height:26px;padding:2px 7px;font-size:12px}
.drop-hint{border:1px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--muted);font-size:12px}

#stage{flex:1;min-width:0;display:flex;flex-direction:column;background:#0b0c0e}
#viewer{flex:1;min-height:0;position:relative;overflow:hidden;background:radial-gradient(600px 300px at 50% 40%,rgba(31,176,105,.06),transparent 70%),#080c0a}
#cv,#ov{position:absolute;left:0;top:0}
#cv{background:#000;box-shadow:0 0 0 1px #24372d,0 18px 50px rgba(0,0,0,.55);border-radius:4px}
#ov{touch-action:none}
#emptyMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);pointer-events:none;padding:20px}
#emptyMsg b{color:var(--text)}
#transport{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
#tc{font-variant-numeric:tabular-nums;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:13px;padding:4px 10px;background:#0b120e;border:1px solid var(--line);border-radius:8px;color:var(--mint)}
#bPlay{min-width:46px}

#insp{width:310px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 12px}
#insp h3{margin:4px 0 6px;font-family:"Archivo",sans-serif;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:-.005em}
#insp details{border-top:1px solid var(--line);padding:6px 0}
#insp summary{cursor:pointer;font-family:"Archivo",sans-serif;font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mint);padding:6px 0;list-style:none;display:flex;align-items:center;gap:6px}
#insp summary::before{content:"▸";color:var(--muted);transition:transform .15s}
#insp details[open] summary::before{transform:rotate(90deg)}
.row{display:grid;grid-template-columns:88px 1fr 58px;align-items:center;gap:7px;margin:5px 0}
.row label{color:var(--muted);font-size:12px}
.row input[type=number]{width:58px;padding:3px 4px;min-height:26px}
.row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row2 label{color:var(--muted);font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{min-height:28px;padding:3px 8px;font-size:12px}
.hint{font-size:12px;color:var(--muted);margin:4px 0}
#sheetHead{display:none}

/* timeline */
#split{height:7px;cursor:row-resize;background:var(--panel);border-top:1px solid var(--line);touch-action:none;display:flex;align-items:center;justify-content:center}
#split::after{content:"";width:40px;height:3px;border-radius:2px;background:var(--line)}
#tl{height:var(--tlh);flex:none;display:flex;flex-direction:column;background:var(--bg);min-height:120px}
#tlbar{display:flex;align-items:center;gap:5px;padding:5px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tlbar button{min-height:29px;padding:3px 8px}
#zoom{width:110px}
#scroller{flex:1;overflow:auto;position:relative;overscroll-behavior:contain}
#content{position:relative;min-height:100%}
#rulerRow{position:sticky;top:0;z-index:6;display:flex;height:var(--rh);background:var(--panel)}
#corner{position:sticky;left:0;z-index:7;width:var(--hw);flex:none;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 8px;color:var(--muted);font-size:11px}
#ruler{position:sticky;left:var(--hw);display:block;cursor:pointer;touch-action:none;border-bottom:1px solid var(--line)}
.trow{display:flex;height:var(--th);border-bottom:1px solid #22252a}
.trow.selT .thead{background:var(--panel3)}
.trow.dropTarget .lane{background:#1f2a1f}
.thead{position:sticky;left:0;z-index:4;width:var(--hw);flex:none;background:var(--panel);border-right:1px solid var(--line);border-left:4px solid var(--c);padding:3px 6px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.thead .tl1{display:flex;align-items:center;gap:4px}
.tname{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:5px;padding:1px 4px;min-height:22px;height:22px;font-weight:600;font-size:12px}
.tname:hover,.tname:focus{border-color:var(--line);background:var(--panel2)}
.thead .tb{min-height:22px;height:22px;padding:0 6px;font-size:11px;border-radius:5px}
.thead .tb.on{background:rgba(31,176,105,.2);border-color:var(--accent);color:var(--mint)}
.thead .tb.warn{background:var(--red);border-color:var(--red);color:#fff}
.thead .tl2{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.thead .tl2 input{height:16px}
.tkind{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lane{position:relative;flex:none;background:repeating-linear-gradient(90deg,transparent 0 99px,#1c1e22 99px 100px)}
.clip{position:absolute;top:4px;bottom:4px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.35);background:var(--cc);border:1px solid rgba(255,255,255,.14);overflow:hidden;cursor:grab;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
.clip.sel{outline:2px solid #fff;outline-offset:0;z-index:2;touch-action:none}
.clip.locked{opacity:.75;cursor:default}
.clip canvas{position:absolute;left:0;top:0;height:100%;pointer-events:none}
.clip .cl{position:absolute;left:5px;top:2px;right:5px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none;display:flex;gap:4px;align-items:center}
.clip .badge{background:rgba(0,0,0,.55);border-radius:3px;padding:0 4px;font-size:10px}
.clip .trim{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:2}
.clip .trim.l{left:0}.clip .trim.r{right:0}
.clip.sel .trim{background:rgba(255,255,255,.28)}
.clip .trim::after{content:"";position:absolute;top:35%;bottom:35%;left:4px;width:2px;background:rgba(255,255,255,.7);border-radius:1px}
.clip .tri{position:absolute;top:0;width:0;height:0;pointer-events:none}
.clip .fadeS{position:absolute;top:0;bottom:0;pointer-events:none}
.clip .trmark{position:absolute;bottom:2px;font-size:10px;background:rgba(0,0,0,.6);border-radius:3px;padding:0 3px;pointer-events:none}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:8;pointer-events:none;box-shadow:0 0 8px rgba(255,90,82,.5)}
#ph::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid var(--red)}
.newlane{display:flex;height:50px;text-align:center;padding:0 10px;font-size:12px;align-items:center;justify-content:center;border:2px dashed #3d4550;margin:4px 6px;border-radius:8px;color:var(--muted);position:sticky;left:6px;width:calc(min(100vw,100%) - 12px)}
body.dragging .newlane{border-color:#6b7380;color:var(--text);background:#1b1e23;bottom:4px;z-index:9;box-shadow:0 -6px 18px rgba(0,0,0,.5)}
.newlane.hot{border-color:var(--accent)!important;color:var(--mint)!important;background:#12291d!important}
#trackDrop{position:absolute;left:0;right:0;height:3px;background:var(--accent);z-index:9;display:none;pointer-events:none}
#trackDrop.ins{height:4px;box-shadow:0 0 10px var(--accent)}
.clip.dropTarget{outline:2px dashed var(--accent);outline-offset:-2px}
.cutbtn{position:absolute;top:50%;width:22px;height:22px;min-height:0;margin:-11px 0 0 -11px;padding:0;border-radius:50%;background:#f1efe9;color:#111;border:2px solid #111;z-index:3;font-size:13px;font-weight:700;line-height:1;opacity:.85}
.cutbtn:hover{opacity:1;background:var(--accent);border-color:#111}
.cutbtn.has{background:var(--accent)}
#cutMenu{position:fixed;z-index:120;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;width:360px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
#cutMenu .cmh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#cutMenu .cmgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
#cutMenu .cmgrid button{flex-direction:column;gap:2px;min-height:54px;padding:4px 2px;font-size:10.5px;white-space:normal;line-height:1.1}
#cutMenu .cmgrid i{font-style:normal;font-size:18px}
#tracks{user-select:none;-webkit-user-select:none}
#marq{position:absolute;z-index:9;display:none;border:1.5px dashed var(--mint);background:rgba(118,227,170,.10);border-radius:4px;pointer-events:none}
.clip.msel{outline:2px solid var(--mint);outline-offset:-1px;box-shadow:0 0 0 3px rgba(118,227,170,.25)}
.tvol{flex:none;min-height:22px;height:22px;padding:0 7px;font-size:11px;font-family:"JetBrains Mono",monospace;border-radius:6px;background:#0f1813;color:var(--mint);cursor:ew-resize}
.tvol.low{color:#ffd34d}
#volPop{position:fixed;z-index:130;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:300px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
#volPop .vh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#volPop .vbig{font-family:"JetBrains Mono",monospace;font-size:22px;color:var(--mint);text-align:center;margin:4px 0 2px}
#volPop input[type=range]{height:28px}
#ghost{position:fixed;z-index:100;pointer-events:none;background:var(--panel3);border:1px solid var(--accent);border-radius:7px;padding:5px 9px;font-size:12px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#snapLine{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);z-index:7;display:none;pointer-events:none}

/* dialogs, toast */
dialog{background:linear-gradient(180deg,#16211b,#121a16);color:var(--text);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:18px 20px;width:min(480px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 10px;font-family:"Archivo",sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em}
dialog .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
#prog{height:10px;background:var(--panel3);border-radius:5px;overflow:hidden;margin:12px 0 6px}
#prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}

dialog.big{width:min(980px,96vw);max-height:94vh;padding:0;display:none;flex-direction:column}
dialog.big[open]{display:flex}
.iphead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.iphead h2{margin:0;font-size:16px}
.ipbody{display:flex;gap:12px;padding:12px 16px;min-height:0;flex:1;overflow:auto}
#ipList{width:230px;flex:none;overflow:auto;max-height:62vh}
.ipitem{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer;background:var(--panel2);font-size:12px}
.ipitem.on{border-color:var(--accent)}
.ipitem .ipn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ipmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
#ipStage{background:#000;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;overflow:hidden}
#ipStage video,#ipStage img{max-width:100%;max-height:52vh;display:block}
#ipStage audio{width:92%;margin:10px 0 16px}
.ipaudio{padding:30px 10px 6px;color:var(--muted)}
#ipBar{position:relative;height:16px;background:var(--panel3);border-radius:8px;cursor:pointer;margin-top:4px}
#ipSel{position:absolute;top:0;bottom:0;background:rgba(31,176,105,.6);border-radius:8px}
#ipPos{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff}
.ipfoot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
@media (max-width:760px){.ipbody{flex-direction:column}#ipList{width:auto;max-height:22vh}}

button.brandbtn{background:linear-gradient(135deg,#0e8f5b,#1fb069 55%,#8cc63f);border-color:#2fd383;color:#03220f;font-weight:700}
button.brandbtn:hover{filter:brightness(1.08)}
.fxitem.brand{background:linear-gradient(90deg,rgba(31,176,105,.18),rgba(31,176,105,.04));border-color:#2c6b4b}
.fxitem.brand .grip{color:var(--accent);font-size:16px}
dialog.wide{width:min(1040px,96vw)}
.gen{display:flex;gap:18px;align-items:flex-start}
.genL{flex:1;min-width:0;max-height:66vh;overflow:auto;padding-right:6px}
.genR{width:min(440px,42%);flex:none;position:sticky;top:0}
.genR canvas{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.45);background:#000;display:block}
.gen .eyebrow{font-family:"Archivo",sans-serif;font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:var(--mint);margin:0 0 4px}
.gen h3{font-family:"Archivo",sans-serif;font-size:19px;margin:0 0 12px;letter-spacing:-.01em}
.gfield{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.gfield label{font-size:11.5px;color:var(--muted);font-weight:500}
.gfield input,.gfield select{width:100%;min-height:34px}
.grow3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gcheck{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.gsep{margin:14px 0 2px;padding-top:10px;border-top:1px solid var(--line);font-family:"Archivo",sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mint)}
@media (max-width:760px){.gen{flex-direction:column-reverse}.genR{width:100%;position:static}.genL{max-height:none}}

svg.auto{position:absolute;left:0;top:1px;z-index:5;overflow:visible;cursor:crosshair;touch-action:none}
svg.auto.passive{pointer-events:none;z-index:2}
svg.auto .abg{fill:rgba(8,14,11,.35)}
svg.auto .a0{stroke:rgba(118,227,170,.25);stroke-dasharray:4 4}
svg.auto .aline{fill:none;stroke:#ffd34d;stroke-width:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
svg.auto.passive .aline{stroke:rgba(255,211,77,.7);stroke-width:1.5}
svg.auto .apt{fill:#ffd34d;stroke:#1a1200;stroke-width:2;cursor:grab}
svg.auto .apt:hover{r:8}
svg.auto .ahint{fill:#ffd34d;font:600 11px Inter,sans-serif;pointer-events:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#173024;color:#eef4f0;border:1px solid var(--line);padding:9px 15px;border-radius:9px;z-index:200;display:none;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
[data-m]{display:none}
#fileIn,#projIn{display:none}
#vids{position:fixed;left:-9999px;top:0;width:2px;height:2px;overflow:hidden}
.lbl{display:inline}

@media (min-width:761px) and (max-width:1640px){
  #bText .tb-l,#bRec .tb-l,#bSubs .tb-l,#bSide .tb-l{display:none}
  #pname{width:130px}
}
@media (min-width:761px) and (max-width:1250px){
  #insp{width:270px}
  #side{width:240px}
  .tb-l{display:none}
}
@media (max-width:760px){
  :root{--hw:104px;--th:68px}
  #work{flex:none}
  #viewer{flex:none;height:var(--pvh,32vh)}
  #tl{flex:1 1 auto;height:auto;min-height:150px}
  #bStart,#bEnd,#bGuides,#bFull,#bDetach,#zoom{display:none}
  #tc{font-size:11px;padding:0 2px}
  #tlbar{flex-wrap:nowrap;overflow-x:auto}
  #toolbar{padding:6px;gap:4px}
  #toolbar button{padding:4px 7px}
  #pname{width:110px}
  .tb-l,#brand span{display:none}
  [data-m]{display:inline}
  .sep{display:none}
  #work{flex-direction:column}
  #stage{min-height:0}
  #side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);z-index:50;box-shadow:8px 0 30px rgba(0,0,0,.6)}
  #insp{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:62vh;z-index:50;border-left:none;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.6);display:none;padding-top:0}
  #insp.open{display:block}
  #sheetHead{display:flex;position:sticky;top:0;background:var(--panel);z-index:2;padding:8px 0;justify-content:space-between;align-items:center}
  .thead .tl2{display:none}
  .thead .tkind{display:none}
  .row{grid-template-columns:80px 1fr 56px}
  #transport{padding:5px 6px;gap:4px}
  #transport button{padding:4px 8px}
}
/* menu tasto destro */
#ctxMenu,#ctxMenu .csub{position:fixed;z-index:140;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.6);font-size:13px}
#ctxMenu .csub{position:absolute;left:100%;top:-6px;display:none;max-height:70vh;overflow:auto}
#ctxMenu.left .csub{left:auto;right:100%}
#ctxMenu .citem{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:30px;padding:4px 10px;border:0;border-radius:6px;background:none;color:var(--text);text-align:left;cursor:pointer;position:relative;font-size:13px}
#ctxMenu .citem:hover:not([disabled]),#ctxMenu .hassub:focus-within{background:rgba(255,255,255,.08)}
#ctxMenu .hassub:hover>.csub{display:block}
#ctxMenu .citem[disabled]{opacity:.4;cursor:default}
#ctxMenu .citem.on{color:var(--accent);font-weight:600}
#ctxMenu .citem.danger{color:var(--red)}
#ctxMenu kbd{font:11px inherit;color:var(--muted)}
#ctxMenu i{font-style:normal;color:var(--muted)}
#ctxMenu .csep{height:1px;background:var(--line);margin:4px 6px}
/* anteprime filtri, preset velocità, curve */
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-bottom:8px}
.fxtile{display:flex;flex-direction:column;gap:3px;cursor:pointer;user-select:none;font-size:11px;line-height:1.15;color:var(--text)}
.fxtile canvas{width:100%;aspect-ratio:16/9;border-radius:6px;border:2px solid transparent;background:#000;display:block}
.fxtile:hover canvas{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chips button{flex-direction:column;min-height:36px;padding:3px 8px;font-size:12px;line-height:1.1}
.chips button small{font-size:9.5px;color:var(--muted)}
.chips button.on{border-color:var(--accent);color:var(--accent)}
.rampgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:6px}
.rampgrid button{flex-direction:column;gap:1px;min-height:48px;padding:3px;font-size:10.5px;white-space:normal;line-height:1.1}
.rampgrid button.on{border-color:var(--accent);color:var(--accent)}
.rampsvg{display:inline-flex;flex:none}
/* novità */
.news{display:flex;flex-direction:column;gap:10px;max-width:520px}
.newsit{display:flex;gap:12px;align-items:flex-start}
.newsit .ni{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);font-size:18px}
.newsit b{display:block;margin-bottom:2px}
.newsit p{margin:0;color:var(--muted);font-size:13px;line-height:1.35}
/* kit */
.kitq{min-width:min(560px,86vw)}
.kitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.kq{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px;min-height:96px;text-align:left;white-space:normal}
.kq i{font-style:normal;font-size:22px;color:var(--accent)}
.kq small{color:var(--muted);font-size:11px;line-height:1.2}
.kq canvas{width:100%;aspect-ratio:16/9;border-radius:6px}
.kq[disabled]{opacity:.45}
.kitassets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kitassets>button{font-size:12px}
.kas{display:inline-flex;align-items:center;gap:4px;padding:2px 2px 2px 9px;border:1px solid var(--line);border-radius:16px;font-size:12px}
.kas button{min-height:22px;padding:0 6px}
.kited{display:flex;gap:18px;align-items:flex-start}
.kitL{flex:1;min-width:0;max-height:68vh;overflow:auto;padding-right:6px}
.kitR{width:min(420px,40vw);position:sticky;top:0}
.kitprev{width:100%;border-radius:10px;display:block;background:#000}
.kitbtns{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.kstyles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kst{display:flex;flex-direction:column;gap:3px;padding:4px;font-size:11.5px;min-height:0}
.kst canvas{width:100%;aspect-ratio:16/9;border-radius:5px;display:block}
.kst.on{border-color:var(--accent);color:var(--accent)}
.kcols{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}
.kcol{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.kcol input{width:34px;height:26px;padding:0;border:0;background:none}
.kfile{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.kfile b{min-width:110px;font-size:13px}
.kfile .hint{flex:1;min-width:120px;margin:0}
@media (max-width:760px){.kited{flex-direction:column-reverse}.kitR{width:100%;position:static}.kitL{max-height:none}}
.blrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:8px;margin:6px 0}
.blrow.on{border-color:#ffd23f}.blrow b{cursor:pointer;min-width:34px}.blrow input[type=range]{width:90px}
button.kfon{border-color:#ffd23f;color:#ffd23f}
.exfmts{display:flex;flex-wrap:wrap;gap:10px}.exfmts label{display:flex;align-items:center;gap:4px;font-size:13px}
.subed{min-width:min(760px,90vw)}.subed input[type=text]{flex:1;min-width:120px}
.sublist{max-height:56vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-right:4px}
.subrow{display:flex;gap:6px;align-items:flex-start}.subrow textarea{flex:1;min-height:44px;resize:vertical}.subrow button{min-height:30px;padding:2px 8px;font-variant-numeric:tabular-nums}
#inboxBar{position:fixed;left:14px;bottom:14px;z-index:130;background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:6px;max-width:min(420px,92vw);font-size:13px}
#inboxBar .inr{display:flex;align-items:center;gap:6px}#inboxBar .inr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#inboxBar button{min-height:28px;padding:2px 10px;font-size:12px}
#updBar{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:200;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--accent,#1fb069);color:#06130c;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px;white-space:nowrap}#updBar button{background:#06130c;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:700}

#homeD{position:fixed;inset:0;z-index:900;background:var(--bg,#0e1013);overflow:auto;display:none}
#homeD.on{display:block}
#homeD .hwrap{max-width:1180px;margin:0 auto;padding:28px 28px 60px}
#homeD .hhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
#homeD .hhead small{opacity:.6;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
#homeD h1{margin:2px 0 0;font-size:30px}
#homeD h2{font-size:15px;margin:28px 0 10px;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
#homeD .hnew{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px;border:1px solid var(--line,#2a2e35);border-radius:12px}
#homeD .hnew b{margin-right:6px}
#homeD .hgrid,#homeD .htpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
#homeD .hcard{border:1px solid var(--line,#2a2e35);border-radius:12px;overflow:hidden;background:var(--panel,#16191e);display:flex;flex-direction:column}
#homeD .hcard.cur{outline:2px solid var(--accent,#3b82f6)}
#homeD .hth{aspect-ratio:16/9;background:#000 center/contain no-repeat;border:0;border-radius:0;position:relative;padding:0;cursor:pointer;width:100%}
#homeD .hth span{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.7);font-size:11px;padding:2px 6px;border-radius:4px}
#homeD .hin{padding:8px 10px 2px;display:flex;flex-direction:column;min-width:0}
#homeD .hin b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#homeD .hin small{opacity:.6;font-size:12px}
#homeD .hact{display:flex;gap:4px;padding:6px 8px 8px;justify-content:flex-end}
#homeD .hact button{padding:4px 8px}
#homeD .tcard{white-space:normal;align-items:stretch;display:flex;flex-direction:column;gap:4px;text-align:left;padding:10px;border-radius:12px;cursor:pointer}
#homeD .tth{height:150px;display:flex;align-items:center;justify-content:center;background:#000;border-radius:8px;margin-bottom:4px}
#homeD .tcard b,#homeD .tcard small{white-space:normal;overflow-wrap:anywhere}
#homeD .tcard small{opacity:.65;font-size:12px;line-height:1.35}
.phbox{border:1px dashed var(--accent,#3b82f6);border-radius:10px;padding:10px;margin:8px 0}
.phlib{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.phlib button{text-align:left}
</style>

<style id="nwlTheme">:root{--bg:#040922;--panel:#0a1233;--panel2:#0f1a46;--panel3:#162258;--line:#1e2b63;--text:#eef1ff;--muted:#8f9bc8;--accent:#b4fb0b;--ink:#0a1400;--mint:#d2ff63}
html,body{background:radial-gradient(1100px 600px at 85% -15%,rgba(180,251,11,.06),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(64,120,255,.12),transparent 55%),var(--bg)!important}
button.primary{background:linear-gradient(180deg,#c9ff45,#9ddc00)!important;border-color:#b4fb0b!important;color:#0a1400!important;box-shadow:0 4px 14px rgba(180,251,11,.22)!important}
#viewer{background:radial-gradient(600px 300px at 50% 40%,rgba(64,120,255,.08),transparent 70%),#03061a!important}
#brand img{width:28px;height:28px;border-radius:7px}
#toolbar{background:linear-gradient(180deg,rgba(10,18,51,.97),rgba(6,12,38,.97))!important}
#toast{background:#16224f!important}
dialog{background:linear-gradient(180deg,#0d1640,#0a1233)!important}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div id="brand"><img src="icone/nwlcut.png" alt=""><span><small>Newland Studio</small><b>NWLcut</b></span></div>
    <button id="bSide" title="Libreria, testi, transizioni, effetti">☰ <span class="tb-l">Libreria</span></button>
    <input id="pname" type="text" value="Nuovo video" aria-label="Nome del progetto">
    <span class="sep"></span>
    <button id="bImport" class="primary" title="Importa video, foto, audio">＋ <span class="tb-l">Importa</span></button>
    <button id="bText" title="Aggiungi un testo">T <span class="tb-l">Testo</span></button>
    <button id="bRec" title="Registra la voce mentre guardi il video">● <span class="tb-l">Registra</span></button>
    <button id="bSubs" title="Sottotitoli automatici dalla voce">CC <span class="tb-l">Sottotitoli</span></button>
    <button id="bGen" class="brandbtn" title="Il tuo kit: lower third, logo, sigla, outro e confezione completa">★ <span class="tb-l">Kit</span></button>
    <span class="sep"></span>
    <button id="bUndo" title="Annulla (Ctrl+Z)">↶</button>
    <button id="bRedo" title="Ripristina (Ctrl+Y)">↷</button>
    <span class="sep"></span>
    <select id="selFormat" title="Formato del video" aria-label="Formato">
      <option value="16:9">16:9 orizzontale</option>
      <option value="9:16">9:16 verticale</option>
      <option value="1:1">1:1 quadrato</option>
      <option value="4:5">4:5 post</option>
    </select>
    <span class="grow"></span>
    <button id="bNews" title="Le novità di questa versione">✦ <span class="tb-l">Novità</span></button>
    <button id="bInstall" style="display:none" title="Installa Montaggio Video sul computer, come un programma">⤓ <span class="tb-l">Installa</span></button>
    <button id="bHome" title="Tutti i progetti e i modelli pronti">▦ Progetti</button>
    <button id="bMenu" title="Progetto: nuovo, apri, salva">Progetto ▾</button>
    <button id="bExport" class="primary" title="Esporta il video">⤓ Esporta</button>
  </div>

  <div id="work">
    <aside id="side">
      <div class="stabs">
        <button data-tab="lib" class="on">File</button>
        <button data-tab="txt">Testi</button>
        <button data-tab="tr">Transizioni</button>
        <button data-tab="fx">Effetti</button>
      </div>
      <div class="spane on" id="pane-lib">
        <div class="row2"><button id="libAdd" class="primary" style="flex:1">＋ Importa file</button></div>
        <label class="row2"><input type="checkbox" id="libAuto" checked> <span>Mettili subito sulla timeline</span></label>
        <div id="libList"></div>
      </div>
      <div class="spane" id="pane-txt"></div>
      <div class="spane" id="pane-tr"></div>
      <div class="spane" id="pane-fx"></div>
    </aside>

    <section id="stage">
      <div id="viewer">
        <canvas id="cv"></canvas>
        <canvas id="ov"></canvas>
        <div id="emptyMsg"><div><b>Trascina qui video, foto e audio</b><br>oppure premi «Importa».<br><span style="font-size:12px">Funziona anche dal telefono.</span></div></div>
      </div>
      <div id="transport">
        <button id="bStart" class="ghost" title="Inizio (Home)">⏮</button>
        <button id="bPrevF" class="ghost" title="Fotogramma precedente (←)">◀︎|</button>
        <button id="bPlay" class="primary" title="Play/Pausa (Spazio)">▶</button>
        <button id="bNextF" class="ghost" title="Fotogramma successivo (→)">|▶︎</button>
        <button id="bEnd" class="ghost" title="Fine (End)">⏭</button>
        <span id="tc">00:00:00 / 00:00:00</span>
        <span class="grow"></span>
        <button id="bGuides" class="ghost" title="Mostra guide e area sicura">⊞</button>
        <button id="bEdit" title="Modifica la clip selezionata">✎ Modifica</button>
        <button id="bFull" class="ghost" title="Anteprima a schermo intero">⛶</button>
      </div>
    </section>

    <aside id="insp"></aside>
  </div>

  <div id="split" title="Trascina per ridimensionare la timeline"></div>
  <div id="tl">
    <div id="tlbar">
      <button id="bSplit" title="Taglia la clip al cursore (S)">✂ <span class="tb-l">Taglia</span></button>
      <button id="bDup" title="Duplica (D)">⧉ <span class="tb-l">Duplica</span></button>
      <button id="bDel" title="Elimina (Canc)">🗑 <span class="tb-l">Elimina</span></button>
      <button id="bSelAll" title="Seleziona tutte le clip (Ctrl+A). Puoi anche trascinare un riquadro sullo spazio vuoto della timeline">⬚ <span class="tb-l">Seleziona tutto</span></button>
      <button id="bDetach" title="Separa l'audio del video su una traccia audio">♪ <span class="tb-l">Estrai audio</span></button>
      <span class="sep"></span>
      <button id="bSnap" class="on" title="Calamita: aggancia ai bordi delle clip e al cursore">🧲</button>
      <button id="bZoomOut" title="Riduci zoom">−</button>
      <input id="zoom" type="range" min="0" max="100" value="40" aria-label="Zoom timeline">
      <button id="bZoomIn" title="Aumenta zoom">+</button>
      <button id="bFit" title="Adatta tutto">↔</button>
      <span class="grow"></span>
      <button id="bAddV" title="Nuova traccia video/testo">＋ <span class="tb-l">Traccia video</span><span class="lbl" data-m>V</span></button>
      <button id="bAddA" title="Nuova traccia audio">＋ <span class="tb-l">Traccia audio</span><span class="lbl" data-m>A</span></button>
    </div>
    <div id="scroller">
      <div id="content">
        <div id="rulerRow"><div id="corner">Tracce</div><canvas id="ruler"></canvas></div>
        <div id="tracks"></div>
        <div class="newlane" id="newBot">＋ Trascina qui file, clip o elementi della libreria per creare una nuova traccia</div>
        <div id="ph"></div>
        <div id="snapLine"></div>
        <div id="marq"></div>
        <div id="trackDrop"></div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileIn" multiple accept="video/*,image/*,audio/*,.mp4,.mov,.qt,.m4v,.webm,.mkv,.avi,.3gp,.mts,.m2ts,.ts,.mpg,.mpeg,.vob,.wmv,.asf,.flv,.f4v,.ogv,.mxf,.dv,.divx,.rm,.rmvb,.hevc,.mp3,.wav,.m4a,.aac,.ogg,.flac,.opus,.wma,.aif,.aiff,.amr,.ac3,.mka,.caf,.m4b,.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif,.heic,.heif,.tif,.tiff,.dng">
<input type="file" id="projIn" accept=".mvideo,.zip">
<input type="file" id="srtIn" accept=".srt,text/plain" style="display:none">
<div id="ghost"></div>
<div id="toast"></div>
<div id="vids"></div>

<dialog id="dlg"><h2 id="dlgT"></h2><div id="dlgB"></div><div class="btns" id="dlgBtns"></div></dialog>

      const r = indexedDB.open('montaggio-video', 2);
      r.onupgradeneeded = () => { const d = r.result; for (const n of ['media', 'kv', 'projects']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); };
      r.onsuccess = () => { DB.db = r.result; res(DB.db); }; r.onerror = () => res(null);

}

}

    return new File([data], base + '.' + cv.ext, { type: cv.type });
  } catch (e) { if (e.message !== 'Annullato') { console.error(e); toast('Non riesco a convertire ' + f.name + ': ' + e.message, 8000); } return null; }
  finally { ui.close(); }
}
/* importa: se il browser non apre il file, prova a convertirlo */
async function addSourceSmart(f) {
  try { return await addSourceFromBlob(f, f.name); }
  catch (e) {
    const k = kindOf(f); if (!k) throw e;
    console.warn('apertura diretta non riuscita, converto', f.name, e);
    const conv = await convertMedia(f, k); if (!conv) throw e;
    return await addSourceFromBlob(conv, conv.name);
  }
}

document.addEventListener('keydown', e => {
  const tg = e.target; if (tg.closest && tg.closest('input[type=text],input[type=number],textarea,select')) { if (e.key === 'Escape') tg.blur(); return; }
  if ($('#dlg').open) return;
  const k = e.key, mod = e.ctrlKey || e.metaKey;
  if (mod && (k === 'z' || k === 'Z')) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && (k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
  if (mod && (k === 's' || k === 'S')) { e.preventDefault(); saveProject(); return; }
  if (mod && (k === 'c' || k === 'C')) { doCopy(); return; }
  if (mod && (k === 'v' || k === 'V')) { doPaste(); return; }
  if (mod && (k === 'a' || k === 'A')) { e.preventDefault(); selectAll(); return; }
  if (mod) return;
  if (k === ' ') { e.preventDefault(); if (tg.blur) tg.blur(); togglePlay(); }
  else if (k === 's' || k === 'S') doSplit();
  else if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); doDelete(e.shiftKey); }
  else if (k === 'd' || k === 'D') doDuplicate();
  else if (k === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? setPlayhead(S.playhead - 1) : stepFrame(-1); }
  else if (k === 'ArrowRight') { e.preventDefault(); e.shiftKey ? setPlayhead(S.playhead + 1) : stepFrame(1); }
  else if (k === 'Home') setPlayhead(0);
  else if (k === 'End') setPlayhead(projDur());
  else if (k === '+' || k === '=') setZoom(S.pps * 1.4);
  else if (k === '-') setZoom(S.pps / 1.4);
  else if (k === 'Escape') { clearSel(); }
