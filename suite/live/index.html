<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NWLlive — Newland Studio</title>
<meta name="theme-color" content="#0a0610">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060c;--p1:#0f0d18;--p2:#16131f;--p3:#1e1a2a;--line:rgba(255,255,255,.09);--tx:#ece9f6;--mu:#968fae;--red:#ff3b5c;--red2:#ff7a8f;--grn:#21d07a;--yel:#ffc23d;--cy:#40d6ff;--lime:#b4fb0b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 Inter,system-ui,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-rows:48px minmax(0,56fr) minmax(0,44fr);height:100%}
/* barra */
header{display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--p1);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;margin-right:6px}
.brand img{width:28px;height:28px;border-radius:8px}
.brand b{font:800 15px Archivo,sans-serif;letter-spacing:.02em;display:block;line-height:1}
.brand small{display:block;font-size:9.5px;letter-spacing:.24em;color:var(--mu);font-weight:700;text-transform:uppercase}
.hb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--p2);font-weight:600;white-space:nowrap}
.hb:hover{background:var(--p3)}
.hb.on{border-color:var(--red);background:rgba(255,59,92,.16);color:#fff}
.hb.rec.on{background:var(--red);color:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.72}}
.hb svg{width:15px;height:15px}
.sp{flex:1}
.clock{font:700 15px ui-monospace,Consolas,monospace;color:#fff;padding:0 8px}
.pname{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;width:170px;font-weight:600}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--p2);outline:none}
/* monitor */
.mon{display:grid;grid-template-columns:1fr 120px 1fr;gap:10px;padding:10px;min-height:0}
.screen{display:flex;flex-direction:column;min-height:0;min-width:0}
.screen .lab{display:flex;align-items:center;gap:8px;padding:0 2px 6px;font:700 11px Archivo,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.screen .lab i{width:9px;height:9px;border-radius:50%}
.screen.pv .lab i{background:var(--grn)} .screen.pg .lab i{background:var(--red)}
.screen .lab span{color:var(--mu);letter-spacing:.04em;text-transform:none;font:600 12px Inter,sans-serif}
.frame{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;border-radius:8px;overflow:hidden}
.screen.pv .frame{box-shadow:0 0 0 2px var(--grn)}
.screen.pg .frame{box-shadow:0 0 0 2px var(--red)}
.frame canvas{max-width:100%;max-height:100%;aspect-ratio:16/9;display:block;background:#000}
.frame .ed{position:absolute;inset:0;pointer-events:none}
.trans{display:flex;flex-direction:column;gap:8px;align-items:stretch;justify-content:center}
.tbtn{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--p2);font:800 14px Archivo,sans-serif;letter-spacing:.08em}
.tbtn.cut{background:#2a1520;border-color:#5a2434}
.tbtn.auto{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 8px 24px rgba(255,59,92,.3)}
.tbtn:hover{filter:brightness(1.15)}
.tbtn.ftb{height:38px;font-size:12px;background:#111;border-color:#333}
.tbtn.ftb.on{background:#000;border-color:#fff;color:#fff;animation:blink 1s infinite}
.tbar{position:relative;height:96px;display:flex;justify-content:center}
.tbar input{writing-mode:vertical-lr;direction:rtl;width:34px;height:96px;accent-color:var(--red)}
.trans select,.trans input[type=number]{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:6px;width:100%}
.trans small{color:var(--mu);font-size:11px;text-align:center}
/* parte bassa */
.low{display:grid;grid-template-columns:minmax(0,1fr) 360px 290px;gap:10px;padding:0 10px 10px;min-height:0}
.box{background:var(--p1);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.box>.hd{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.box>.hd b{font:700 11px Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);margin-right:auto}
.box>.bd{flex:1;overflow:auto;padding:10px;min-height:0}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:transparent;color:var(--mu);font-weight:700;padding:5px 10px;border-radius:7px;font-size:12px}
.tabs button.on{background:var(--p3);color:#fff}
.sb{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--p2);font-weight:600;font-size:12px;white-space:nowrap}
.sb:hover{background:var(--p3)}
.sb.pri{background:var(--red);border-color:var(--red);color:#fff}
.sb.ok{background:#123b26;border-color:#1d6b43;color:#bff5d6}
.sb.dan{color:#ff9aa9}
.grp{font:700 10.5px Archivo,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);margin:2px 0 8px;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.tile{position:relative;background:var(--p2);border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;user-select:none}
.tile canvas{display:block;width:100%;aspect-ratio:16/9;background:#000}
.tile .nm{display:flex;align-items:center;gap:6px;padding:5px 8px;font-weight:600;font-size:12px}
.tile .nm span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .nm em{font-style:normal;font-size:10px;color:var(--mu);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.tile .k{position:absolute;left:6px;top:6px;font:800 11px ui-monospace,monospace;background:rgba(0,0,0,.65);padding:1px 6px;border-radius:5px}
.tile .st{position:absolute;right:6px;top:6px;font:800 10px Archivo,sans-serif;letter-spacing:.1em;padding:2px 6px;border-radius:5px;display:none}
.tile.inpv{border-color:var(--grn)} .tile.inpv .st.p{display:block;background:var(--grn);color:#02140a}
.tile.inpg{border-color:var(--red)} .tile.inpg .st.g{display:block;background:var(--red);color:#fff}
.tile.inpv.inpg .st.p{display:none}
.tile.sel{outline:2px dashed rgba(255,255,255,.45);outline-offset:2px}
.tile.add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;min-height:110px;border:2px dashed var(--line);background:transparent;color:var(--mu);font-weight:600}
.tile.add:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.tile .wait{position:absolute;inset:0 0 auto 0;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--mu);padding:8px}
.tile .bar{position:absolute;left:0;right:0;bottom:27px;height:3px;background:rgba(255,255,255,.12)}
.tile .bar i{display:block;height:100%;background:var(--cy);width:0}
/* form */
.f{display:grid;gap:4px;margin-bottom:10px}
.f>label,.lbl{font-size:11.5px;color:var(--mu);font-weight:600}
.f input[type=text],.f input[type=number],.f select,.f textarea,.inp{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;outline:none}
.f textarea{resize:vertical;min-height:52px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:rgba(255,59,92,.6)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.rng{display:grid;grid-template-columns:86px 1fr 42px;align-items:center;gap:8px;margin-bottom:6px}
.rng span{font-size:11.5px;color:var(--mu);font-weight:600}
.rng input{width:100%;accent-color:var(--red)}
.rng output{font:600 11px ui-monospace,monospace;text-align:right;color:#cfc9e2}
.chk{display:flex;align-items:center;gap:7px;font-weight:600;margin:4px 0 8px;cursor:pointer}
.chk input{accent-color:var(--red);width:15px;height:15px}
.hint{color:var(--mu);font-size:12px;line-height:1.5;margin:0 0 10px}
.card{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.lay{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;background:var(--p2);border:1px solid var(--line);margin-bottom:5px;cursor:pointer}
.lay.on{border-color:var(--red)}
.lay span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.lay button{border:0;background:transparent;color:var(--mu);padding:2px 5px;border-radius:5px}
.lay button:hover{background:var(--p3);color:#fff}
.preset{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--p2);border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer}
.preset:hover{border-color:rgba(255,255,255,.25)}
.preset div{flex:1;min-width:0}
.preset b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset small{color:var(--mu);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.preset button{border:0;background:transparent;color:var(--mu)}
.onair{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:8px;border:1px solid #5a2434;background:#2a1520;font-weight:800;letter-spacing:.06em;font-size:12px}
.onair.on{background:var(--red);border-color:var(--red);color:#fff}
/* mixer */
.mix{display:flex;gap:6px;height:100%;overflow-x:auto;padding-bottom:4px}
.ch{flex:0 0 58px;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:6px 4px}
.ch.master{background:#1d1222;border-color:#4a2234}
.ch .cn{font-size:10.5px;font-weight:700;text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .fd{flex:1;display:flex;gap:4px;align-items:stretch;min-height:60px}
.ch input[type=range]{writing-mode:vertical-lr;direction:rtl;width:18px;accent-color:#d9d4ea}
.vu{width:8px;background:#0a0910;border-radius:3px;position:relative;overflow:hidden}
.vu i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#21d07a 0,#21d07a 65%,#ffc23d 80%,#ff3b5c 95%);height:0}
.ch .db{font:600 10px ui-monospace,monospace;color:var(--mu)}
.ch button{width:100%;border:1px solid var(--line);background:var(--p1);border-radius:5px;font-size:10px;font-weight:800;padding:3px 0}
.ch button.m.on{background:var(--red);color:#fff;border-color:var(--red)}
.ch button.a.on{background:#123b26;color:#bff5d6;border-color:#1d6b43}
/* finestre */
.modal{position:fixed;inset:0;background:rgba(3,2,8,.7);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(4px)}
.modal.on{display:flex}
.dlg{background:var(--p1);border:1px solid var(--line);border-radius:16px;width:min(560px,94vw);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.dlg h3{margin:0 0 4px;font:800 19px Archivo,sans-serif}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.qr{background:#fff;border-radius:10px;padding:10px;width:max-content;margin:8px auto}
.link{font:12px ui-monospace,monospace;background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:8px;word-break:break-all;user-select:all}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.choice{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--p2);text-align:left}
.choice:hover{border-color:rgba(255,59,92,.6)}
.choice .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--p3);font-size:18px;flex:none}
.choice b{display:block}.choice small{color:var(--mu)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#22192e;border:1px solid var(--line);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:60;pointer-events:none;font-weight:600}
.toast.on{opacity:1;transform:translateX(-50%)}
.chat{display:flex;flex-direction:column;gap:4px;max-height:120px;overflow:auto;margin:6px 0}
.chat div{font-size:12px;background:var(--p2);border-radius:7px;padding:5px 8px}
.chat div b{color:var(--cy)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--mu)}
.dot.ok{background:var(--grn)} .dot.ko{background:var(--red)} .dot.wt{background:var(--yel)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2a2537;border-radius:9px}::-webkit-scrollbar-track{background:transparent}
@media (max-width:1300px){.low{grid-template-columns:minmax(0,1fr) 320px 230px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><img src="icon-192.png" alt=""><div><small>Newland Studio</small><b>NWLlive</b></div></div>
    <input class="pname" id="pname" value="Diretta" title="Nome del progetto">
    <button class="hb" id="bSave" title="Salva il progetto (Ctrl+S)">Salva</button>
    <button class="hb" id="bProj">Progetto ▾</button>
    <div class="sp"></div>
    <span class="clock" id="clock">00:00:00</span>
    <button class="hb" id="bOut" title="Apri l'uscita programma da mettere a tutto schermo su un secondo monitor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Uscita</button>
    <button class="hb rec" id="bRec" title="Registra il programma (R)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="7"/></svg><span>REC</span></button>
    <button class="hb" id="bLive" title="Diretta su YouTube / Facebook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12a7 7 0 0 1 14 0M8.5 12a3.5 3.5 0 0 1 7 0"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg><span>DIRETTA</span></button>
    <button class="hb" id="bHelp" title="Guida rapida">?</button>
  </header>

  <section class="mon">
    <div class="screen pv"><div class="lab"><i></i>Anteprima<span id="pvName"></span></div><div class="frame" id="pvFrame"><canvas id="pv" width="960" height="540"></canvas></div></div>
    <div class="trans">
      <button class="tbtn cut" id="bCut" title="Stacco netto (C)">CUT</button>
      <button class="tbtn auto" id="bAuto" title="Transizione (Spazio)">AUTO</button>
      <div class="tbar"><input type="range" id="tbar" min="0" max="1000" value="0" title="Leva di transizione"></div>
      <select id="tType" title="Tipo di transizione"><option value="fade">Dissolvenza</option><option value="wipe">Tendina</option><option value="slide">Scorrimento</option><option value="zoom">Zoom</option><option value="dip">Passa per nero</option><option value="cut">Stacco</option></select>
      <input type="number" id="tDur" min="0.1" max="5" step="0.1" value="0.6" title="Durata (secondi)">
      <small>secondi</small>
      <button class="tbtn ftb" id="bFtb" title="Dissolvenza a nero (B)">FTB</button>
    </div>
    <div class="screen pg"><div class="lab"><i></i>Programma<span id="pgName"></span></div><div class="frame"><canvas id="pg" width="1920" height="1080"></canvas></div></div>
  </section>

  <section class="low">
    <div class="box">
      <div class="hd"><b>Scene e ingressi</b>
        <button class="sb" id="bAddScene">+ Scena</button>
        <button class="sb pri" id="bAddInput">+ Ingresso</button>
      </div>
      <div class="bd" id="grid"></div>
    </div>
    <div class="box">
      <div class="hd"><div class="tabs" id="rtabs"><button data-t="prop" class="on">Proprietà</button><button data-t="gfx">Grafica</button><button data-t="show">Scaletta</button><button data-t="remote">Inviati</button></div></div>
      <div class="bd" id="rpane"></div>
    </div>
    <div class="box">
      <div class="hd"><b>Audio</b><label class="chk" style="margin:0;font-size:11.5px" title="Ascolta il programma dalle casse o dalle cuffie"><input type="checkbox" id="mon">Ascolto</label></div>
      <div class="bd" style="padding:8px"><div class="mix" id="mix"></div></div>
    </div>
  </section>
</div>

<div class="modal" id="modal"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" hidden>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ================= collegamento tra le app della suite (stessa origine: sito o programma installato) ================= */
const NWLX = {
  open() { return NWLX.p || (NWLX.p = new Promise(res => { try { const r = indexedDB.open('nwl-scambio', 1); r.onupgradeneeded = () => r.result.createObjectStore('inbox', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch { res(null); } })); },
  async tx(mode, fn) { const d = await NWLX.open(); if (!d) return null; return new Promise(res => { try { const t = d.transaction('inbox', mode), r = fn(t.objectStore('inbox')); t.oncomplete = () => res(r && r.result); t.onerror = t.onabort = () => res(null); } catch { res(null); } }); },
  chan: (() => { try { return new BroadcastChannel('nwl-suite'); } catch { return null; } })(),
};
async function nwlSend(blob, name, from) {
  await NWLX.tx('readwrite', st => st.put({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), name, from, type: blob.type || '', blob, date: Date.now() }));
  try { NWLX.chan && NWLX.chan.postMessage({ kind: 'inbox' }); } catch { }
  return true;
}
const nwlInbox = async () => (await NWLX.tx('readonly', st => st.getAll())) || [];
const nwlTake = id => NWLX.tx('readwrite', st => st.delete(id));

/* ================= NWLlive — regia televisiva di Newland Studio ================= */
'use strict';
const W = 1920, H = 1080, FPS = 30;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = p => (p || 'x') + Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dbToGain = db => db <= -60 ? 0 : Math.pow(10, db / 20);
const gainToDb = g => g <= 0.001 ? -60 : 20 * Math.log10(g);
const now = () => performance.now() / 1000;
function toast(msg, ms) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms || 2600);
}
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style') e.style.cssText = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}

/* ---------- stato del progetto ---------- */
const P = {
  name: 'Diretta',
  room: null,                 // codice stanza per gli inviati
  inputs: [],                 // ingressi
  scenes: [],                 // scene composte
  trans: { type: 'fade', dur: 0.6 },
  ovl: {
    lt: { on: false, kicker: 'In diretta', title: 'Nome e cognome', sub: 'Ruolo', auto: 0, presets: [] },
    logo: { on: true, pos: 'tr', size: 1, media: null },
    ticker: { on: false, label: "ULTIM'ORA", text: 'Scrivi qui le notizie che scorrono in basso', speed: 120 },
    clock: { on: false },
    live: { on: true, text: 'DIRETTA' },
  },
  audio: { master: 0, limiter: true },
  ice: '',                    // server TURN facoltativi (JSON)
};
/* stato della regia (non salvato) */
const R = {
  pv: null, pg: null,          // id della sorgente in anteprima / programma ("s:<id>" scena, "i:<id>" ingresso)
  tr: null,                    // transizione in corso {from,to,t0,dur,type,manual,p}

/* ================= Inviati in collegamento (WebRTC) ================= */
const RT = { peer: null, state: 'off', conns: new Map(), calls: new Map(), chat: [] };
const peerId = room => 'nwllive-' + room + '-regia';
function roomCode() { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; for (let k = 0; k < 6; k++) s += a[Math.floor(Math.random() * a.length)]; return s; }
/* server di segnalazione: quello pubblico di PeerJS, oppure uno nostro (?peer=host:porta) */
function peerOpts() {
  const ps = new URLSearchParams(location.search).get('peer');
  if (!ps) return {};
  const [host, port] = ps.split(':');
  return { host, port: +(port || 443), path: '/', secure: !/^(localhost|127\.|192\.168\.)/.test(host) };
}
function iceServers() {
  const base = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
  try { const x = P.ice ? JSON.parse(P.ice) : []; return base.concat(Array.isArray(x) ? x : [x]); } catch (_) { return base; }
}
function inviatoBase() {
  return location.protocol.startsWith('http') ? new URL('inviato.html', location.href).href : 'https://edicola.grandangoloregionale.it/suite/live/inviato.html';
}
function inviatoLink(name) { if (!P.room || !RT.peer) remoteStart(); const ps = new URLSearchParams(location.search).get('peer'); return inviatoBase() + '?r=' + P.room + (name ? '&n=' + encodeURIComponent(name) : '') + (ps ? '&peer=' + encodeURIComponent(ps) : ''); }

function remoteStart() {
  if (typeof Peer === 'undefined') { RT.state = 'nolib'; refreshRemotePane(); return; }
  if (!P.room) { P.room = roomCode(); dirty(); }
  if (RT.peer) { try { RT.peer.destroy(); } catch (_) { } }
  RT.state = 'wait';
  const peer = new Peer(peerId(P.room), Object.assign({ config: { iceServers: iceServers() }, debug: 1 }, peerOpts()));
  RT.peer = peer;
  peer.on('open', () => { RT.state = 'ok'; refreshRemotePane(); });
  peer.on('disconnected', () => { RT.state = 'wait'; refreshRemotePane(); setTimeout(() => { if (!peer.destroyed) peer.reconnect(); }, 1500); });
  peer.on('error', e => {
    console.warn('peer', e.type, e);
    if (e.type === 'unavailable-id') { RT.state = 'busy'; toast('La stanza degli inviati è già aperta in un\'altra finestra di regia'); }
    else if (e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error') { RT.state = 'net'; setTimeout(() => { if (RT.peer === peer) remoteStart(); }, 5000); }
    refreshRemotePane();
  });
  peer.on('connection', conn => {
    const name = (conn.metadata && conn.metadata.name || 'Inviato').slice(0, 40);
    conn.on('open', () => {
      const i = remoteInput(name);
      RT.conns.set(i.id, conn); conn._iid = i.id;
      sendTally(i); refreshRemotePane();
      chatAdd('Sistema', name + ' è entrato in collegamento');
    });
    conn.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (d.t === 'msg') chatAdd(name, String(d.text || '').slice(0, 500));
    });
    conn.on('close', () => { if (RT.conns.get(conn._iid) === conn) RT.conns.delete(conn._iid); refreshRemotePane(); });
  });
  peer.on('call', call => {
    const name = (call.metadata && call.metadata.name || 'Inviato').slice(0, 40);
    const i = remoteInput(name);
    const old = RT.calls.get(i.id); if (old && old !== call) { try { old.close(); } catch (_) { } }
    RT.calls.set(i.id, call);
    call.answer(minusFor(i.id).dest.stream);
    call.on('stream', st => {
      if (i._stream === st) return;
      i._stream = st; attachStream(i, st);
      // qualità: preferisce la fluidità alla risoluzione quando la rete cala
      try { call.peerConnection.getReceivers().forEach(r => { if (r.track && r.track.kind === 'video') r.playoutDelayHint = 0.15; }); } catch (_) { }
      toast('📡 ' + name + ' in collegamento'); refreshAll();
    });
    const gone = () => {
      if (RT.calls.get(i.id) !== call) return;
      RT.calls.delete(i.id); closeInput(i); i._status = 'remote'; refreshAll();
      chatAdd('Sistema', name + ' ha chiuso il collegamento');
    };
    call.on('close', gone); call.on('error', gone);
    call.peerConnection && call.peerConnection.addEventListener('connectionstatechange', () => {
      const s = call.peerConnection.connectionState; i._net = s;
      if (s === 'failed') gone();
      refreshRemotePane();
    });
  });
}
/* ingresso dell'inviato: lo stesso nome riprende sempre lo stesso ingresso (e le scene che lo usano) */
function remoteInput(name) {

const PGC = $('#pg');

function recMime() {

async function toggleRec() {
  if (R.recording) return stopRec();

  const ext = mime.includes('mp4') ? 'mp4' : 'webm';
  const fname = (P.name || 'Diretta').replace(/[^\w\- àèéìòù]/g, '') + ' ' + stamp() + '.' + ext;
  let writer = null;
  let fh = null;
  if (window.showSaveFilePicker) {
    try {
      fh = await showSaveFilePicker({ suggestedName: fname, types: [{ description: 'Video', accept: { [ext === 'mp4' ? 'video/mp4' : 'video/webm']: ['.' + ext] } }] });
      writer = await fh.createWritable();
    } catch (e) { if (e.name === 'AbortError') return; writer = null; }
  }
  const rec = new MediaRecorder(programStream(), { mimeType: mime, videoBitsPerSecond: 10e6, audioBitsPerSecond: 192e3 });
  const chunks = []; let chain = Promise.resolve();
  rec.ondataavailable = e => { if (!e.data.size) return; if (writer) chain = chain.then(() => writer.write(e.data)); else chunks.push(e.data); };
  rec.onstop = async () => {
    await chain;
    if (writer) { await writer.close(); let sent = false; try { const f = await fh.getFile(); if (f.size < 1.5e9) sent = await nwlSend(f, fname, 'NWLlive'); } catch { } toast('Registrazione salvata: ' + fname + (sent ? ' — la trovi anche in NWLcut, pronta da montare' : ''), 5000); }
    else { const b = new Blob(chunks, { type: mime }), a = h('a', { href: URL.createObjectURL(b), download: fname }); document.body.append(a); a.click(); a.remove(); let sent = false; try { if (b.size < 1.5e9) sent = await nwlSend(b, fname, 'NWLlive'); } catch { } toast('Registrazione scaricata' + (sent ? ' — la trovi anche in NWLcut' : ''), 5000); }
  };
  rec.start(1000);
  R.recording = { rec, t0: Date.now() };
  $('#bRec').classList.add('on');
}

/* ================= Camere virtuali: zoom, panoramica, dolly ================= */
/* Una camera virtuale inquadra una scena (o un ingresso) con zoom e spostamento,
   come una telecamera robotizzata: più camere virtuali sullo stesso studio = regia multicamera. */
const SHOT0 = () => ({ z: 1, x: .5, y: .5 });
const easeIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
let VDEPTH = 0;
function clampShot(s) {
  const z = clamp(s.z, 1, 6), hw = .5 / z;
  return { z, x: clamp(s.x, hw, 1 - hw), y: clamp(s.y, hw, 1 - hw) };
}
function lerpShot(a, b, p) { return { z: a.z * Math.pow(b.z / a.z, p), x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p }; }
/* inquadratura del momento (con movimento in corso o «respiro») */
function vcamShot(i) {
  let s = i.shot || SHOT0();
  const a = i._anim;
  if (a) {
    const p = clamp((now() - a.t0) / a.dur, 0, 1);
    s = lerpShot(a.from, a.to, easeIO(p));
    if (p >= 1) { i._anim = null; i.shot = clampShot(a.to); s = i.shot; if (R.sel === 'i:' + i.id && R.rtab === 'prop') refreshPane(); }
  }
  if (i.breathe) {
    const t = now() / 9;
    s = { z: s.z * (1 + .025 * Math.sin(t)), x: s.x + .006 * Math.sin(t * .7), y: s.y + .004 * Math.cos(t * .9) };
  }
  return clampShot(s);
}
function drawVcam(g, L, i, cw, ch, air) {
  const dx = L.x * cw, dy = L.y * ch, dw = L.w * cw, dh = L.h * ch;
  if (!i.src || VDEPTH > 2 || (i.src === 'i:' + i.id)) return;
  const s = vcamShot(i);
  VDEPTH++;
  g.save();
  g.beginPath(); g.rect(dx, dy, dw, dh); g.clip();
  g.translate(dx + dw / 2 - s.x * s.z * dw, dy + dh / 2 - s.y * s.z * dh);
  g.scale(s.z * dw / cw, s.z * dh / ch);
  try { drawSrc(g, i.src, cw, ch, air); } finally { g.restore(); VDEPTH--; }
}
/* avvia un movimento di macchina verso un'inquadratura */
function vcamMove(i, to, dur, from) {
  i._anim = { from: from || vcamShot(i), to: clampShot(to), t0: now(), dur: Math.max(.05, dur) };
}
/* quando una camera virtuale va in onda può partire il suo movimento (dolly) */
function vcamOnTake(srcTo) {
  for (const id of srcInputs(srcTo)) {
    const i = inp(id);
    if (i && i.type === 'vcam' && i.dolly && i.dolly.auto) vcamDolly(i);
  }
}
function vcamDolly(i) {
  const d = i.dolly || {}; const a = d.from || SHOT0(), b = d.to || i.shot || SHOT0();
  vcamMove(i, b, d.dur || 6, clampShot(a));
}
/* posizione del giornalista nella sorgente: la telecamera con green screen (o la prima telecamera) */
function presenterRect(src) {
  const layers = srcLayers(src);
  let best = null;
  for (const L of layers) {
    const x = inp(L.inp); if (!x) continue;
    if (x.type === 'camera' || x.type === 'remote') {
      const score = (x.key.on ? 2 : 1) + (x.type === 'camera' ? .5 : 0);
      if (!best || score > best.score) best = { L, score, i: x };
    }
  }
  if (!best) return null;
  const L = best.L, x = best.i, fr = frameOf(x);
  let r = { x: L.x, y: L.y, w: L.w, h: L.h };
  if (fr && L.fit === 'contain') { // area realmente occupata dall'immagine
    const sa = fr.w / fr.h, da = (L.w * W) / (L.h * H);
    if (sa > da) { const nh = L.w * W / sa / H; r = { x: L.x, y: L.y + L.h - nh, w: L.w, h: nh }; }
    else { const nw = L.h * H * sa / W; r = { x: L.x + (L.w - nw) / 2, y: L.y, w: nw, h: L.h }; }
  }
  return r;
}
const SHOT_PRESETS = [
  ['Totale', () => SHOT0()],
  ['Piano americano', r => r && { z: 1 / (r.h * .82), x: r.x + r.w / 2, y: r.y + r.h * .40 }],
  ['Mezzo busto', r => r && { z: 1 / (r.h * .56), x: r.x + r.w / 2, y: r.y + r.h * .30 }],
  ['Primo piano', r => r && { z: 1 / (r.h * .34), x: r.x + r.w / 2, y: r.y + r.h * .19 }],
];
function shotPreset(i, name) {
  const p = SHOT_PRESETS.find(x => x[0] === name); if (!p) return null;
  const s = p[1](presenterRect(i.src));
  return s ? clampShot(s) : null;
}
/* crea in un colpo le camere virtuali tipiche di uno studio */
function makeStudioCams(src) {
  const base = srcName(src);
  const made = [];
  const defs = [
    ['Totale', { dur: 8, fromZ: 1.15 }],
    ['Mezzo busto', { dur: 6, from: 'Piano americano' }],
    ['Primo piano', { dur: 5, from: 'Mezzo busto' }],
  ];
  for (const [nm, d] of defs) {
    const i = newInput('vcam', { name: base + ' · ' + nm, src, shot: SHOT0() });
    const s = shotPreset(i, nm) || SHOT0(); i.shot = s;
    const from = d.from ? (shotPreset(i, d.from) || SHOT0()) : clampShot({ z: d.fromZ, x: .5, y: .5 });
    i.dolly = { auto: false, dur: d.dur, from: nm === 'Totale' ? clampShot({ z: 1.15, x: s.x, y: s.y }) : from, to: s };
    if (nm === 'Totale') i.dolly = { auto: false, dur: 8, from: clampShot({ z: 1.12, x: .5, y: .45 }), to: SHOT0() };
    made.push(i);
  }
  refreshAll(); dirty();
  toast('Create 3 camere virtuali: Totale, Mezzo busto, Primo piano');
  return made;
}

const decodeHtml = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value.replace(/\s+/g, ' ').trim(); };
async function getText(url) {
  if (window.nwlNative && window.nwlNative.fetchText) return window.nwlNative.fetchText(url);
  const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return r.text();
}
async function feedTitles(url) {
  try {
    const xml = new DOMParser().parseFromString(await getText(url), 'text/xml');
    const items = [...xml.querySelectorAll('item > title, entry > title')].map(n => decodeHtml(n.textContent || '')).filter(Boolean);
    if (items.length) return items;
    throw new Error('feed vuoto');
  } catch (e) {
    // i siti WordPress permettono la lettura degli ultimi articoli anche dal browser
    const u = new URL(url);
    const r = await fetch(u.origin + '/wp-json/wp/v2/posts?per_page=15&_fields=title', { cache: 'no-store' });
    if (!r.ok) throw e;
    const j = await r.json();
    return j.map(p => decodeHtml(p.title && p.title.rendered || '')).filter(Boolean);
  }
}

    h('p', { class: 'hint' }, 'Va in onda tutto quello che vedi nel riquadro PROGRAMMA, con grafica e audio. Le chiavi restano solo su questo computer.'),
    list, field('Qualità', q), encInfo,
    h('div', { class: 'acts' }, h('button', { class: 'sb', onclick: closeModal }, 'Chiudi'), h('button', {
      class: 'sb pri', onclick: () => {
        if (!ST.enc || !ST.enc.ok) { toast('Prima scarica il componente per la diretta'); return; }
        const ds = cfg.dests.filter(d => d.on && d.key && /^rtmps?:\/\//.test(d.server));
        if (!ds.length) { toast('Inserisci almeno una chiave stream'); return; }
        closeModal(); startLive(ds, QUALITY[cfg.quality] || QUALITY['1080p6']);
      }
    }, '● AVVIA LA DIRETTA'))));
}
const encName = e => ({ h264_nvenc: 'scheda video NVIDIA', h264_qsv: 'scheda video Intel', h264_amf: 'scheda video AMD', libx264: 'processore' }[e] || e);
function liveStatusDialog() {
  const s = ST.status || {};
  modal(h('div', {}, h('h3', {}, '● In diretta da ' + fmtTime((Date.now() - ST.t0) / 1000)),
    h('p', { class: 'hint' }, 'Destinazioni: ' + ST.dests.map(d => d.name).join(', ')),
    h('p', { class: 'hint' }, 'Velocità di invio: ' + (s.kbps ? Math.round(s.kbps) + ' kbps' : '—') + ' · fotogrammi al secondo: ' + (s.fps || '—') + (s.speed ? ' · tempo reale ' + s.speed + '×' : '')),
    s.speed && parseFloat(s.speed) < .95 ? h('p', { class: 'hint', style: 'color:#ffc23d' }, '⚠ Il computer o la rete non tengono il passo: abbassa la qualità alla prossima diretta.') : null,
    h('div', { class: 'acts' }, h('button', { class: 'sb', onclick: closeModal }, 'Chiudi'), h('button', { class: 'sb pri', onclick: () => { if (confirm('Chiudere la diretta?')) { closeModal(); stopLive(); } } }, '■ CHIUDI LA DIRETTA'))));
}
function liveMime() {
  return ['video/webm;codecs=h264,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
}
async function startLive(dests, q) {
  resumeAudio();
  ST.dests = dests; ST.q = q; ST.stopping = false;
  const r = await NATIVE.stream.start({ urls: dests.map(destUrl), w: q.w, h: q.h, vbr: q.v, abr: 160, fps: FPS, encoder: ST.enc && ST.enc.best });
  if (!r || !r.ok) { toast('Diretta non partita: ' + ((r && r.error) || 'errore')); return; }
  const rec = new MediaRecorder(programStream(), { mimeType: liveMime(), videoBitsPerSecond: 16e6, audioBitsPerSecond: 256e3 });
  ST.chain = Promise.resolve();
  rec.ondataavailable = e => { if (!e.data.size) return; ST.chain = ST.chain.then(() => e.data.arrayBuffer()).then(b => NATIVE.stream.write(new Uint8Array(b))).catch(() => { }); };
  rec.start(250);
  ST.rec = rec; ST.live = true; if (!ST.t0 || !ST.retries) ST.t0 = Date.now();
  liveButton();
  toast('● Sei in diretta su ' + dests.map(d => d.name).join(' e '), 4000);
}
function stopLive() {
  ST.stopping = true; ST.live = false; ST.retries = 0;
  try { ST.rec && ST.rec.state !== 'inactive' && ST.rec.stop(); } catch (_) { }
  ST.rec = null;
  setTimeout(() => NATIVE && NATIVE.stream.stop(), 400);
  liveButton(); toast('Diretta chiusa');
}
if (NATIVE) NATIVE.stream.onStatus(s => {
  ST.status = s;
  if ((s.state === 'ended' || s.state === 'error') && ST.live && !ST.stopping) {
    // la connessione è caduta: riprovo da solo
    try { ST.rec && ST.rec.state !== 'inactive' && ST.rec.stop(); } catch (_) { }
    ST.rec = null; ST.live = false; ST.retries++;
    const wait = Math.min(15, 2 + ST.retries * 2);
    toast('⚠ Diretta interrotta (' + (s.msg || 'rete') + '): riprovo tra ' + wait + ' s', 5000);
    liveButton(true);
    setTimeout(() => { if (!ST.stopping) startLive(ST.dests, ST.q); }, wait * 1000);
  }
  liveButton();
});
function liveButton(retrying) {
  const b = $('#bLive'), sp = b.querySelector('span');
  b.classList.toggle('on', ST.live || !!retrying); b.classList.toggle('rec', ST.live);
  if (!ST.live && !retrying) sp.textContent = 'DIRETTA';
}
setInterval(() => {
  if (!ST.live) return;
  const s = ST.status || {}, sp = $('#bLive span');
  sp.textContent = 'LIVE ' + fmtTime((Date.now() - ST.t0) / 1000) + (s.kbps ? ' · ' + (s.kbps / 1000).toFixed(1) + ' Mb' : '');
}, 1000);
addEventListener('beforeunload', e => { if (ST.live) { e.preventDefault(); e.returnValue = ''; } });

/* ================= Avvio e ciclo di disegno ================= */
const pvC = $('#pv'), pvG = pvC.getContext('2d'), pgG = PGC.getContext('2d', { alpha: false });
R.frame = 0;
let lastT = now(), tileIdx = 0;
function frame() {
  const t = now(), dt = Math.min(.1, t - lastT); lastT = t; R.frame++;
  tickTransition(); tickAudio();
  drawProgram(pgG); drawOverlays(pgG, dt); drawCountdown(pgG); tickFTB(dt); drawFTB(pgG);
  drawSrc(pvG, R.pv, pvC.width, pvC.height, false);
  if (R.sel && R.sel === R.pv && R.sel.startsWith('s:')) {
    const s = scn(R.sel.slice(2)), L = s && s.layers.find(l => l.id === R.selLayer);
    if (L) {
      const X = L.x * pvC.width, Y = L.y * pvC.height, Wd = L.w * pvC.width, Hd = L.h * pvC.height;
      pvG.save(); pvG.strokeStyle = '#ffc23d'; pvG.setLineDash([8, 6]); pvG.lineWidth = 2; pvG.strokeRect(X, Y, Wd, Hd);
      pvG.setLineDash([]); pvG.fillStyle = '#ffc23d';
      for (const [cx, cy] of [[X, Y], [X + Wd, Y], [X, Y + Hd], [X + Wd, Y + Hd]]) pvG.fillRect(cx - 6, cy - 6, 12, 12);
      pvG.restore();
    }
  }
  // miniature: poche per volta
  const keys = [...TILES.keys()];
  if (keys.length) for (let n = 0; n < 3; n++) {
    const k = keys[tileIdx++ % keys.length], cv = TILES.get(k), g = cv.getContext('2d');
    drawSrc(g, k, cv.width, cv.height, false);
  }
  tickMeters();
  if (R.frame % 10 === 0) {
    for (const i of P.inputs) if (i._bar && i._el && i._el.duration) i._bar.style.width = (i._el.currentTime / i._el.duration * 100) + '%';
    const d = new Date(), p = n => String(n).padStart(2, '0');
    $('#clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    if (R.recording) { const s = Math.floor((Date.now() - R.recording.t0) / 1000); $('#bRec span').textContent = 'REC ' + Math.floor(s / 60) + ':' + p(s % 60); }
  }
}
/* il timer in un worker non rallenta quando la finestra è in secondo piano (registrazione e uscita continuano) */
(function startLoop() {
  // il worker manda un battito alla volta e aspetta che il fotogramma sia finito: niente code se il PC rallenta
  const run = () => { try { frame(); } catch (e) { console.error(e); } };
  try {
    const src = `let t=0,iv=${(1000 / FPS).toFixed(2)};onmessage=()=>{const d=performance.now()-t;setTimeout(()=>{t=performance.now();postMessage(0)},Math.max(1,iv-d))};postMessage(0)`;
    const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    w.onmessage = () => { run(); w.postMessage(0); };
  } catch (e) { setInterval(run, 1000 / FPS); }
})();

/* ---------- comandi ---------- */
$('#bAuto').onclick = () => doTransition();
$('#bCut').onclick = doCut;
$('#bFtb').onclick = () => toggleFTB();
$('#tType').value = P.trans.type; $('#tDur').value = P.trans.dur;
$('#tType').onchange = e => { P.trans.type = e.target.value; dirty(); };
$('#tDur').onchange = e => { P.trans.dur = clamp(+e.target.value || .6, .1, 5); dirty(); };
$('#tbar').addEventListener('input', e => {
  const v = +e.target.value / 1000;
  if (!R.tr) {
    if (v <= 0 || !R.pv || R.pv === R.pg) { e.target.value = 0; return; }
    startTake(R.pv);
    R.tr = { from: R.pg, to: R.pv, t0: now(), dur: 1, type: P.trans.type === 'cut' ? 'fade' : P.trans.type, manual: true, p: v };
  }
  if (!R.tr.manual) return;
  R.tr.p = v;
  if (v >= 1) finishTake(R.tr.from, R.tr.to);
  else if (v <= 0) { R.tr = null; }
});
$('#bAddInput').onclick = addInputDialog;
$('#bAddScene').onclick = addScene;
$('#bRec').onclick = toggleRec;
$('#bOut').onclick = openOutput;
$('#bLive').onclick = liveDialog;
$('#bProj').onclick = projectMenu;
$('#bHelp').onclick = helpDialog;
$('#bSave').onclick = () => { saveLocal(); toast('Progetto salvato'); };
$('#pname').onchange = e => { P.name = e.target.value.trim() || 'Diretta'; dirty(); };
$('#mon').onchange = e => { AU.mon.gain.setTargetAtTime(e.target.checked ? 1 : 0, AC.currentTime, .05); };
$$('#rtabs button').forEach(b => b.onclick = () => setTab(b.dataset.t));
addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveLocal(); toast('Progetto salvato'); return; }
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || $('#modal').classList.contains('on')) { if (e.key === 'Escape') closeModal(); return; }
  const k = e.key;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); doTransition(); }
  else if (k === 'c' || k === 'C') doCut();
  else if (k === 'l' || k === 'L') toggleLT();
  else if (k === 't' || k === 'T') { P.ovl.ticker.on = !P.ovl.ticker.on; refreshGfxButtons(); dirty(); }
  else if (k === 'r' || k === 'R') toggleRec();
  else if (k === 'n' || k === 'N') rdNext();
  else if (k === 'b' || k === 'B') toggleFTB();
  else if (/^[1-9]$/.test(k)) { const i = P.inputs[+k - 1]; if (i && hasVideo(i)) { setPreview('i:' + i.id); select('i:' + i.id); } }
  else if (/^F[1-9]$/.test(k)) { e.preventDefault(); const s = P.scenes[+k.slice(1) - 1]; if (s) { setPreview('s:' + s.id); select('s:' + s.id); } }
});
addEventListener('beforeunload', e => { saveLocal(); if (R.recording) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- caricamento ---------- */
function loadProject() {
  let j = null;
  try { j = JSON.parse(localStorage.getItem('nwllive-project') || 'null'); } catch (_) { }
  if (j && j.inputs) {
    Object.assign(P, { name: j.name || 'Diretta', room: j.room || null, trans: j.trans || P.trans, ice: j.ice || '', audio: j.audio || P.audio, bg: j.bg || null, fg: j.fg || null, show: j.show || P.show, rundown: j.rundown || [] });
    if (j.ovl) for (const k in P.ovl) Object.assign(P.ovl[k], j.ovl[k] || {});
    P.inputs = j.inputs.map(i => Object.assign({ key: KEY0(), crop: { l: 0, t: 0, r: 0, b: 0 }, aud: { db: 0, mute: false, afv: false } }, i));
    P.scenes = j.scenes || [];
    R.pv = j.pv || null; R.pg = j.pg || null;
    return false;
  }
  // primo avvio: studio virtuale e scene di partenza
  const bg = newInput('vset', { name: 'Studio virtuale', style: 'notte' });
  const st = newScene('Studio', [newLayer(bg.id)]);
  R.pg = 's:' + st.id; R.pv = 's:' + st.id;
  return true;
}
function welcome() {
  const act = (ic, t, sub, fn) => h('button', { class: 'choice', onclick: () => { closeModal(); fn(); } }, h('span', { class: 'ic' }, ic), h('span', {}, h('b', {}, t), h('small', {}, sub)));
  modal(h('div', {}, h('h3', {}, 'Benvenuto in NWLlive'),
    h('p', { class: 'hint' }, 'La regia è pronta con uno studio virtuale. Tre passi per la prima diretta:'),
    h('div', { class: 'choices' },
      act('🎥', '1. Telecamera dello studio', 'Con il giornalista davanti al green screen', cameraDialog),
      act('📡', '2. Link per gli inviati', 'Si collegano dal telefono', () => { setTab('remote'); linkDialog(); }),
      act('🎞️', '3. Servizi da mandare in onda', 'Carica i video', () => pickFile('video/*', true, async fs => { for (const f of fs) { const i = newInput('video', { name: f.name.replace(/\.[^.]+$/, ''), file: f.name, restart: true, ret: true }); await DB.put(i.id, f); await openInput(i); } refreshAll(); dirty(); })),
      act('⌨️', 'Come si usa', 'Anteprima, programma e scorciatoie', helpDialog)),
    h('div', { class: 'acts' }, h('button', { class: 'sb pri', onclick: closeModal }, 'Comincia'))));
}
(async function init() {
  const first = loadProject();
  $('#pname').value = P.name; $('#tType').value = P.trans.type; $('#tDur').value = P.trans.dur;
  refreshAll();
  for (const i of P.inputs) openInput(i);
  remoteStart();   // gli inviati possono collegarsi in qualsiasi momento
  if (first) { saveLocal(); welcome(); }
  if (document.fonts) document.fonts.load('700 48px "Archivo"').catch(() => { });
  window.NWL = { P, R, inp, scn, setPreview, doTransition, doCut, finishTake, toggleLT, remoteStart, RT, AU, frameOf, openInput, newInput, newScene, newLayer, refreshAll, DB };
})();
