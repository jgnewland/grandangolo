<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Collegamento in diretta — NWLlive</title>
<meta name="theme-color" content="#0a0610">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#07060c;--p1:#110e19;--p2:#1a1625;--line:rgba(255,255,255,.1);--tx:#ece9f6;--mu:#9a93b3;--red:#ff3b5c;--grn:#21d07a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top img{width:36px;height:36px;border-radius:10px}
.top b{display:block;font-weight:800;font-size:17px;letter-spacing:.02em}
.top small{display:block;color:var(--mu);font-size:12px}
.vid{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9;box-shadow:0 0 0 3px var(--line)}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
.vid video.mirror{transform:scaleX(-1)}
.tally{position:absolute;left:0;right:0;top:0;padding:8px 12px;font-weight:800;letter-spacing:.12em;font-size:13px;text-align:center;background:rgba(0,0,0,.55)}
body.air .vid{box-shadow:0 0 0 5px var(--red)} body.air .tally{background:var(--red);color:#fff}
body.pv .vid{box-shadow:0 0 0 4px var(--grn)} body.pv .tally{background:var(--grn);color:#02140a}
.f{display:grid;gap:5px;margin:12px 0}
.f label{font-size:13px;color:var(--mu);font-weight:600}
.f input,.f select{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.go{width:100%;border:0;border-radius:14px;padding:16px;font-weight:800;font-size:17px;background:var(--red);color:#fff;margin-top:6px;box-shadow:0 10px 30px rgba(255,59,92,.3)}
.go:disabled{opacity:.6}
.row{display:flex;gap:8px;margin-top:12px}
.b{flex:1;border:1px solid var(--line);background:var(--p2);border-radius:12px;padding:12px;font-weight:700;font-size:14px}
.b.on{background:var(--red);border-color:var(--red);color:#fff}
.st{display:flex;align-items:center;gap:8px;margin:12px 0 0;color:var(--mu);font-size:14px}
.st i{width:10px;height:10px;border-radius:50%;background:#666;flex:none}
.st i.ok{background:var(--grn)}.st i.wt{background:#ffc23d}.st i.ko{background:var(--red)}
.msg{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));background:#ffc23d;color:#1a1200;font-weight:800;font-size:20px;padding:16px 18px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);display:none;z-index:9}
.msg.on{display:block;animation:pop .3s}
@keyframes pop{from{transform:translateY(-20px);opacity:0}}
.card{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}
.card h4{margin:0 0 8px;font-size:13px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.log{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow:auto;margin-bottom:8px}
.log div{font-size:14px;background:var(--p2);border-radius:10px;padding:7px 10px}
.log div b{color:#40d6ff}
.send{display:flex;gap:8px}.send input{flex:1;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.send button{border:0;border-radius:10px;background:var(--p2);padding:0 14px;font-weight:700;border:1px solid var(--line)}
.hint{color:var(--mu);font-size:13px;margin:8px 0}
.meter{height:6px;background:var(--p2);border-radius:6px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#21d07a 70%,#ffc23d 85%,#ff3b5c)}
input[type=range]{width:100%;accent-color:var(--red)}
</style>
</head>
<body>
<div class="msg" id="msg"></div>
<div class="wrap">
  <div class="top"><img src="icon-192.png" alt=""><div><b>Collegamento in diretta</b><small>NWLlive · Newland Studio</small></div></div>
  <div class="vid"><video id="me" autoplay muted playsinline></video><div class="tally" id="tally">NON COLLEGATO</div></div>
  <div class="meter"><i id="lvl"></i></div>
  <div id="setup">
    <div class="f"><label>Il tuo nome (lo vede la regia)</label><input id="nm" placeholder="Es. Mario Rossi da Licata" maxlength="40"></div>
    <div class="f"><label>Telecamera</label><select id="cam"></select></div>
    <div class="f"><label>Microfono</label><select id="mic"></select></div>
    <div class="f"><label>Qualità</label><select id="q"><option value="720">Alta (720p) — consigliata</option><option value="1080">Massima (1080p) — rete molto buona</option><option value="480">Leggera (480p) — rete debole</option></select></div>
    <button class="go" id="go">Collegati alla regia</button>
    <p class="hint">Usa gli auricolari: sentirai l'audio della diretta senza rimandarlo nel microfono. Tieni il telefono in orizzontale.</p>
  </div>
  <div id="live" hidden>
    <div class="row">
      <button class="b" id="bMute">🎙️ Microfono attivo</button>
      <button class="b" id="bFlip">🔄 Cambia camera</button>
    </div>
    <div class="card"><h4>Audio della regia</h4><input type="range" id="vol" min="0" max="1" step="0.01" value="1"><p class="hint" style="margin:4px 0 0">Senti la diretta senza la tua voce.</p></div>
    <div class="card"><h4>Messaggi</h4><div class="log" id="log"></div><div class="send"><input id="txt" placeholder="Scrivi alla regia"><button id="snd">Invia</button></div></div>
    <button class="b" id="bEnd" style="width:100%;margin-top:14px">Chiudi il collegamento</button>
  </div>
  <div class="st"><i id="dot"></i><span id="stt">Pronto</span></div>
</div>
<audio id="ret" autoplay playsinline></audio>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search), ROOM = qs.get('r');
const RATE = { 480: 1.2e6, 720: 2.5e6, 1080: 4.5e6 };
let stream = null, peer = null, conn = null, call = null, wake = null, ending = false, facing = 'user', retryT = null;
$('#nm').value = qs.get('n') || localStorage.getItem('nwl-inviato') || '';
const status = (t, c) => { $('#stt').textContent = t; $('#dot').className = c || ''; };
if (!ROOM) { status('Link non valido: chiedi alla regia un nuovo link', 'ko'); $('#go').disabled = true; }

async function devices() {
  const d = await navigator.mediaDevices.enumerateDevices();
  const cam = $('#cam'), mic = $('#mic'), cv = cam.value, mv = mic.value;
  cam.innerHTML = ''; mic.innerHTML = '';
  const cams = d.filter(x => x.kind === 'videoinput');
  if (/iPhone|iPad|Android/i.test(navigator.userAgent)) { cam.append(new Option('Frontale (selfie)', 'user')); cam.append(new Option('Posteriore', 'environment')); }
  cams.forEach((x, n) => cam.append(new Option(x.label || 'Telecamera ' + (n + 1), x.deviceId)));
  d.filter(x => x.kind === 'audioinput').forEach((x, n) => mic.append(new Option(x.label || 'Microfono ' + (n + 1), x.deviceId)));
  if (cv) cam.value = cv; if (mv) mic.value = mv;
}
async function openMedia() {
  const q = +$('#q').value, cam = $('#cam').value, mic = $('#mic').value;
  const v = { width: { ideal: q * 16 / 9 }, height: { ideal: q }, frameRate: { ideal: 30, max: 30 } };
  if (cam === 'user' || cam === 'environment') v.facingMode = cam; else if (cam) v.deviceId = { exact: cam };
  facing = cam === 'environment' ? 'environment' : cam === 'user' ? 'user' : facing;
  const a = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
  if (mic) a.deviceId = { exact: mic };
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video: v, audio: a });
  $('#me').srcObject = stream;
  $('#me').classList.toggle('mirror', facing === 'user');
  meter();
}
let actx = null, an = null;
function meter() {
  try {
    actx = actx || new AudioContext();
    an = actx.createAnalyser(); an.fftSize = 512;
    actx.createMediaStreamSource(new MediaStream(stream.getAudioTracks())).connect(an);
    const b = new Float32Array(512);
    (function loop() { if (!an) return; an.getFloatTimeDomainData(b); let m = 0; for (const x of b) m = Math.max(m, Math.abs(x)); $('#lvl').style.width = Math.min(100, Math.max(0, (20 * Math.log10(m + 1e-6) + 60) / 60 * 100)) + '%'; requestAnimationFrame(loop); })();
  } catch (_) { }
}
(async () => {
  try { await openMedia(); await devices(); status('Telecamera pronta', 'ok'); }
  catch (e) { status('Consenti l\'accesso a telecamera e microfono per collegarti', 'ko'); }
})();
$('#cam').onchange = $('#mic').onchange = $('#q').onchange = () => openMedia().then(() => { if (call) replaceTracks(); }).catch(() => status('Impossibile aprire la telecamera', 'ko'));

function tune() {
  if (!call || !call.peerConnection) return;
  for (const s of call.peerConnection.getSenders()) {
    if (!s.track || s.track.kind !== 'video') continue;
    const p = s.getParameters(); if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = RATE[+$('#q').value] || 2.5e6; p.encodings[0].maxFramerate = 30;
    p.degradationPreference = 'balanced';
    s.setParameters(p).catch(() => { });
  }
}
function replaceTracks() {
  if (!call || !call.peerConnection) return;
  for (const s of call.peerConnection.getSenders()) {
    const t = s.track && stream.getTracks().find(x => x.kind === s.track.kind);
    if (t) s.replaceTrack(t);
  }
  tune(); applyMute();
}
$('#go').onclick = async () => {
  const name = $('#nm').value.trim();
  if (!name) { $('#nm').focus(); status('Scrivi il tuo nome', 'ko'); return; }
  localStorage.setItem('nwl-inviato', name);
  if (!stream) { try { await openMedia(); } catch (e) { status('Telecamera non disponibile', 'ko'); return; } }
  if (actx) actx.resume();
  ending = false; $('#go').disabled = true;
  connect(name);
};
function connect(name) {
  status('Collegamento alla regia…', 'wt');
  if (peer) { try { peer.destroy(); } catch (_) { } }
  const ps = qs.get('peer'), po = {};
  if (ps) { const [hh, pp] = ps.split(':'); Object.assign(po, { host: hh, port: +(pp || 443), path: '/', secure: !/^(localhost|127\.|192\.168\.)/.test(hh) }); }
  peer = new Peer(Object.assign({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] } }, po));
  peer.on('open', () => {
    const rid = 'nwllive-' + ROOM + '-regia';
    conn = peer.connect(rid, { metadata: { name }, reliable: true });
    conn.on('open', () => {
      call = peer.call(rid, stream, { metadata: { name } });
      call.on('stream', s => { const a = $('#ret'); a.srcObject = s; a.volume = +$('#vol').value; a.play().catch(() => { }); });
      call.on('close', dropped); call.on('error', dropped);
      call.peerConnection.addEventListener('connectionstatechange', () => {
        const st = call && call.peerConnection.connectionState;
        if (st === 'connected') { status('Collegato con la regia', 'ok'); tune(); }
        if (st === 'failed' || st === 'disconnected') status('Rete instabile…', 'wt');
        if (st === 'failed') dropped();
      });
      $('#setup').hidden = true; $('#live').hidden = false; setTally('off');
      lockScreen();
    });
    conn.on('data', d => {
      if (!d) return;
      if (d.t === 'tally') setTally(d.s);
      if (d.t === 'msg') { addLog('Regia', d.text); flash(d.text); }
    });
    conn.on('close', dropped);
  });
  peer.on('error', e => {
    if (e.type === 'peer-unavailable') status('La regia non è aperta: riprovo tra poco…', 'wt');
    else status('Problema di rete: riprovo…', 'wt');
    dropped();
  });
}
function dropped() {
  if (ending) return;
  setTally('none'); call = null;
  clearTimeout(retryT);
  retryT = setTimeout(() => { if (!ending) connect($('#nm').value.trim()); }, 4000);
}
function setTally(s) {
  document.body.classList.toggle('air', s === 'air'); document.body.classList.toggle('pv', s === 'pv');
  $('#tally').textContent = s === 'air' ? '● SEI IN ONDA' : s === 'pv' ? 'IN ANTEPRIMA — PREPARATI' : s === 'off' ? 'COLLEGATO · IN ATTESA' : 'NON COLLEGATO';
  if (s === 'air' && navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function addLog(who, t) { const d = document.createElement('div'); d.innerHTML = '<b></b>'; d.firstChild.textContent = who + ': '; d.append(t); $('#log').append(d); $('#log').scrollTop = 1e9; }
function flash(t) { const m = $('#msg'); m.textContent = t; m.classList.add('on'); if (navigator.vibrate) navigator.vibrate(300); clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove('on'), 6000); }
$('#msg').onclick = () => $('#msg').classList.remove('on');
const sendMsg = () => { const t = $('#txt').value.trim(); if (!t || !conn || !conn.open) return; conn.send({ t: 'msg', text: t }); addLog('Tu', t); $('#txt').value = ''; };
$('#snd').onclick = sendMsg; $('#txt').onkeydown = e => { if (e.key === 'Enter') sendMsg(); };
$('#vol').oninput = e => { $('#ret').volume = +e.target.value; };
let muted = false;
function applyMute() { stream && stream.getAudioTracks().forEach(t => t.enabled = !muted); $('#bMute').classList.toggle('on', muted); $('#bMute').textContent = muted ? '🔇 Microfono spento' : '🎙️ Microfono attivo'; }
$('#bMute').onclick = () => { muted = !muted; applyMute(); };
$('#bFlip').onclick = async () => {
  const sel = $('#cam'); const opts = [...sel.options].map(o => o.value);
  sel.value = opts[(opts.indexOf(sel.value) + 1) % opts.length];
  try { await openMedia(); replaceTracks(); } catch (e) { status('Impossibile cambiare camera', 'ko'); }
};
$('#bEnd').onclick = () => {
  ending = true; clearTimeout(retryT);
  try { call && call.close(); conn && conn.close(); peer && peer.destroy(); } catch (_) { }
  setTally('none');
  $('#setup').hidden = false; $('#live').hidden = true; $('#go').disabled = false;
  status('Collegamento chiuso', ''); if (wake) { wake.release().catch(() => { }); wake = null; }
};
async function lockScreen() { try { wake = await navigator.wakeLock.request('screen'); } catch (_) { } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && call && !wake) lockScreen(); });
</script>
</body>
</html>
