<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandangolo · Gestionale di redazione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#009048;--green-deep:#00602f;--lime:#c3d600;--lime-soft:#a8c700;
    --bg:#04140c;--card:#0e2418;--line:rgba(255,255,255,.10);
    --txt:#eef6f0;--txt-dim:#9dbfa9;--panel-dark:#052e17;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh;
    background:
      radial-gradient(1200px 680px at 84% -14%,rgba(0,144,72,.34),transparent 58%),
      radial-gradient(1000px 620px at -14% 118%,rgba(195,214,0,.14),transparent 55%),
      radial-gradient(700px 500px at 50% 120%,rgba(0,110,60,.20),transparent 60%),
      var(--bg);
    background-attachment:fixed;}

  .page{max-width:1080px;margin:0 auto;padding:40px 22px 72px}

  /* ===== Hero ===== */
  .hero{display:flex;align-items:center;gap:20px;padding:22px 24px;border:1px solid var(--line);border-radius:22px;
    background:linear-gradient(150deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
    box-shadow:0 30px 70px -40px rgba(0,0,0,.8);backdrop-filter:blur(6px);position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 200px at 90% -40%,rgba(195,214,0,.16),transparent 60%);pointer-events:none}
  .hero img{height:52px;display:block;position:relative}
  .hero .ht{position:relative}
  .hero .ht b{font-family:'Oswald';font-weight:700;letter-spacing:.4px;font-size:26px;line-height:1;display:block}
  .hero .ht .u{display:inline-block;height:4px;width:52px;background:var(--lime);border-radius:3px;margin:9px 0 7px}
  .hero .ht span{display:block;font-size:13px;color:var(--txt-dim);letter-spacing:.2px}
  .hero .clock{margin-left:auto;text-align:right;position:relative}
  .hero .clock .t{font-family:'Oswald';font-weight:700;font-size:30px;letter-spacing:1.5px;line-height:1}
  .hero .clock .d{font-size:11.5px;color:var(--lime-soft);text-transform:uppercase;letter-spacing:1.6px;margin-top:6px}

  /* ===== Sezioni ===== */
  .section{margin:38px 0 0}
  .section h2{font-family:'Oswald';font-weight:600;text-transform:uppercase;letter-spacing:2px;font-size:13px;
    color:var(--lime-soft);margin:0 0 2px;display:flex;align-items:center;gap:12px}
  .section h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px;margin-top:20px}

  /* ===== Piastrelle ===== */
  .app{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:13px;
    text-decoration:none;color:var(--txt);padding:22px 14px 18px;border:1px solid var(--line);border-radius:20px;
    background:linear-gradient(165deg,rgba(255,255,255,.055),rgba(255,255,255,.012));
    transition:transform .18s cubic-bezier(.2,.7,.3,1),border-color .18s,box-shadow .18s,background .18s;
    opacity:0;transform:translateY(14px);animation:rise .5s ease forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .app:hover{transform:translateY(-6px);border-color:rgba(195,214,0,.5);
    background:linear-gradient(165deg,rgba(195,214,0,.08),rgba(255,255,255,.02));
    box-shadow:0 26px 50px -26px rgba(0,0,0,.85),0 0 0 1px rgba(195,214,0,.12)}
  .app:focus-visible{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(195,214,0,.3)}
  .app:active{transform:translateY(-2px)}

  .icon{width:70px;height:70px;border-radius:23px;display:flex;align-items:center;justify-content:center;position:relative;
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 14px rgba(0,0,0,.25),0 12px 26px -12px rgba(0,0,0,.75);
    transition:transform .18s}
  .app:hover .icon{transform:scale(1.06) rotate(-1.5deg)}
  .icon svg{width:34px;height:34px}
  .icon .mono{font-family:'Oswald';font-weight:700;font-size:30px;color:#fff;letter-spacing:.5px}
  .app .name{font-family:'Oswald';font-weight:600;font-size:15.5px;letter-spacing:.3px;line-height:1.1}
  .app .sub{font-size:11.5px;color:var(--txt-dim);line-height:1.3;margin-top:-4px}
  .app .ext{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;
    background:rgba(4,20,12,.6);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;opacity:.7}
  .app:hover .ext{opacity:1;border-color:rgba(195,214,0,.5)}
  .app .ext svg{width:11px;height:11px;stroke:var(--lime-soft)}

  /* gradienti icone */
  .g1{background:linear-gradient(150deg,#00c063,#046a34)}
  .g2{background:linear-gradient(150deg,#19b356,#0a5e2f)}
  .g3{background:linear-gradient(150deg,#0aa17a,#044b39)}
  .g4{background:linear-gradient(150deg,#39b45f,#0a7d3e)}
  .g5{background:linear-gradient(150deg,#0eae82,#075747)}
  .g6{background:linear-gradient(150deg,#14b9a6,#0a5e50)}
  .g7{background:linear-gradient(150deg,#23a862,#0b5b34)}
  .g8{background:linear-gradient(150deg,#0b9c78,#06463a)}

  footer{margin-top:46px;padding-top:22px;border-top:1px solid var(--line);font-size:12px;color:var(--txt-dim);
    display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
  footer .tag{font-family:'Oswald';font-weight:600;letter-spacing:1.4px;text-transform:uppercase;font-size:11px;
    color:var(--panel-dark);background:var(--lime);padding:5px 12px;border-radius:999px}
  footer a{color:var(--lime-soft);text-decoration:none;cursor:pointer}

  @media (max-width:560px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
    .hero{flex-wrap:wrap;gap:14px;padding:18px}
    .hero .clock{margin-left:0;text-align:left;width:100%;display:flex;align-items:baseline;gap:12px}
    .hero .clock .d{margin-top:0}
    .hero .ht b{font-size:22px}
  }

  /* ===== Accesso ===== */
  body.locked{overflow:hidden}
  body.locked .page{display:none}
  #lock{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:22px;
    background:radial-gradient(1000px 620px at 82% -14%,rgba(0,144,72,.34),transparent 58%),
               radial-gradient(900px 560px at -14% 118%,rgba(195,214,0,.14),transparent 55%),var(--bg)}
  body.locked #lock{display:flex}
  .lockcard{width:min(390px,100%);border:1px solid var(--line);border-radius:22px;padding:34px 28px;text-align:center;
    background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.015));box-shadow:0 40px 90px -34px rgba(0,0,0,.85)}
  .lockcard img{height:48px;margin-bottom:18px}
  .lockcard h1{font-family:'Oswald';font-weight:700;font-size:22px;margin:0 0 4px;letter-spacing:.4px}
  .lockcard p{font-size:12.5px;color:var(--txt-dim);margin:0 0 22px}
  .lockcard input{width:100%;background:rgba(4,20,12,.5);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:13px 14px;font:inherit;font-size:14px;margin-bottom:11px}
  .lockcard input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(0,144,72,.25)}
  .lockcard button{width:100%;border:0;cursor:pointer;font-family:'Oswald';font-weight:600;letter-spacing:.8px;
    text-transform:uppercase;font-size:14px;padding:14px;border-radius:12px;color:#04240f;
    background:linear-gradient(90deg,var(--lime),#d9e63a);margin-top:4px}
  .lockcard button:active{transform:translateY(1px)}
  .lockcard .err{color:#ff9a9a;font-size:12.5px;min-height:16px;margin-top:10px}
  .lockcard .hint2{font-size:11px;color:var(--txt-dim);margin-top:16px;line-height:1.6;text-align:left}
  .lockcard code{display:inline-block;background:rgba(4,20,12,.6);padding:7px 9px;border-radius:7px;font-size:11px;word-break:break-all;color:var(--lime-soft)}
</style>
</head>

      <input id="lockPass" type="password" placeholder="Password" autocomplete="current-password">
      <button id="lockBtn">Entra</button>
      <div class="err" id="lockErr"></div>
      <div class="hint2" id="lockSetup" style="display:none"></div>
    </div>
  </div>

// ====== Accesso (SHA-256 integrato: funziona ovunque) ======
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var mp=Math.pow,mw=mp(2,32),res='';
  var words=[],bl=ascii.length*8;
  var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,isC={};
  for(var c=2;pc<64;c++){if(!isC[c]){for(var i=0;i<313;i+=c){isC[i]=c;}hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0;}}
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
  for(var i=0;i<ascii.length;i++){var j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8;}
  words[words.length]=((bl/mw)|0);words[words.length]=(bl);
  for(var j=0;j<words.length;){
    var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
    for(var i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=i<16?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;
    }
    for(var i=0;i<8;i++){hash[i]=(hash[i]+oh[i])|0;}
  }
  for(var i=0;i<8;i++){for(var j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16);}}
  return res;
}

  setTimeout(()=>{try{$('lockPass').focus();}catch(e){}},60);
})();
