<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio del romanzo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECEEEA;
    --panel:#E4E7E2;
    --card:#F5F6F3;
    --ink:#1B2830;
    --ink-soft:#4A5860;
    --ink-faint:#7E8A90;
    --line:#CDD2CC;
    --line-soft:#DBDFD9;
    --night:#284B6D;
    --night-hover:#1F3B57;
    --brass:#9C7B3F;
    --sea:#5B8266;
    --grey:#8A9299;
    --danger:#9A4A3C;
    --serif:'Spectral',Georgia,serif;
    --sans:'Public Sans',system-ui,-apple-system,sans-serif;
    --shadow:0 1px 2px rgba(27,40,48,.06),0 8px 24px rgba(27,40,48,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;color:inherit}
  ::selection{background:rgba(40,75,109,.16)}

  /* ---------- masthead ---------- */
  .masthead{
    text-align:center;
    padding:44px 24px 30px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .masthead .kicker{
    font-size:12.5px;letter-spacing:.02em;color:var(--ink-faint);
    margin-bottom:14px;
  }
  .booktitle{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(30px,5vw,52px);line-height:1.02;
    letter-spacing:-.01em;margin:0 auto;max-width:16ch;
    border:none;background:transparent;text-align:center;color:var(--ink);
    display:block;width:100%;
  }
  .booktitle:focus{outline:none}
  .booktitle::placeholder{color:var(--ink-faint);font-style:italic;font-weight:400}
  .byline{
    font-family:var(--serif);font-style:italic;font-size:17px;
    color:var(--ink-soft);margin-top:10px;
  }
  .byline input{
    border:none;background:transparent;font:inherit;color:inherit;text-align:center;
    width:9ch;
  }
  .byline input:focus{outline:none;border-bottom:1px solid var(--line)}
  .rule{width:56px;height:1px;background:var(--ink);opacity:.5;margin:20px auto 16px}
  .progress-line{color:var(--ink-soft);font-size:14px;max-width:60ch;margin:0 auto}
  .mast-actions{
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px;
  }
  .savechip{
    position:absolute;top:16px;right:18px;font-size:12.5px;color:var(--ink-faint);
    display:flex;align-items:center;gap:6px;
  }
  .savechip .dot{width:7px;height:7px;border-radius:50%;background:var(--sea)}
  .savechip.saving .dot{background:var(--brass)}
  .savechip.error .dot{background:var(--danger)}

  /* ---------- buttons ---------- */
  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:8px 14px;border-radius:7px;font-size:13.5px;font-weight:500;
    transition:background .15s,border-color .15s,transform .05s;
  }
  .btn:hover{background:#fff;border-color:#bcc2bb}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--night);color:#F3F6FA;border-color:var(--night)}
  .btn.primary:hover{background:var(--night-hover);border-color:var(--night-hover)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
  .btn.ghost:hover{background:var(--panel);color:var(--ink)}
  .btn.danger{color:var(--danger);border-color:transparent;background:transparent}
  .btn.danger:hover{background:rgba(154,74,60,.08)}
  .btn.sm{padding:5px 10px;font-size:12.5px}

  /* ---------- layout ---------- */
  .tabs{
    display:flex;gap:2px;justify-content:center;border-bottom:1px solid var(--line);
    background:var(--paper);position:sticky;top:0;z-index:5;
  }
  .tab{
    border:none;background:transparent;padding:13px 20px;font-size:14px;font-weight:500;
    color:var(--ink-faint);border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink);border-bottom-color:var(--night)}

  .workspace{
    display:grid;grid-template-columns:340px 1fr;gap:0;
    max-width:1240px;margin:0 auto;min-height:60vh;
  }
  .sidebar{border-right:1px solid var(--line);padding:18px 14px 40px}
  .side-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 12px}
  .side-head h2{font-family:var(--serif);font-weight:600;font-size:18px;margin:0}
  .search{
    width:100%;border:1px solid var(--line);border-radius:7px;background:var(--card);
    padding:8px 11px;font-size:13.5px;margin-bottom:10px;
  }
  .search:focus{outline:none;border-color:var(--night)}
  .filterow{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px 12px}
  .chip-filter{
    font-size:12px;color:var(--ink-soft);border:1px solid var(--line-soft);
    background:transparent;padding:3px 9px;border-radius:20px;
  }
  .chip-filter.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .chapter-row{
    display:grid;grid-template-columns:26px 1fr auto;align-items:baseline;gap:10px;
    width:100%;text-align:left;border:none;background:transparent;
    padding:9px 8px;border-radius:8px;border:1px solid transparent;
  }
  .chapter-row:hover{background:var(--card)}
  .chapter-row.active{background:var(--card);border-color:var(--line)}
  .chapter-row .num{font-family:var(--serif);color:var(--ink-faint);font-size:13px;text-align:right}
  .chapter-row .ct{min-width:0}
  .chapter-row .cti{
    font-family:var(--serif);font-size:15.5px;color:var(--ink);line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chapter-row .meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;display:flex;align-items:center;gap:7px}
  .sdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
  .st-scrivere{background:var(--grey)}
  .st-bozza{background:var(--brass)}
  .st-rivisto{background:var(--sea)}
  .st-definitivo{background:var(--night)}
  .chapter-row .wc{font-size:11.5px;color:var(--ink-faint);white-space:nowrap}

  /* ---------- detail ---------- */
  .detail{padding:26px 34px 60px;max-width:820px}
  .detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px}
  .titlefield{
    font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.1;color:var(--ink);
    border:none;background:transparent;width:100%;padding:2px 0;letter-spacing:-.01em;
  }
  .titlefield:focus{outline:none}
  .detail-actions{display:flex;gap:6px;flex:none}
  .fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;margin:18px 0 4px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1 / -1}
  label.lab{font-size:12.5px;color:var(--ink-soft);font-weight:600}
  .field input[type=text], .field textarea, .field select{
    border:1px solid var(--line);border-radius:8px;background:var(--card);
    padding:9px 11px;font-size:14px;width:100%;resize:vertical;
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--night);background:#fff}
  .field textarea.sinossi{min-height:92px;font-family:var(--serif);font-size:15px;line-height:1.55}
  .status-select{max-width:180px}

  .tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    border:1px solid var(--line);border-radius:8px;background:var(--card);padding:7px 8px;min-height:40px}
  .tagbox:focus-within{border-color:var(--night);background:#fff}
  .tag{display:inline-flex;align-items:center;gap:6px;background:var(--panel);
    border:1px solid var(--line-soft);border-radius:20px;padding:3px 6px 3px 11px;font-size:13px}
  .tag button{border:none;background:transparent;color:var(--ink-faint);font-size:15px;line-height:1;padding:0 2px}
  .tag button:hover{color:var(--danger)}
  .tagbox input{border:none;background:transparent;flex:1;min-width:120px;padding:4px;font-size:14px}
  .tagbox input:focus{outline:none}

  .testo-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 8px;border-top:1px solid var(--line);padding-top:22px}
  .testo-head h3{font-family:var(--serif);font-weight:600;font-size:19px;margin:0}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{border:none;background:var(--card);padding:5px 12px;font-size:12.5px;color:var(--ink-soft)}
  .seg button.on{background:var(--ink);color:var(--paper)}
  textarea.manuscript{
    width:100%;min-height:420px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    padding:20px 22px;font-family:var(--serif);font-size:16px;line-height:1.7;resize:vertical;
  }
  textarea.manuscript:focus{outline:none;border-color:var(--night);background:#FbFbF9}
  .reading{
    border:1px solid var(--line);border-radius:10px;background:#F7F8F5;padding:26px 30px;
    font-family:var(--serif);font-size:17px;line-height:1.78;color:#20303a;
  }
  .reading p{margin:0 0 1.05em;max-width:66ch}
  .reading p:last-child{margin-bottom:0}
  .reading .thought{font-style:italic;color:#33454f}
  .emptyreading{color:var(--ink-faint);font-style:italic}

  /* ---------- personaggi ---------- */
  .cast{max-width:900px;margin:0 auto;padding:26px 24px 60px}
  .cast-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cast-head h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0}
  .person{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:16px 18px;margin-bottom:12px}
  .person-top{display:flex;gap:12px;align-items:baseline;justify-content:space-between}
  .person input.pname{font-family:var(--serif);font-weight:600;font-size:19px;border:none;background:transparent;width:auto;min-width:8ch}
  .person input.pname:focus{outline:none;border-bottom:1px solid var(--line)}
  .person input.prole{border:1px solid transparent;background:transparent;font-size:14px;color:var(--ink-soft);width:100%;margin-top:6px;padding:4px 0}
  .person input.prole:focus{outline:none;border-bottom:1px solid var(--line);color:var(--ink)}
  .appears{margin-top:10px;font-size:13px;color:var(--ink-soft)}
  .appears .apptag{display:inline-block;background:var(--panel);border-radius:6px;padding:2px 8px;margin:3px 5px 0 0;font-size:12.5px}
  .appears .none{font-style:italic;color:var(--ink-faint)}
  .loose{background:transparent;border:1px dashed var(--line);border-radius:11px;padding:14px 18px;margin-top:6px}
  .loose h4{margin:0 0 8px;font-size:13px;color:var(--ink-soft);font-weight:600}

  .hint{color:var(--ink-faint);font-size:13px;font-style:italic}
  .placeholder-detail{padding:80px 34px;text-align:center;color:var(--ink-faint);font-family:var(--serif);font-style:italic;font-size:18px}

  @media (max-width:820px){
    .workspace{grid-template-columns:1fr}
    .sidebar{border-right:none;border-bottom:1px solid var(--line)}
    .fieldgrid{grid-template-columns:1fr}
    .detail{padding:22px 18px 60px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* ---------- print ---------- */
  #print-root{display:none}
  @media print{
    body{background:#fff}
    body>*:not(#print-root){display:none!important}
    #print-root{display:block}
    .pr-titlepage{height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;page-break-after:always}
    .pr-titlepage h1{font-family:var(--serif);font-weight:600;font-size:34pt;margin:0 0 .3em;max-width:20ch}
    .pr-titlepage .pr-sub{font-family:var(--serif);font-style:italic;font-size:15pt;color:#333}
    .pr-chapter{page-break-before:always}
    .pr-chapter h2{font-family:var(--serif);font-weight:600;font-size:20pt;margin:0 0 4pt}
    .pr-scheda{border:1px solid #ccc;border-radius:6px;padding:10pt 12pt;margin:10pt 0 16pt;font-family:var(--sans);font-size:9.5pt;color:#222;background:#f7f7f5}
    .pr-scheda .r{margin:2pt 0}
    .pr-scheda b{color:#000}
    .pr-body{font-family:var(--serif);font-size:12pt;line-height:1.6;color:#111}
    .pr-body p{margin:0 0 .8em;text-indent:1.4em}
    .pr-body p.first{text-indent:0}
    @page{margin:2.2cm 2.4cm}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="savechip" id="savechip"><span class="dot"></span><span id="savetext">Tutto salvato</span></div>
  <div class="kicker">Studio del romanzo</div>
  <input class="booktitle" id="booktitle" placeholder="Titolo del romanzo" aria-label="Titolo del romanzo">
  <div class="byline">romanzo di <input id="autore" aria-label="Autore" value="Gabriele"></div>
  <div class="rule"></div>
  <p class="progress-line" id="progress">.</p>
  <div class="mast-actions">
    <button class="btn primary" id="exportAll">Esporta PDF</button>
    <button class="btn" id="exportJson">Scarica backup</button>
    <button class="btn ghost" id="importBtn">Ripristina backup</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-view="capitoli" id="tab-cap">Capitoli</button>
  <button class="tab" data-view="personaggi" id="tab-per">Personaggi</button>
</nav>

<main id="main"></main>

<div id="print-root"></div>

<script>
"use strict";

/* ============ seed texts (capitoli chiusi) ============ */
const T_PROLOGO = `Cinque anni prima

Pioveva da giorni. Una pioggia fine, di quelle che sembrano poca cosa e invece trovano il modo di entrare dappertutto, tra i capelli, sotto il colletto, dentro i pensieri. A lui, in quei giorni, faceva quasi compagnia. Gli pareva giusto che qualcosa di più grande si fosse messo a soffrire insieme a lui, e che intanto quella stessa acqua, cadendo, desse finalmente da bere alla terra che per mesi aveva avuto sete.

L'estate era finita da un pezzo. La mattina la luce arrivava spenta, un chiarore senza colore che il buio si riprendeva quasi subito.

John non usciva dalla sua stanza da giorni. Aveva mangiato poco, dormito peggio, letto molto, come si legge quando si cercano risposte dentro libri che non ne hanno. La stanza, che all'inizio era stata un rifugio, adesso lo stringeva alla gola.

Sulla scrivania c'era tutto quello che era stato. Vecchie fotografie. Foglietti con sopra due parole buttate giù di corsa, frasi rubate ai tovaglioli di un bar, i versi di una canzone che a un certo punto aveva smesso di ascoltare. La tazza blu, sempre nello stesso posto, sul lato sinistro. Da giorni non aveva toccato niente, e quel niente adesso somigliava a un piccolo museo dedicato a un ragazzo che non era più sicuro di essere.

Nello schermo spento del computer c'era la sua ombra. La guardò a lungo. Un profilo storto nel vetro nero, gli occhi due macchie più scure delle altre. Aveva cercato risposte finché la voglia stessa di cercarle non si era spenta, e con lei anche le domande. Restava solo quello. Un uomo seduto che si guardava spegnere dentro uno schermo.

Si sorprese a chiedere scusa. Non a qualcuno, ai suoi occhi. Alle occhiaie, alle notti passate a bere quando ormai sapeva a sue spese che certi vuoti non li riempi con lo stomaco, e certi mostri non li anneghi nell'alcol. Scusa, John. Per le scelte sbagliate. Per i sogni rinnegati uno alla volta, in silenzio, sperando che non se ne accorgesse nessuno. Per la vigliaccheria di chi alla vita non chiede più niente e aspetta soltanto che finisca.

Si passò una mano sul viso. La pelle era ruvida sotto le dita, la barba di troppi giorni. Si scoprì invecchiato in fretta, tutto insieme, come certe case che chiudi per una stagione e riapri già vecchie.

Si alzò. Andò alla scrivania con passi contati, bevve un sorso dalla tazza, e il tè dimenticato gli lasciò in bocca un gusto freddo e amaro. Per un attimo perse l'equilibrio e si lasciò cadere sulla sedia lì accanto. Prese la felpa che ci aveva buttato sopra e ci si infilò dentro, sprofondandoci, come se da quella stoffa potesse arrivargli un po' del calore che non trovava da nessun'altra parte.

Chiuse gli occhi. La testa gli girò piano. Li riaprì, sbatté le palpebre, tenne lo sguardo fisso alla finestra. Era il suo modo di pensare da sempre, sedersi e guardare fuori, lasciare che il corpo restasse dov'era mentre tutto il resto se ne andava altrove.

Poi si alzò di nuovo, a fatica, e aprì la finestra.

Il vento entrò tutto insieme e mise la stanza in disordine. Qualche foglio scivolò dalla scrivania sul pavimento. Rimasero al loro posto solo due cose. Un biglietto aereo, che lo fissava. E un post-it giallo con una data scritta a penna, che tremava appena nella corrente, come se avesse fretta di arrivare.

Si avvicinò allo specchio e si fermò. Il vetro era crepato da anni, chissà da quando, e gli restituì una faccia spezzata in due. Gli occhi gonfi, arrossati. Il corpo tremava, e non era freddo. Era una cosa che partiva da dentro, gelida come si immagina la morte quando si è ancora troppo giovani per averla vista da vicino.

Fece una doccia veloce. Si mise una felpa nera e tirò il cappuccio fino a coprirsi gli occhi. Quelle strade le conosceva a memoria, per attraversarle non aveva bisogno di vederci. Nella tasca destra le sigarette. Nella sinistra il biglietto, e basta.

Uscì.

Fuori la pioggia batteva, ed era l'unica musica rimasta. Camminò a testa bassa, con gli occhi appesi alle punte delle scarpe, perché la tristezza vera si prova così, in mezzo alla gente e senza guardarla in faccia. La strada era deserta. La città gli passava intorno chiara e finta, un posto costruito apposta per una felicità che dura poco.

Riconosceva ogni cosa. Gli angoli, gli odori, il modo in cui la luce dei lampioni si allargava sull'asfalto bagnato. E intanto sentiva di non appartenere più a niente di tutto questo. I ricordi tornavano a uno a uno, ruvidi come la lingua di un gatto. Gli tornò la voglia di terra sotto i piedi nudi, di spazi larghi, di silenzio. Del suo mare, che si portava addosso come un odore e che adesso gli mancava come se l'avesse già perso, smarrito in una stagione che cambiava senza chiedere permesso.

Aveva fatto una promessa a sé stesso, e la mantenne. Non si voltò indietro. Guardare avanti, questo. Pensare al mare, portarselo sulla pelle, ma andare a cercare altrove il proprio posto. Altrove il porto.

Era stanco di aspettare che fosse la vita a sbattergli contro per strada. Quella volta se la sarebbe andata a prendere lui.

A un certo punto smise di piovere. Anche il cielo, ogni tanto, ha bisogno di riposare.`;

const T_PRIMA_ANCORA = `Siobhán sapeva riconoscere il momento in cui il corpo smette di obbedire.

Lo aveva imparato molti anni prima, in un bagno d'ospedale che sapeva di disinfettante e di piastrelle fredde, il giorno in cui le avevano detto, con quella gentilezza da camice che fa più male della durezza, che il bambino non c'era più. Anche allora il corpo aveva deciso da solo, senza chiederle niente. Si era seduta per terra, sul pavimento bianco, la schiena contro la parete e le ginocchia strette al petto, e da lì non si era più mossa. Non perché non volesse. Perché non poteva. Era rimasta così, a contare le fughe tra una mattonella e l'altra, finché qualcuno non era venuto a sollevarla di peso, parlandole con una voce che arrivava da lontano, ovattata, come si sente il mondo quando si sta sott'acqua. Da quel giorno lo conosceva bene, quel passaggio. Il corpo che smette di essere tuo, prende in mano la faccenda e ti lascia indietro, spettatrice della tua stessa fine.

Adesso era di nuovo così. Solo, più silenzioso.

La nausea era tornata nel pomeriggio, come nei giorni prima, come ormai quasi ogni giorno. All'inizio aveva dato la colpa allo stress, poi alla data. Fiona le aveva spiegato che il corpo ha una sua memoria, più lunga e più testarda di quella della testa, e che certi anniversari continuiamo a portarli nel sangue anche quando abbiamo smesso di segnarli sul calendario. E lei le aveva creduto. A Fiona credeva sempre. C'era in quella donna una calma da infermiera, un modo di posare le parole che le faceva sembrare già una cura.

Si era seduta in poltrona con la tazza stretta tra le mani, per scaldarsele, perché da settimane aveva freddo alle dita anche dentro casa, col riscaldamento acceso. L'infuso sapeva un po' più amaro del solito, con un fondo che le restava sulla lingua, ma non ci aveva badato. Fiona glielo aveva lasciato sul tavolo quella mattina, prima di uscire, con quel gesto di chi non chiede permesso per volerti bene. Per i nervi, aveva detto. Stasera hai bisogno di stare tranquilla.

Stasera.

La parola le tornava addosso ogni volta con un piccolo tuffo allo stomaco. Declan sarebbe venuto a cena. Solo una cena, si erano ripetuti tutti e due, ognuno per conto proprio, come ci si ripete le cose in cui si spera troppo per dirle ad alta voce. Solo rivedersi. Solo mettersi uno di fronte all'altra e capire se, dopo tutto quel silenzio, era rimasto qualcosa da dirsi, o soltanto il ricordo di quando le parole venivano da sole.

Aveva apparecchiato con una cura che non metteva da anni. La tovaglia bianca, quella buona, tirata fuori dal cassetto di sotto e passata con le mani perché il ferro le faceva le grinze. Due piatti. Il pane in mezzo. Qualcosa che sobbolliva piano sul fuoco e riempiva la casa di un odore buono, di sere normali, di una vita che avrebbe potuto essere e che per un attimo, quella sera, si era concessa di immaginare di nuovo. Voleva che sulla tavola ci fosse qualcosa di suo. Qualcosa che dicesse, senza bisogno di dirlo: sono ancora qui. Sono ancora quella che conoscevi.

Le vertigini erano cominciate verso le sette.

Si era alzata per aprire la finestra, e il soffitto aveva oscillato piano, come il ponte di una barca quando l'onda passa sotto. Si era appoggiata al muro con il palmo aperto. Aveva respirato, contando, come le avevano insegnato in un'altra stagione della sua vita. Era passata. Si era detta che era la fame, o la stanchezza, o quella data che le pesava sul petto da giorni.

Poi era tornata, e non se n'era più andata.

Si era seduta di nuovo, più lentamente questa volta, tenendosi al bracciolo. Aveva pensato di prendere il telefono e chiamare Fiona. Poi aveva deciso di no. Non quella sera. Quella sera voleva restare sola con quello che stava per succedere, con quella cosa piccola e fragile che aveva ricominciato a crescerle dentro da quando Declan aveva risposto al messaggio. Una parola sola, aveva risposto. Vengo. E a lei era bastata quella per rimettersi a sperare, che è la cosa più pericolosa che sappiamo fare.

Non era amore. O forse lo era ancora, ma non era quello il punto. Il punto era che quando gli aveva scritto aveva sentito qualcosa spostarsi nel petto, un peso che cambiava posizione dopo anni fermo nello stesso angolo. Come quando apri la finestra di una stanza chiusa da troppo tempo e la prima aria che entra ti fa quasi male in gola. Ma è aria. Dopo mesi che respiravi la tua, è aria.

Fuori pioveva. La sentiva battere sui vetri, fitta e regolare, e le teneva compagnia senza chiederle niente, l'unica presenza in tutta la casa che non le volesse qualcosa.

Poi le mani avevano cominciato a tremare.

Non molto. Un fremito sottile, come le foglie un attimo prima che arrivi il vento, quando l'aria è ancora ferma e loro già lo sanno. Aveva guardato le proprie dita posate sulle ginocchia e aveva pensato, con una tenerezza improvvisa e fuori luogo, che erano le stesse mani di quando aveva vent'anni. Le stesse unghie corte. Le stesse nocche piccole. Le stesse mani che avevano stretto Declan quella notte al porto, tanti anni prima, il freddo che saliva dall'acqua e nessuno dei due che sapeva ancora quanto sarebbe costato amarsi, e per quanto poco tempo li avrebbero lasciati in pace.

Aveva provato ad alzarsi.

Non ci riuscì.

Il corpo aveva deciso un'altra volta da solo, come sempre nei momenti che contavano davvero. Le gambe non risposero, la stanza girò lenta su un perno invisibile, e c'era nell'aria qualcosa di strano, un odore che non riusciva a mettere a posto, dolce e pesante insieme, che sembrava salire da dentro di lei più che dalla cucina. Provò a chiamare, ma la voce le uscì piccola, e non c'era nessuno ad ascoltarla.

Non pensò al veleno.

Non pensò a Fiona.

Pensò al bambino. Come sempre, quando il corpo cedeva, il pensiero le andava lì, dritto, senza passare da nessun'altra parte. Pensò a come avrebbe avuto forse le sue stesse mani. Le stesse nocche piccole. Si chiese, come si era chiesta mille volte in mille notti, di che colore avrebbe avuto gli occhi.

E pensò a Declan, che di lì a poco avrebbe bussato.

Avrebbe voluto dirgli una cosa sola, se solo fosse arrivato in tempo, se solo avesse potuto tenere aperta la porta ancora un minuto. Non ti ho lasciato andare. Sono rimasta nel punto esatto in cui ci siamo persi, ferma lì, ad aspettare che uno dei due trovasse la strada del ritorno. Avrei aspettato ancora. Avrei aspettato tutto il tempo che serviva.

Il pavimento le venne incontro piano, quasi con delicatezza, come se anche lui non volesse farle male.

Non fece rumore.

Gli occhi le restarono aperti. Aveva sempre dormito così, con gli occhi socchiusi sul buio, e Declan glielo aveva detto mille volte che quella cosa lo spaventava, svegliarsi accanto a una donna che sembrava guardarti nel sonno. Lei rideva ogni volta e gli rispondeva che era perché non voleva perdersi niente, neanche di notte, neanche i sogni degli altri.

Fuori la pioggia continuava, uguale, indifferente, la stessa di sempre.

Declan stava salendo le scale.

Lei non lo sapeva più.`;

/* ============ storage ============ */
const KEY='romanzo_data';
let mem=null;            // in-memory fallback if window.storage is missing
const hasStore = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');

async function storeGet(){
  if(!hasStore){ return mem; }
  try{ const r=await window.storage.get(KEY); return r? JSON.parse(r.value):null; }
  catch(e){ return null; }
}
async function storePut(obj){
  if(!hasStore){ mem=obj; return true; }
  try{ await window.storage.set(KEY, JSON.stringify(obj)); return true; }
  catch(e){ return false; }
}

/* ============ state ============ */
let data=null;
let view='capitoli';
let currentId=null;
let testoMode='modifica';
let filter='tutti';
let query='';
let saveTimer=null;

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const words=t=>{const s=(t||'').trim();return s?s.split(/\s+/).length:0;};
const statoClass=s=>({'Da scrivere':'st-scrivere','Bozza':'st-bozza','Rivisto':'st-rivisto','Definitivo':'st-definitivo'}[s]||'st-scrivere');

/* ============ save ============ */
function setSaveState(state){
  const chip=$('#savechip'), txt=$('#savetext');
  chip.classList.remove('saving','error');
  if(state==='saving'){chip.classList.add('saving');txt.textContent='Salvataggio in corso';}
  else if(state==='error'){chip.classList.add('error');txt.textContent=hasStore?'Errore di salvataggio':'Salvato solo in questa sessione';}
  else{txt.textContent=hasStore?'Tutto salvato':'Attivo (memoria locale)';}
}
function scheduleSave(){
  setSaveState('saving');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    data.updatedAt=Date.now();
    const ok=await storePut(data);
    setSaveState(ok?'saved':'error');
    renderProgress();
  },500);
}

/* ============ progress ============ */
function renderProgress(){
  const caps=data.capitoli;
  const pronti=caps.filter(c=>c.stato==='Rivisto'||c.stato==='Definitivo').length;
  const tot=caps.length;
  const w=caps.reduce((a,c)=>a+words(c.testo),0);
  const wtxt=w.toLocaleString('it-IT');
  $('#progress').textContent=`${pronti} capitoli pronti su ${tot}. Circa ${wtxt} parole scritte finora.`;
}

/* ============ index ============ */
function renderIndex(){
  const wrap=document.createElement('div');
  const caps=[...data.capitoli].sort((a,b)=>a.ordine-b.ordine);
  const q=query.trim().toLowerCase();
  caps.forEach(c=>{
    if(filter!=='tutti' && c.stato!==filter) return;
    if(q && !(c.titolo.toLowerCase().includes(q) || (c.sinossi||'').toLowerCase().includes(q) || c.personaggi.join(' ').toLowerCase().includes(q))) return;
    const b=document.createElement('button');
    b.className='chapter-row'+(c.id===currentId?' active':'');
    b.onclick=()=>{currentId=c.id;testoMode='modifica';render();};
    const w=words(c.testo);
    b.innerHTML=`<span class="num">${c.ordine}</span>
      <span class="ct"><span class="cti">${esc(c.titolo)}</span>
        <span class="meta"><span class="sdot ${statoClass(c.stato)}"></span>${esc(c.stato)}</span></span>
      <span class="wc">${w?w.toLocaleString('it-IT'):''}</span>`;
    wrap.appendChild(b);
  });
  if(!wrap.children.length){
    const e=document.createElement('p');e.className='hint';e.style.padding='10px 8px';
    e.textContent='Nessun capitolo con questi filtri.';wrap.appendChild(e);
  }
  return wrap;
}

/* ============ detail ============ */

  if(!c){d.className='placeholder-detail';d.textContent='Scegli un capitolo dall\u2019indice, oppure creane uno nuovo.';return d;}
  d.className='detail';

  const top=document.createElement('div');top.className='detail-top';
  const ti=document.createElement('input');ti.className='titlefield';ti.value=c.titolo;ti.setAttribute('aria-label','Titolo del capitolo');
  ti.oninput=()=>{c.titolo=ti.value;updateRowText(c);renderProgress();scheduleSave();};
  const acts=document.createElement('div');acts.className='detail-actions';
  const pdf=document.createElement('button');pdf.className='btn sm';pdf.textContent='Esporta PDF';pdf.onclick=()=>printChapter(c);
  const del=document.createElement('button');del.className='btn danger sm';del.textContent='Elimina';
  del.onclick=()=>{ if(confirm('Eliminare il capitolo \u201c'+c.titolo+'\u201d? L\u2019operazione non si pu\u00f2 annullare.')){
    data.capitoli=data.capitoli.filter(x=>x.id!==c.id); currentId=null; renderProgress(); scheduleSave(); render(); } };
  acts.append(pdf,del);

  const grid=document.createElement('div');grid.className='fieldgrid';

  grid.appendChild(field('Luogo', textField(c.luogo,v=>{c.luogo=v;scheduleSave();},'Dove si svolge')));
  grid.appendChild(field('Argomento', textField(c.argomento,v=>{c.argomento=v;scheduleSave();},'In una riga, di cosa tratta'),true));

  grid.appendChild(field('Sinossi', areaField(c.sinossi,v=>{c.sinossi=v;scheduleSave();},'Riassunto breve del capitolo','sinossi'),true));
  grid.appendChild(field('Note', areaField(c.note,v=>{c.note=v;scheduleSave();},'Appunti, dubbi, cose da verificare'),true));

  const th=document.createElement('div');th.className='testo-head';
  const h3=document.createElement('h3');h3.textContent='Testo';
  const seg=document.createElement('div');seg.className='seg';
  const bm=document.createElement('button');bm.textContent='Modifica';bm.className=testoMode==='modifica'?'on':'';
  const bl=document.createElement('button');bl.textContent='Lettura';bl.className=testoMode==='lettura'?'on':'';
  bm.onclick=()=>{testoMode='modifica';render();};
  bl.onclick=()=>{testoMode='lettura';render();};
  seg.append(bm,bl);
  const wcount=document.createElement('span');wcount.className='hint';wcount.style.marginLeft='auto';
  wcount.textContent=words(c.testo)?words(c.testo).toLocaleString('it-IT')+' parole':'vuoto';
  th.append(h3,seg,wcount);
  d.appendChild(th);

  if(testoMode==='lettura'){
    const r=document.createElement('div');r.className='reading';
    if((c.testo||'').trim()){
      c.testo.split(/\n\s*\n/).forEach(par=>{
        const p=document.createElement('p');p.textContent=par.trim();r.appendChild(p);
      });
    }else{
      const p=document.createElement('p');p.className='emptyreading';p.textContent='Ancora nessun testo. Incolla qui il capitolo quando è pronto.';r.appendChild(p);
    }
    d.appendChild(r);
  }else{
    const ta=document.createElement('textarea');ta.className='manuscript';ta.value=c.testo;
    ta.placeholder='Incolla o scrivi qui il testo del capitolo.';
    ta.oninput=()=>{c.testo=ta.value;wcount.textContent=words(c.testo)?words(c.testo).toLocaleString('it-IT')+' parole':'vuoto';updateRowText(c);renderProgress();scheduleSave();};
    d.appendChild(ta);
  }
  return d;
}

function field(labText,control,full){
  const f=document.createElement('div');f.className='field'+(full?' full':'');
  const l=document.createElement('label');l.className='lab';l.textContent=labText;
  f.append(l,control);return f;
}
function textField(val,on,ph){
  const i=document.createElement('input');i.type='text';i.value=val||'';i.placeholder=ph||'';
  i.oninput=()=>on(i.value);return i;
}
function areaField(val,on,ph,cls){
  const t=document.createElement('textarea');if(cls)t.className=cls;t.value=val||'';t.placeholder=ph||'';
  t.oninput=()=>on(t.value);return t;
}
function selectField(opts,val,on,cls){
  const s=document.createElement('select');if(cls)s.className=cls;
  opts.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;if(o===val)op.selected=true;s.appendChild(op);});
  s.onchange=()=>on(s.value);return s;
}
function tagField(c){
  const box=document.createElement('div');box.className='tagbox';
  const redraw=()=>{
    box.querySelectorAll('.tag').forEach(n=>n.remove());
    c.personaggi.forEach((name,idx)=>{
      const t=document.createElement('span');t.className='tag';t.textContent=name;
      const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Rimuovi '+name);
      x.onclick=()=>{c.personaggi.splice(idx,1);redraw();scheduleSave();};
      t.appendChild(x);box.insertBefore(t,inp);
    });
  };
  const inp=document.createElement('input');inp.placeholder='Aggiungi un nome e premi Invio';
  inp.onkeydown=e=>{
    if(e.key==='Enter'||e.key===','){e.preventDefault();const v=inp.value.trim();
      if(v && !c.personaggi.includes(v)){c.personaggi.push(v);inp.value='';redraw();scheduleSave();}}
    else if(e.key==='Backspace' && !inp.value && c.personaggi.length){c.personaggi.pop();redraw();scheduleSave();}
  };
  box.appendChild(inp);redraw();
  box.onclick=e=>{if(e.target===box)inp.focus();};
  return box;
}
function updateRowText(c){
  // targeted refresh of the index row without stealing focus
  const rows=$('#index');if(!rows)return;
  const btns=rows.querySelectorAll('.chapter-row');
  btns.forEach(b=>{
    if(b.querySelector('.num').textContent==String(c.ordine)){
      b.querySelector('.cti').textContent=c.titolo;
      const meta=b.querySelector('.meta');
      meta.innerHTML=`<span class="sdot ${statoClass(c.stato)}"></span>${esc(c.stato)}`;
      const w=words(c.testo);b.querySelector('.wc').textContent=w?w.toLocaleString('it-IT'):'';
    }
  });
}

/* ============ personaggi view ============ */
function renderCast(){
  const wrap=document.createElement('div');wrap.className='cast';
  const head=document.createElement('div');head.className='cast-head';
  const h=document.createElement('h2');h.textContent='Personaggi';
  const add=document.createElement('button');add.className='btn sm';add.textContent='Aggiungi personaggio';
  add.onclick=()=>{data.personaggi.push({id:'p'+Date.now(),nome:'Nuovo personaggio',ruolo:''});scheduleSave();render();};
  head.append(h,add);wrap.appendChild(head);
  const sub=document.createElement('p');sub.className='hint';sub.style.margin='0 0 18px';
  sub.textContent='Ogni scheda mostra in quali capitoli compare il personaggio, in base ai nomi indicati nei capitoli.';
  wrap.appendChild(sub);

  data.personaggi.forEach((p,idx)=>{
    const card=document.createElement('div');card.className='person';
    const top=document.createElement('div');top.className='person-top';
    const nm=document.createElement('input');nm.className='pname';nm.value=p.nome;
    nm.oninput=()=>{p.nome=nm.value;scheduleSave();};
    const rm=document.createElement('button');rm.className='btn danger sm';rm.textContent='Rimuovi';
    rm.onclick=()=>{if(confirm('Rimuovere '+p.nome+' dal cast?')){data.personaggi.splice(idx,1);scheduleSave();render();}};
    top.append(nm,rm);
    const role=document.createElement('input');role.className='prole';role.value=p.ruolo||'';role.placeholder='Ruolo, una riga di descrizione';
    role.oninput=()=>{p.ruolo=role.value;scheduleSave();};
    const app=document.createElement('div');app.className='appears';
    const inCh=data.capitoli.filter(c=>c.personaggi.some(n=>n.toLowerCase()===p.nome.trim().toLowerCase()))
      .sort((a,b)=>a.ordine-b.ordine);
    if(inCh.length){
      app.innerHTML='Compare in: '+inCh.map(c=>`<span class="apptag">${esc(c.titolo)}</span>`).join('');
    }else{
      app.innerHTML='<span class="none">Non ancora indicato in nessun capitolo.</span>';
    }
    card.append(top,role,app);wrap.appendChild(card);
  });

  // names used in chapters but not in roster
  const roster=data.personaggi.map(p=>p.nome.trim().toLowerCase());
  const loose=[];
  data.capitoli.forEach(c=>c.personaggi.forEach(n=>{
    if(!roster.includes(n.trim().toLowerCase()) && !loose.some(l=>l.toLowerCase()===n.toLowerCase())) loose.push(n);
  }));
  if(loose.length){
    const box=document.createElement('div');box.className='loose';
    const h4=document.createElement('h4');h4.textContent='Nomi citati nei capitoli ma non ancora nel cast';box.appendChild(h4);
    loose.forEach(n=>{
      const b=document.createElement('button');b.className='btn sm';b.style.margin='0 6px 6px 0';b.textContent='+ '+n;
      b.onclick=()=>{data.personaggi.push({id:'p'+Date.now(),nome:n,ruolo:''});scheduleSave();render();};
      box.appendChild(b);
    });
    wrap.appendChild(box);
  }
  return wrap;
}

/* ============ render ============ */
function render(){
  $('#tab-cap').classList.toggle('active',view==='capitoli');
  $('#tab-per').classList.toggle('active',view==='personaggi');
  const main=$('#main');main.innerHTML='';
  if(view==='personaggi'){main.appendChild(renderCast());return;}

  const ws=document.createElement('div');ws.className='workspace';
  const side=document.createElement('div');side.className='sidebar';

  const sh=document.createElement('div');sh.className='side-head';
  const h2=document.createElement('h2');h2.textContent='Indice';
  const nuovo=document.createElement('button');nuovo.className='btn sm';nuovo.textContent='Nuovo';
  nuovo.onclick=()=>{
    const ord=data.capitoli.reduce((m,c)=>Math.max(m,c.ordine),0)+1;
    const nc=CH(ord,'Nuovo capitolo');nc.id='c'+Date.now();
    data.capitoli.push(nc);currentId=nc.id;renderProgress();scheduleSave();render();
  };
  sh.append(h2,nuovo);side.appendChild(sh);

  const s=document.createElement('input');s.className='search';s.type='text';s.placeholder='Cerca per titolo, sinossi o personaggio';s.value=query;
  s.oninput=()=>{query=s.value;const idx=$('#index');const fresh=renderIndex();fresh.id='index';idx.replaceWith(fresh);};
  side.appendChild(s);

  const fr=document.createElement('div');fr.className='filterrow';fr.style.cssText='display:flex;gap:6px;flex-wrap:wrap;padding:0 2px 12px';
  ['tutti','Da scrivere','Bozza','Rivisto','Definitivo'].forEach(f=>{
    const b=document.createElement('button');b.className='chip-filter'+(filter===f?' active':'');
    b.textContent=f==='tutti'?'Tutti':f;
    b.onclick=()=>{filter=f;render();};fr.appendChild(b);
  });
  side.appendChild(fr);

  const idx=renderIndex();idx.id='index';side.appendChild(idx);

  ws.appendChild(side);
  ws.appendChild(renderDetail());
  main.appendChild(ws);
}

/* ============ print ============ */
function bodyParas(testo,container){
  const parts=(testo||'').split(/\n\s*\n/).filter(x=>x.trim());
  parts.forEach((par,i)=>{const p=document.createElement('p');if(i===0)p.className='first';p.textContent=par.trim();container.appendChild(p);});
}
function schedaHTML(c){
  const rows=[];
  if(c.argomento)rows.push(`<div class="r"><b>Argomento.</b> ${esc(c.argomento)}</div>`);
  if(c.luogo)rows.push(`<div class="r"><b>Luogo.</b> ${esc(c.luogo)}</div>`);
  if(c.personaggi.length)rows.push(`<div class="r"><b>Personaggi.</b> ${esc(c.personaggi.join(', '))}</div>`);
  if(c.sinossi)rows.push(`<div class="r"><b>Sinossi.</b> ${esc(c.sinossi)}</div>`);
  return rows.length?`<div class="pr-scheda">${rows.join('')}</div>`:'';
}
function doPrint(title){
  const prev=document.title;document.title=title;
  window.print();
  setTimeout(()=>{document.title=prev;$('#print-root').innerHTML='';},400);
}
function printChapter(c){
  const root=$('#print-root');root.innerHTML='';
  const ch=document.createElement('div');ch.className='pr-chapter';ch.style.pageBreakBefore='avoid';
  const h=document.createElement('h2');h.textContent=c.titolo;ch.appendChild(h);
  ch.insertAdjacentHTML('beforeend',schedaHTML(c));
  const body=document.createElement('div');body.className='pr-body';bodyParas(c.testo,body);ch.appendChild(body);
  root.appendChild(ch);
  doPrint((data.titolo||'Romanzo')+' - '+c.titolo);
}
function printAll(){
  const root=$('#print-root');root.innerHTML='';
  const tp=document.createElement('div');tp.className='pr-titlepage';
  tp.innerHTML=`<h1>${esc(data.titolo||'Senza titolo')}</h1><div class="pr-sub">romanzo di ${esc(data.autore||'')}</div>`;
  root.appendChild(tp);
  [...data.capitoli].sort((a,b)=>a.ordine-b.ordine).forEach(c=>{
    const ch=document.createElement('div');ch.className='pr-chapter';
    const h=document.createElement('h2');h.textContent=c.titolo;ch.appendChild(h);
    ch.insertAdjacentHTML('beforeend',schedaHTML(c));
    const body=document.createElement('div');body.className='pr-body';
    if((c.testo||'').trim())bodyParas(c.testo,body);
    else{const p=document.createElement('p');p.style.fontStyle='italic';p.style.color='#777';p.textContent='[Capitolo ancora da scrivere.]';body.appendChild(p);}
    ch.appendChild(body);root.appendChild(ch);
  });
  doPrint(data.titolo||'Romanzo');
}

/* ============ backup ============ */
function exportJson(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  const d=new Date().toISOString().slice(0,10);
  a.href=url;a.download='romanzo-backup-'+d+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importJson(file){
  const fr=new FileReader();
  fr.onload=()=>{try{
    const obj=JSON.parse(fr.result);
    if(!obj.capitoli)throw new Error('formato');
    if(!confirm('Ripristinare questo backup? I dati attuali verranno sostituiti.'))return;
    data=obj;currentId=null;renderProgress();bindHeader();scheduleSave();render();
  }catch(e){alert('File non valido. Serve un backup esportato da questo studio.');}};
  fr.readAsText(file);
}

/* ============ header binding ============ */
function bindHeader(){
  const bt=$('#booktitle');bt.value=data.titolo||'';
  bt.oninput=()=>{data.titolo=bt.value;scheduleSave();};
  const au=$('#autore');au.value=data.autore||'';
  au.oninput=()=>{data.autore=au.value;scheduleSave();};
}

/* ============ init ============ */
async function init(){
  let stored=await storeGet();
  if(!stored){ data=SEED; await storePut(data); }
  else{ data=stored; }
  bindHeader();
  renderProgress();
  setSaveState('saved');
  render();

  $('#tab-cap').onclick=()=>{view='capitoli';render();};
  $('#tab-per').onclick=()=>{view='personaggi';render();};
  $('#exportAll').onclick=printAll;
  $('#exportJson').onclick=exportJson;
  $('#importBtn').onclick=()=>$('#importFile').click();
  $('#importFile').onchange=e=>{if(e.target.files[0])importJson(e.target.files[0]);e.target.value='';};

  if(!currentId){const first=[...data.capitoli].sort((a,b)=>a.ordine-b.ordine)[0];if(first)currentId=first.id;render();}
}
init();
</script>
